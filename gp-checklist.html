<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Checklist</title>
<style>
:root{
  --ink:#141210; --panel:#1b1815; --panel2:#221e1a; --line:#2c2722;
  --gold:#c9a24b; --gold-soft:#d8bd78; --grey:#9a8f7e; --text:#f5f0e6;
  --red:#e05a54; --green:#3fae6b; --blue:#4a78c0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:90px}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 4px;position:sticky;top:0;background:var(--ink);z-index:30;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.topbar .sub{font-size:11px;color:var(--gold-soft)}
.back-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.spacer{flex:1}

.btn{background:linear-gradient(135deg,var(--gold),#8a5f1e);border:none;color:#1a1408;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--panel2);border:1px solid var(--red);color:var(--red)}
.btn.ok{background:linear-gradient(135deg,var(--green),#247a47);color:#fff}
.btn.full{width:100%}
.mini{padding:7px 11px;font-size:12.5px;border-radius:8px}

.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.type-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.15s;position:relative}
.type-card:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.type-card .ico{font-size:30px;margin-bottom:10px}
.type-card h3{font-size:16px;margin-bottom:5px}
.type-card p{font-size:12.5px;color:var(--grey);line-height:1.5}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.panel h3{font-size:14px;color:var(--gold-soft);margin-bottom:12px;letter-spacing:.4px;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--grey);margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;background:#13110e;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:44px;color-scheme:dark}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);opacity:1;cursor:pointer;font-size:18px}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--grey);margin-top:3px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}

/* petrol segmented */
.seg{display:flex;gap:6px;margin-top:4px}
.seg button{flex:1;background:#13110e;border:1.5px solid var(--line);color:var(--text);border-radius:8px;padding:10px 0;font-size:15px;font-weight:700;cursor:pointer}
.seg button.on{background:linear-gradient(135deg,var(--gold),#8a5f1e);color:#1a1408;border-color:var(--gold)}

/* yes/no toggles */
.yn{display:flex;gap:8px;margin-top:4px}
.yn button{flex:1;background:#13110e;border:1.5px solid var(--line);color:var(--grey);border-radius:8px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer}
.yn button.yes.on{background:#1f3a28;border-color:var(--green);color:#7be0a0}
.yn button.no.on{background:#3a1f1f;border-color:var(--red);color:#ec8d88}
.chk-q{font-size:13px;line-height:1.5;margin-bottom:6px}
.chk-block{padding:12px 0;border-bottom:1px solid var(--line)}
.chk-block:last-child{border-bottom:none}

/* car diagram defect tool */
.defect-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.defect-bar button{flex:1;min-width:60px;border:2px solid var(--line);background:#13110e;color:var(--text);border-radius:9px;padding:9px 6px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.2}
.defect-bar button small{display:block;font-size:9px;font-weight:600;opacity:.8}
.defect-bar button.on{box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.diagram-wrap{background:#fff;border-radius:12px;padding:8px;position:relative;touch-action:manipulation;overflow:hidden}
.diagram-wrap svg{display:block;width:100%;height:auto}
.diag-actions{display:flex;gap:8px;margin-top:10px}
.marker-count{font-size:12px;color:var(--grey);margin-top:6px}

/* photos */
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.photo-slot{background:#13110e;border:1.5px dashed var(--line);border-radius:10px;padding:10px;text-align:center;position:relative;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.photo-slot.filled{border-style:solid;border-color:var(--green);padding:0;overflow:hidden}
.photo-slot img{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}
.photo-slot .lbl{font-size:11px;color:var(--grey);font-weight:600}
.photo-slot .ico{font-size:22px;margin-bottom:4px;opacity:.7}
.photo-slot .rm{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);border:1px solid var(--red);color:var(--red);border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer;z-index:2}
.photo-slot input[type="file"]{display:none}
.bulk-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bulk-btn{cursor:pointer;display:inline-flex;align-items:center}
.bulk-btn input[type="file"]{display:none}

/* signature pad */
.sigwrap{margin-top:8px}
.sigpad{width:100%;height:185px;background:#fff;border:2px solid var(--line);border-radius:10px;touch-action:none;display:block}
.sig-actions{display:flex;gap:8px;margin-top:6px}

/* list / pending */
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .meta b{font-size:14px}
.rec .meta small{color:var(--grey);font-size:12px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.wait{background:#2a3550;border:1px solid var(--blue);color:#9cc0ff}
.pill.done{background:#1f3a28;border:1px solid var(--green);color:#7be0a0}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumrow:last-child{border-bottom:none}
.sumrow>span{color:var(--grey);font-weight:600;flex:0 0 90px}
.sumrow>div{text-align:right;flex:1}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%;text-align:center}
#toast.show{opacity:1}
.stage-tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;margin-left:6px}
.stage-tag.out{background:#3a3320;border:1px solid var(--gold);color:var(--gold-soft)}
.stage-tag.in{background:#1f3a28;border:1px solid var(--green);color:#7be0a0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-btn" href="index.html">‹ Hub</a>
    <div>
      <h1>GP Checklist</h1>
      <div class="sub" id="sub">Vehicle inspection</div>
    </div>
    <div class="spacer"></div>
    <button class="btn sec mini" id="listBtn" onclick="showPending()" style="display:none">Pending</button>
  </div>
  <div id="view"></div>
</div>
<div id="toast"></div>

<script src="supa.js"></script>
<script>
/* ============ GP CHECKLIST ============ */
var SB_URL = (typeof SUPABASE_URL!=='undefined' && SUPABASE_URL) || '';
var SB_KEY = (typeof SUPABASE_ANON_KEY!=='undefined' && SUPABASE_ANON_KEY) ||
             (typeof SUPABASE_KEY!=='undefined' && SUPABASE_KEY) || '';
function sbBase(){ return (SB_URL||'').replace(/\/rest\/v1\/?$/,''); }
function sbHeaders(extra){ return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, extra||{}); }
var CLOUD = !!(SB_URL && SB_KEY);

var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwcGj9D1K4UHrlBVcQAC-xf1_BIYEANq62ldCzVtr2WQ_GnGq6eq5Up5Uqfpl2RIFU/exec';

/* ---- Supabase REST ---- */
async function sbUpsert(row){
  if(!CLOUD) return false;
  const r = await fetch(sbBase()+'/rest/v1/gp_checklists?on_conflict=id', {
    method:'POST', headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(row)
  });
  if(!r.ok){
    let msg='';
    try{ msg=await r.text(); }catch(e){}
    window.__lastSbError = r.status+' '+msg;
    console.error('sbUpsert failed:', r.status, msg);
  }
  return r.ok;
}
async function sbPending(){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+"/rest/v1/gp_checklists?status=eq.awaiting_return&select=*&order=created_at.desc", {headers:sbHeaders()});
  if(!r.ok) return []; return await r.json();
}
async function sbAll(){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+"/rest/v1/gp_checklists?select=*&order=created_at.desc", {headers:sbHeaders()});
  if(!r.ok) return []; return await r.json();
}

/* ===== LOAD FROM AGREEMENT ===== */
async function sbAgreements(){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+"/rest/v1/gp_agreements?type=eq.lease&select=*&order=created_at.desc", {headers:sbHeaders()});
  if(!r.ok) return [];
  return await r.json();
}
async function openAgreementPicker(){
  toast('Loading agreements…');
  const rows = await sbAgreements();
  const ov=document.createElement('div');
  ov.id='agreementPicker';
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;flex-direction:column;padding:18px;overflow:auto';
  let inner=`<div style="max-width:560px;margin:0 auto;width:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="color:var(--gold-soft);font-weight:800;font-size:16px">Pick an agreement</div>
      <button class="btn sec mini" onclick="closeAgreementPicker()">Close</button>
    </div>`;
  if(!rows.length){
    inner+=`<p style="color:var(--grey)">No leasing agreements found.</p>`;
  } else {
    inner+=rows.map(r=>{
      const d=r.data||{};
      return `<div onclick='fillFromAgreement(${JSON.stringify(JSON.stringify(r)).replace(/'/g,"&#39;")})' style="background:#13110e;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer">
        <div style="color:var(--text);font-weight:700">${esc(d.lessee_name||r.lessee_name||'(no name)')} ${(d.v_reg||r.reg_no)?('· '+esc(d.v_reg||r.reg_no)):''}</div>
        <div style="color:var(--grey);font-size:12px;margin-top:2px">${esc(d.v_make_model||'')} ${d.lease_from?('· '+esc(d.lease_from)):''} ${r.status?('· '+esc(r.status)):''}</div>
      </div>`;
    }).join('');
  }
  inner+=`</div>`;
  ov.innerHTML=inner;
  document.body.appendChild(ov);
}
function closeAgreementPicker(){ const o=$('agreementPicker'); if(o) o.remove(); }

function fillFromAgreement(rowJson){
  let r; try{ r=JSON.parse(rowJson); }catch(e){ toast('Could not read agreement'); return; }
  const d=r.data||{};
  const a=STATE.current;
  a.plan='lease';
  a.customer_name   = d.lessee_name || '';
  a.customer_contact= d.contact || a.customer_contact || '';
  a.car_model       = d.v_make_model || '';
  a.car_plate       = d.v_reg || r.reg_no || '';
  a.fuel_type       = d.petrol_type || a.fuel_type;
  // lease dates + duration + pricing carried from agreement (and its booking)
  a.out_date        = a.out_date || (d.lease_from||'');
  a.lease_from      = d.lease_from || '';
  a.lease_to        = d.lease_to || '';
  a.duration_days   = d.duration_days || '';
  a.leasing_price   = d.leasing_price || '';
  a.deposit         = d.deposit || '';
  a.mileage_given   = d.mileage_given || '';
  a.per_km          = d.per_km || '';
  a.from_agreement_id = r.id;
  closeAgreementPicker();
  showForm();
  toast('Loaded from agreement ✓');
}
async function sbByPlate(plate){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+"/rest/v1/gp_checklists?car_plate=eq."+encodeURIComponent(plate)+"&select=*&order=created_at.desc", {headers:sbHeaders()});
  if(!r.ok) return []; return await r.json();
}
async function sbGet(id){
  if(!CLOUD) return null;
  const r = await fetch(sbBase()+"/rest/v1/gp_checklists?id=eq."+encodeURIComponent(id)+"&select=*", {headers:sbHeaders()});
  if(!r.ok) return null; const rows=await r.json(); return rows[0]||null;
}
async function sbDelete(id){
  if(!CLOUD) return false;
  const r = await fetch(sbBase()+"/rest/v1/gp_checklists?id=eq."+encodeURIComponent(id), {
    method:'DELETE', headers:sbHeaders({'Prefer':'return=minimal'})
  });
  return r.ok;
}

/* ---- helpers ---- */
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function uid(){return 'cl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function nowTime(){const d=new Date();return d.toTimeString().slice(0,5);}
function upper(el){const s=el.selectionStart;el.value=el.value.toUpperCase();try{el.setSelectionRange(s,s);}catch(e){}}
function phoneFmt(el){
  // Malaysian mobile: 0XX-XXX XXXX (10 digits) or 0XX-XXXX XXXX (11 digits, e.g. 011)
  let d=(el.value||'').replace(/\D/g,'').slice(0,11);
  let out=d;
  if(d.length>3){
    const pre=d.slice(0,3);
    const rest=d.slice(3);
    if(d.length<=10){ // 0XX-XXX XXXX
      out=pre+'-'+rest.replace(/^(\d{3})(\d{0,4}).*/,(m,a,b)=>b?a+' '+b:a);
    } else { // 11 digits 0XX-XXXX XXXX
      out=pre+'-'+rest.replace(/^(\d{4})(\d{0,4}).*/,(m,a,b)=>b?a+' '+b:a);
    }
  }
  el.value=out;
}
function curUser(){try{const u=new URLSearchParams(location.search).get('u');return u||'staff';}catch(e){return 'staff';}}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2600);}
function setSub(s){$('sub').textContent=s;}
const PLAN_NAME={lease:'Car Leasing',lto:'Lease to Own',subscription:'Subscription'};

var STATE={view:'chooser',current:null,stage:'out'};

/* ---- defect types ---- */
const DEFECTS={
  D:{name:'Dent',color:'#e0322f'},
  S:{name:'Scratch',color:'#2f6fe0'},
  PG:{name:'Paint Gone',color:'#e08a2f'},
  SC:{name:'Stonechip',color:'#7d3fe0'},
  C:{name:'Cracked',color:'#2fae5a'},
  ND:{name:'New Damage',color:'#e0322f'}
};
var activeDefect='D';

/* ====== CHOOSER ====== */
function showChooser(){
  STATE.view='chooser'; setSub('Choose action'); $('listBtn').style.display='';
  $('view').innerHTML = `
    <div class="chooser">
      <div class="type-card" onclick="startDelivery()">
        <div class="ico">📤</div><h3>New Delivery (OUT)</h3>
        <p>Inspect a vehicle going out to the customer. Mark defects, take photos, both sign.</p>
      </div>
      <div class="type-card" onclick="showPending()">
        <div class="ico">📥</div><h3>Return (BACK)</h3>
        <p>Car came back? Find the open checklist by plate and do the return inspection.</p>
      </div>
      <div class="type-card" onclick="showHistory()">
        <div class="ico">📚</div><h3>History</h3>
        <p>All jobs ever done. Search by plate or customer, open to see both PDFs and the return summary.</p>
      </div>
    </div>`;
}

/* ====== MODELS ====== */
function blankChecklist(){
  return {
    id:uid(), plan:'lease', car_type:'sedan', status:'awaiting_return', created_by:curUser(), created_at:todayISO(),
    customer_name:'', customer_contact:'', car_model:'', car_plate:'',
    out_date:todayISO(), out_time:nowTime(), out_mileage:'', out_petrol:0,
    out_defects:[], out_checks:{}, out_photos:[], out_sig_inspector:'', out_sig_customer:'', out_pdf_url:'',
    in_date:'', in_time:'', in_mileage:'', in_petrol:0,
    in_defects:[], in_checks:{}, in_photos:[], in_sig_inspector:'', in_sig_customer:'', in_pdf_url:''
  };
}

function startDelivery(){
  STATE.current=blankChecklist(); STATE.stage='out';
  showForm();
}

/* ====== PENDING RETURNS (search by plate) ====== */
async function showPending(){
  STATE.view='pending'; setSub('Pending returns'); $('listBtn').style.display='none';
  $('view').innerHTML=`
    <div class="panel">
      <h3>Find Car to Return</h3>
      <label>Search by car plate</label>
      <input id="searchPlate" placeholder="e.g. VNS31" oninput="upper(this);filterPending()">
      <div id="pendBody" style="margin-top:12px">Loading…</div>
    </div>
    <button class="btn sec full" style="margin-top:14px" onclick="showChooser()">‹ Back</button>`;
  const rows=await sbPending();
  window._pending=rows;
  renderPending(rows);
}
function filterPending(){
  const q=($('searchPlate').value||'').trim().toUpperCase();
  const rows=(window._pending||[]).filter(r=>!q || (r.car_plate||'').toUpperCase().includes(q));
  renderPending(rows);
}
function renderPending(rows){
  const b=$('pendBody'); if(!b) return;
  if(!rows.length){ b.innerHTML='<p style="color:var(--grey);font-size:13px">No cars awaiting return.</p>'; return; }
  b.innerHTML=rows.map(r=>`
    <div class="rec">
      <div class="meta"><b>${esc(r.car_plate||'(no plate)')}</b> <span class="pill wait">Awaiting return</span><br>
        <small>${esc(r.car_model||'')} · ${esc(r.customer_name||'')} · ${PLAN_NAME[r.plan]||r.plan} · out ${esc(r.out_date||'')}</small></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ok mini" onclick="openReturn('${r.id}')">Do Return ›</button>
        <button class="btn danger mini" onclick="deleteChecklist('${r.id}','${esc(r.car_plate||'')}')">🗑 Delete</button>
      </div>
    </div>`).join('');
}
async function deleteChecklist(id, plate){
  if(!confirm('Delete EVERYTHING for '+(plate||'this record')+'?\n\nThis removes the record, both PDFs, the photos folder and the log rows. This cannot be undone.')) return;
  toast('Deleting…');
  // 1) ask Apps Script to remove Drive PDFs/photos + Sheet rows
  try{
    await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({ action:'delete', id:id })});
  }catch(e){ /* continue to remove the Supabase row regardless */ }
  // 2) remove the Supabase row
  try{ await sbDelete(id); }catch(e){}
  toast('Deleted ✓');
  // refresh whichever screen we came from
  if(STATE.view==='historyDetail' || STATE.view==='history'){ showHistory(); }
  else { showPending(); }
}
async function openReturn(id){
  const r=await sbGet(id); if(!r){ toast('Not found'); return; }
  STATE.current=r; STATE.stage='in';
  if(!r.in_date) STATE.current.in_date=todayISO();
  if(!r.in_time) STATE.current.in_time=nowTime();
  showForm();
}

/* ====== HISTORY (all jobs) ====== */
async function showHistory(){
  STATE.view='history'; setSub('History — all jobs'); $('listBtn').style.display='none';
  $('view').innerHTML=`
    <div class="panel">
      <h3>All Jobs</h3>
      <label>Search by plate or customer</label>
      <input id="histSearch" placeholder="e.g. VNS31 or John" oninput="filterHistory()">
      <div id="histBody" style="margin-top:12px">Loading…</div>
    </div>
    <button class="btn sec full" style="margin-top:14px" onclick="showChooser()">‹ Back</button>`;
  const rows=await sbAll();
  window._history=rows;
  renderHistory(rows);
}
function filterHistory(){
  const q=($('histSearch').value||'').trim().toUpperCase();
  const rows=(window._history||[]).filter(r=>!q ||
    (r.car_plate||'').toUpperCase().includes(q) ||
    (r.customer_name||'').toUpperCase().includes(q));
  renderHistory(rows);
}
function renderHistory(rows){
  const b=$('histBody'); if(!b) return;
  if(!rows.length){ b.innerHTML='<p style="color:var(--grey);font-size:13px">No jobs found.</p>'; return; }
  b.innerHTML=rows.map(r=>{
    const done=r.status==='completed';
    const tag=done?'<span class="pill done">Completed</span>':'<span class="pill wait">Awaiting return</span>';
    return `
    <div class="rec" onclick="showHistoryDetail('${r.id}')" style="cursor:pointer">
      <div class="meta"><b>${esc(r.car_plate||'(no plate)')}</b> ${tag}<br>
        <small>${esc(r.customer_name||'(no name)')}</small></div>
      <div><button class="btn sec mini" onclick="event.stopPropagation();showHistoryDetail('${r.id}')">View ›</button></div>
    </div>`;
  }).join('');
}
async function showHistoryDetail(id){
  const r=(window._history||[]).find(x=>x.id===id) || await sbGet(id);
  if(!r){ toast('Not found'); return; }
  STATE.view='historyDetail'; setSub('Job detail');

  // ---- summary calcs ----
  const ob=parseInt(r.out_mileage,10), ib=parseInt(r.in_mileage,10);
  let mileageRow='<span style="color:var(--grey)">Not returned yet</span>';
  if(!isNaN(ob)&&!isNaN(ib)){
    const used=ib-ob;
    mileageRow = used>=0
      ? `${used.toLocaleString()} km used <small style="color:var(--grey)">(${ob.toLocaleString()} → ${ib.toLocaleString()})</small>`
      : `<span style="color:#e06">Check: return reading lower than delivery</span>`;
  }

  const op=Number(r.out_petrol)||0, ip=Number(r.in_petrol)||0;
  let petrolRow='<span style="color:var(--grey)">Not returned yet</span>';
  if(r.status==='completed'){
    const diff=ip-op;
    if(diff===0) petrolRow=`Returned same level (${op}/5) ✓`;
    else if(diff<0) petrolRow=`<span style="color:#e06">Short by ${Math.abs(diff)} bar — RM80 fuel charge applies</span> <small style="color:var(--grey)">(${op}/5 → ${ip}/5)</small>`;
    else petrolRow=`Returned higher (${op}/5 → ${ip}/5)`;
  }

  // new damage: from return-stage check, plus whether extra defects were marked on return
  let damageRow='<span style="color:var(--grey)">Not returned yet</span>';
  if(r.status==='completed'){
    const nd=(r.in_checks&&r.in_checks.new_damage);
    const extraMarks=(r.in_defects&&r.in_defects.length)?r.in_defects.length:0;
    if(nd===true) damageRow=`<span style="color:#e06">⚠️ New damage reported${extraMarks?` · ${extraMarks} mark(s) on diagram`:''}</span>`;
    else if(nd===false) damageRow=`No new damage ✓${extraMarks?` <small style="color:var(--grey)">(but ${extraMarks} mark(s) on return diagram)</small>`:''}`;
    else damageRow=extraMarks?`${extraMarks} mark(s) on return diagram`:'<span style="color:var(--grey)">Not recorded</span>';
  }

  const pdfBtn=(url,label)=> url
    ? `<a class="btn ok" href="${esc(url)}" target="_blank" style="text-decoration:none;display:block;width:100%;box-sizing:border-box;text-align:center;margin:0">${label} ›</a>`
    : `<div class="btn sec" style="display:block;width:100%;box-sizing:border-box;text-align:center;margin:0;opacity:.5;cursor:default">${label} — not available</div>`;

  $('view').innerHTML=`
    <div class="panel">
      <h3>${esc(r.car_plate||'(no plate)')} · ${esc(r.customer_name||'')}</h3>
      <p class="hint" style="margin-bottom:14px">${esc(r.car_model||'')} · ${PLAN_NAME[r.plan]||r.plan} · ${r.status==='completed'?'Completed':'Awaiting return'}</p>

      <div style="display:flex;flex-direction:column;gap:10px">
        ${pdfBtn(r.out_pdf_url,'📤 Delivery checklist PDF')}
        ${pdfBtn(r.in_pdf_url,'📥 Return checklist PDF')}
      </div>

      <div class="panel" style="margin-top:14px;background:var(--bg2,#1a1a1a)">
        <h4 style="margin:0 0 10px">Return summary</h4>
        <div class="sumrow"><span>Mileage</span><div>${mileageRow}</div></div>
        <div class="sumrow"><span>Petrol</span><div>${petrolRow}</div></div>
        <div class="sumrow"><span>New damage</span><div>${damageRow}</div></div>
      </div>

      ${r.status!=='completed'?`<button class="btn ok full" style="margin-top:14px" onclick="openReturn('${r.id}')">Do Return now ›</button>`:''}
      <button class="btn danger full" style="margin-top:14px" onclick="deleteChecklist('${r.id}','${esc(r.car_plate||'')}')">🗑 Delete this job</button>
    </div>
    <button class="btn sec full" style="margin-top:14px" onclick="showHistory()">‹ Back to history</button>`;
}

function chkBlock(key,q){
  const v=(f('checks')||{})[key];
  return `<div class="chk-block" data-ckey="${key}">
    <div class="chk-q">${esc(q)}</div>
    <div class="yn">
      <button type="button" class="yes ${v===true?'on':''}" onclick="setChk('${key}',true)">YES</button>
      <button type="button" class="no ${v===false?'on':''}" onclick="setChk('${key}',false)">NO</button>
    </div></div>`;
}
// Return-stage Y/N block (same markup, different keys handled by data-ckey)
function chkBlockYN(key,q){ return chkBlock(key,q); }
function setChk(key,val){
  const c=Object.assign({}, f('checks')||{}); c[key]=val; STATE.current[P()+'_checks']=c;
  // toggle just this block's buttons in place (find by data-ckey — works for both stages)
  const block=document.querySelector('.chk-block[data-ckey="'+key+'"]');
  if(block){
    const yes=block.querySelector('.yes'), no=block.querySelector('.no');
    yes.classList.toggle('on',val===true); no.classList.toggle('on',val===false);
  }
}
function setCarType(k){
  STATE.current.car_type=k;
  [...document.querySelectorAll('#carTypeSeg button')].forEach((b,i)=>b.classList.toggle('on',CAR_TYPES[i].k===k));
  // swap the diagram image, keep markers
  const wrap=$('diagramWrap');
  if(wrap){ wrap.innerHTML=carSvg(k); renderMarkers(); }
}
function distanceText(a){
  const b=parseInt(a.out_mileage,10), e=parseInt(a.in_mileage,10);
  if(isNaN(b)||isNaN(e)) return '-';
  const d=e-b;
  return (d>=0?d:'(check)')+(d>=0?' km':'');
}
function updateDistance(){
  const a=STATE.current;
  a.in_mileage=g('f_mileage');
  const el=$('distanceUsed'); if(el) el.value=distanceText(a);
}
function setPetrol(n){ STATE.current[P()+'_petrol']=n;
  [...document.querySelectorAll('#petrolSeg button')].forEach((b,i)=>b.classList.toggle('on',i+1===n));
}

/* Car-type images. Sedan uses the current 4-view image. SUV / MPV reuse sedan
   until Jimmy uploads proper 5-view images — just paste a new base64 below. */
const CAR_IMAGES = { sedan: CAR_IMG_SEDAN, suv: CAR_IMG_SUV, mpv: CAR_IMG_MPV };
const CAR_TYPES  = [ {k:'sedan',name:'Sedan'}, {k:'suv',name:'SUV'}, {k:'mpv',name:'MPV'} ];

function carSvg(carType){
  const t = (CAR_IMAGES[carType]?carType:'sedan');
  const img = CAR_IMAGES[t];
  const d = CAR_DIMS[t] || {w:751,h:976};
  return `<svg id="carSvg" viewBox="0 0 ${d.w} ${d.h}" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <image href="${img}" xlink:href="${img}" x="0" y="0" width="${d.w}" height="${d.h}"/>
  <g id="oldMarkerLayer"></g>
  <g id="markerLayer"></g>
</svg>`;
}

function setDefect(k){
  activeDefect=k;
  [...document.querySelectorAll('#defectBar button')].forEach(b=>{
    const on=b.getAttribute('data-k')===k;
    b.classList.toggle('on',on);
    b.style.borderColor = on ? DEFECTS[k].color : 'var(--line)';
  });
}
function diagramTap(ev){
  const svg=$('carSvg'); if(!svg) return;
  const pt=svg.createSVGPoint();
  const touch=ev.touches?ev.touches[0]:ev;
  pt.x=touch.clientX; pt.y=touch.clientY;
  const ctm=svg.getScreenCTM(); if(!ctm) return;
  const loc=pt.matrixTransform(ctm.inverse());
  const arr=f('defects')||[];
  arr.push({x:Math.round(loc.x),y:Math.round(loc.y),code:activeDefect});
  STATE.current[P()+'_defects']=arr;
  renderMarkers();
}
function renderMarkers(){
  const layer=$('markerLayer'); if(!layer) return;
  // On return: draw delivery defects faded/grey in the old layer
  const oldLayer=$('oldMarkerLayer');
  if(oldLayer){
    if(STATE.stage==='in'){
      const old=STATE.current.out_defects||[];
      oldLayer.innerHTML=old.map(m=>
        `<g opacity="0.35"><circle cx="${m.x}" cy="${m.y}" r="13" fill="#888" stroke="#fff" stroke-width="2"/>`+
        `<text x="${m.x}" y="${m.y+4}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">${m.code}</text></g>`
      ).join('');
    } else { oldLayer.innerHTML=''; }
  }
  const arr=f('defects')||[];
  layer.innerHTML=arr.map(m=>{
    const col=(DEFECTS[m.code]||{}).color||'#e0322f';
    return `<g><circle cx="${m.x}" cy="${m.y}" r="13" fill="${col}" stroke="#fff" stroke-width="2"/>`+
      `<text x="${m.x}" y="${m.y+4}" text-anchor="middle" font="700 11px sans-serif" font-size="11" font-weight="700" fill="#fff">${m.code}</text></g>`;
  }).join('');
  const mc=$('markerCount'); if(mc) mc.textContent=arr.length?(arr.length+(STATE.stage==='in'?' new damage':' defect')+(arr.length>1?'s':'')+' marked'):(STATE.stage==='in'?'No new damage marked':'No defects marked');
}
function undoDefect(){ const arr=f('defects')||[]; arr.pop(); STATE.current[P()+'_defects']=arr; renderMarkers(); }
function clearDefects(){ STATE.current[P()+'_defects']=[]; renderMarkers(); }

/* ====== PHOTOS ====== */
const PHOTO_SLOTS=['Rim — Front Left','Rim — Front Right','Rim — Rear Left','Rim — Rear Right','Side — Front','Side — Rear','Side — Left','Side — Right','Current Mileage','Current Petrol Bar'];
function photoSlot(lbl,i){
  return `<label class="photo-slot" id="slot${i}" for="file${i}">
      <div class="ico">📷</div><div class="lbl">${esc(lbl)}</div>
      <input type="file" id="file${i}" accept="image/*" onchange="onPhoto(${i},this)">
    </label>`;
}
function onPhoto(i,input){
  const file=input.files&&input.files[0]; if(!file) return;
  downscalePhoto(file,data=>{
    const arr=(f('photos')||[]).slice();
    arr[i]={label:PHOTO_SLOTS[i],data:data};
    STATE.current[P()+'_photos']=arr;
    refreshPhotoSlots();
  });
}
/* shared: read a File, downscale to <=1000px JPEG, return data URL via callback */
function downscalePhoto(file,cb){
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const max=1000; let w=img.width,h=img.height;
      if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.78));
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
/* bulk: fill EMPTY slots in [start,end) with the selected files, in order */
function onBulkPhotos(input,start,end){
  const files=[...(input.files||[])];
  if(!files.length) return;
  const arr=(f('photos')||[]).slice();
  // collect the empty slot indexes in this group
  let slots=[]; for(let i=start;i<end;i++){ if(!(arr[i]&&arr[i].data)) slots.push(i); }
  if(!slots.length){ toast('Those slots are already filled — remove one to replace'); input.value=''; return; }
  const use=files.slice(0,slots.length);
  if(files.length>slots.length) toast('Only '+slots.length+' empty slot(s) here — extra photos ignored');
  let done=0;
  use.forEach((file,k)=>{
    const slotIdx=slots[k];
    downscalePhoto(file,data=>{
      const cur=(f('photos')||[]).slice();
      cur[slotIdx]={label:PHOTO_SLOTS[slotIdx],data:data};
      STATE.current[P()+'_photos']=cur;
      done++;
      if(done===use.length){ refreshPhotoSlots(); toast(done+' photo(s) added'); }
    });
  });
  input.value=''; // allow re-selecting same files later
}
function refreshPhotoSlots(){
  const arr=f('photos')||[];
  PHOTO_SLOTS.forEach((lbl,i)=>{
    const slot=$('slot'+i); if(!slot) return;
    const p=arr[i];
    if(p&&p.data){
      slot.classList.add('filled');
      slot.innerHTML=`<span class="rm" onclick="rmPhoto(event,${i})">✕</span><img src="${p.data}"><input type="file" id="file${i}" accept="image/*" onchange="onPhoto(${i},this)">`;
    }
  });
}
function rmPhoto(ev,i){
  ev.preventDefault(); ev.stopPropagation();
  const arr=(f('photos')||[]).slice(); arr[i]=null; STATE.current[P()+'_photos']=arr;
  const slot=$('slot'+i); if(slot){ slot.classList.remove('filled'); slot.innerHTML=`<div class="ico">📷</div><div class="lbl">${esc(PHOTO_SLOTS[i])}</div><input type="file" id="file${i}" accept="image/*" onchange="onPhoto(${i},this)">`; }
}
function photoCount(){ return (f('photos')||[]).filter(p=>p&&p.data).length; }

/* ====== SIGNATURE PADS ====== */
var PADS={};
function initPad(id){
  const c=$(id); if(!c) return; const r=c.getBoundingClientRect();
  c.width=r.width*2; c.height=r.height*2;
  const ctx=c.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  let drawing=false,last=null,dirty=false;
  function pos(e){ const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left,y:t.clientY-rect.top}; }
  function down(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing)return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; e.preventDefault(); }
  function up(){ drawing=false; }
  c.addEventListener('mousedown',down); c.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  c.addEventListener('touchstart',down,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',up);
  PADS[id]={c,ctx,isDirty:()=>dirty,setDirty:v=>dirty=v};
}
function clearPad(id){ const p=PADS[id]; if(!p)return; p.ctx.clearRect(0,0,p.c.width,p.c.height); p.setDirty(false); }
function getPad(id){ const p=PADS[id]; if(!p||!p.isDirty())return ''; return p.c.toDataURL('image/png'); }
function loadPad(id,dataUrl){ const p=PADS[id]; if(!p)return; const img=new Image(); img.onload=()=>{ p.ctx.drawImage(img,0,0,p.c.width/2,p.c.height/2); p.setDirty(true); }; img.src=dataUrl; }

/* ====== READ FORM ====== */
function readForm(){
  const a=STATE.current, st=STATE.stage;
  const g=id=>{const e=$(id);return e?e.value:undefined;};
  if(st==='out'){
    a.plan=g('f_plan')||a.plan;
    a.customer_name=g('f_customer_name'); a.customer_contact=g('f_customer_contact');
    a.car_model=g('f_car_model'); a.car_plate=g('f_car_plate');
  }
  a[st+'_date']=g('f_date'); a[st+'_time']=g('f_time'); a[st+'_mileage']=g('f_mileage');
  // petrol + checks + defects + photos already in state
  const si=getPad('padInspector'); if(si) a[st+'_sig_inspector']=si;
  const sc=getPad('padCustomer'); if(sc) a[st+'_sig_customer']=sc;
  return a;
}

/* ====== SAVE & GENERATE ====== */
function rowFor(a){
  // store everything; jsonb columns take objects directly via REST
  return {
    id:a.id, plan:a.plan, status:a.status,
    customer_name:a.customer_name, customer_contact:a.customer_contact,
    car_model:a.car_model, car_plate:a.car_plate,
    out_date:a.out_date, out_time:a.out_time, out_mileage:a.out_mileage, out_petrol:a.out_petrol||0,
    out_defects:a.out_defects||[], out_checks:a.out_checks||{}, out_photos:a.out_photos||[],
    out_sig_inspector:a.out_sig_inspector, out_sig_customer:a.out_sig_customer, out_pdf_url:a.out_pdf_url,
    in_date:a.in_date, in_time:a.in_time, in_mileage:a.in_mileage, in_petrol:a.in_petrol||0,
    in_defects:a.in_defects||[], in_checks:a.in_checks||{}, in_photos:a.in_photos||[],
    in_sig_inspector:a.in_sig_inspector, in_sig_customer:a.in_sig_customer, in_pdf_url:a.in_pdf_url,
    created_by:a.created_by, updated_at:new Date().toISOString()
  };
}
async function saveChecklist(silent){
  readForm();
  window.__lastSbError='';
  const ok=await sbUpsert(rowFor(STATE.current));
  if(!silent) toast(ok?'Saved ✓':('Saved (cloud off) — '+(window.__lastSbError||'no response')));
  return ok;
}

function validate(){
  const a=STATE.current, st=STATE.stage;
  if(st==='out'){
    if(!a.customer_name){ toast('Enter customer name'); return false; }
    if(!a.car_plate){ toast('Enter car plate'); return false; }
  }
  if(!f('mileage')){ toast('Enter car mileage'); return false; }
  if(!f('petrol')){ toast('Select petrol bar'); return false; }
  if(photoCount()<10){ toast('All 10 photos required ('+photoCount()+'/10)'); return false; }
  if(!getPad('padInspector')&&!f('sig_inspector')){ toast('Inspector signature needed'); return false; }
  if(!getPad('padCustomer')&&!f('sig_customer')){ toast('Customer signature needed'); return false; }
  return true;
}

var GENERATING=false;
async function generateChecklist(){
  if(GENERATING){ toast('Already generating… please wait'); return; }
  readForm();
  if(!validate()) return;
  const a=STATE.current, st=STATE.stage;

  // LOCK: disable the generate button ~5s to stop double/triple PDFs
  GENERATING=true;
  const genBtn=document.querySelector('#genBtn');
  const restore=()=>{ GENERATING=false; if(genBtn){ genBtn.disabled=false; genBtn.textContent='Generate PDF'; } };
  if(genBtn){ genBtn.disabled=true; genBtn.textContent='Generating… ⏳'; }
  setTimeout(()=>{ if(GENERATING && genBtn){ /* keep disabled until request resolves */ } }, 5000);

  // mark complete if doing return
  if(st==='in') a.status='completed';
  await saveChecklist(true);

  // render the marked-up car diagram to a PNG for the PDF
  const diagramPng = await renderDiagramPng();

  const payload = buildPayload(a, st, diagramPng);
  toast('Generating '+(st==='out'?'delivery':'return')+' PDF…');
  try{
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const out=await res.json();
    if(out.ok){
      a[st+'_pdf_url']=out.url; await saveChecklist(true);
      toast((st==='out'?'Delivery':'Return')+' PDF saved ✓');
      showResult(out.url, a, st);
    } else { toast('Failed: '+(out.error||'unknown')); }
  }catch(e){ toast('Error: '+e.message); }
  finally{ restore(); }
}

function buildPayload(a, st, diagramPng){
  const checks=f('checks')||{};
  const yn=v=> v===true?'YES':(v===false?'NO':'');
  const base={
    id:a.id, plan:a.plan, plan_name:PLAN_NAME[a.plan], car_type:(a.car_type||'sedan'),
    stage:st, stage_name:(st==='out'?'DELIVERY':'RETURN'),
    customer_name:a.customer_name, customer_contact:a.customer_contact,
    car_model:a.car_model, car_plate:a.car_plate,
    date:f('date'), time:f('time'), mileage:f('mileage'), petrol:String(f('petrol')||''),
    car_diagram:diagramPng,
    sig_inspector:f('sig_inspector'), sig_customer:f('sig_customer'),
    photos:(f('photos')||[]).filter(p=>p&&p.data),
    created_by:a.created_by
  };
  if(st==='out'){
    base.chk_inspection=yn(checks.inspection); base.chk_features=yn(checks.features);
    base.chk_bluetooth=yn(checks.bluetooth); base.chk_smoking=yn(checks.smoking); base.chk_fuel=yn(checks.fuel);
  } else {
    // return-stage extras
    base.begin_mileage=a.out_mileage||''; base.end_mileage=a.in_mileage||'';
    base.distance_used=distanceText(a);
    base.begin_petrol=String(a.out_petrol||''); base.end_petrol=String(a.in_petrol||'');
    base.chk_smoke_smell=yn(checks.smoke_smell);
    base.chk_fuel_same=yn(checks.fuel_same);
    base.chk_new_damage=yn(checks.new_damage);
  }
  return base;
}

/* render the SVG (car + markers) to a PNG data URL */
function renderDiagramPng(){
  return new Promise(resolve=>{
    const svg=$('carSvg'); if(!svg){ resolve(''); return; }
    const t=(STATE.current.car_type && CAR_DIMS[STATE.current.car_type])?STATE.current.car_type:'sedan';
    const d=CAR_DIMS[t]||{w:751,h:976};
    // scale longest side to ~1000px, keep aspect ratio (no distortion)
    const scale=1000/d.h;
    const cw=Math.round(d.w*scale), ch=Math.round(d.h*scale);
    const xml=new XMLSerializer().serializeToString(svg);
    const svg64='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(xml)));
    const img=new Image();
    img.onload=()=>{
      const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch);
      ctx.drawImage(img,0,0,cw,ch);
      // JPEG @ 0.82 — photographic car image, much lighter payload than PNG; white bg already painted
      resolve(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror=()=>resolve('');
    img.src=svg64;
  });
}

function showResult(url, a, st){
  const v=$('view');
  const fileLabel=(st==='out'?'DELIVERED':'RETURNED')+'_'+(a.customer_name||'')+'_'+(a.car_model||'')+'_'+(a.car_plate||'');
  v.insertAdjacentHTML('afterbegin', `
    <div class="panel" id="resultCard">
      <h3>${st==='out'?'Delivery':'Return'} PDF Ready</h3>
      <p class="hint" style="margin-bottom:10px">${esc(fileLabel)}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn ok" href="${esc(url)}" target="_blank" style="text-decoration:none">Open PDF</a>
        <button class="btn" onclick="sendWhatsapp('${encodeURIComponent(url)}')">Send via WhatsApp</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
        ${st==='out'?'<button class="btn sec" onclick="showChooser()">Done (car is out)</button>':'<button class="btn sec" onclick="showChooser()">Done (completed)</button>'}
        <a class="btn sec" href="index.html" style="text-decoration:none">‹ Hub</a>
      </div>
    </div>`);
  window.scrollTo({top:0,behavior:'smooth'});
}
function sendWhatsapp(enc){
  const a=STATE.current, st=STATE.stage; const url=decodeURIComponent(enc);
  let msg='Hi'+(a.customer_name?' '+a.customer_name:'')+', here is your GRANDPRIDE vehicle '+(st==='out'?'delivery':'return')+' checklist';
  if(a.car_model) msg+=' for '+a.car_model;
  if(a.car_plate) msg+=' ('+a.car_plate+')';
  msg+='.\n\n'+url+'\n\nThank you for choosing Grandpride.';
  window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

/* ====== INIT ====== */
showChooser();
