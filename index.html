<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Grandpride Hub</title>
<style>
  :root{
    --navy:#141210;        /* near-black warm */
    --navy-2:#1d1a16;      /* card black */
    --ink:#0a0908;         /* deepest black */
    --gold:#c9a24b;
    --gold-soft:#e3c887;
    --paper:#f5f3ee;
    --paper-2:#ffffff;
    --grey:#9a948a;
    --line:rgba(201,162,75,.18);   /* gold hairlines */
    --ok:#2f9e6f;
    --bad:#d2533f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:Georgia,'Times New Roman',serif;
    background:
      radial-gradient(1000px 700px at 50% -8%, rgba(201,162,75,.10) 0%, transparent 55%),
      linear-gradient(180deg,#141210 0%, #0a0908 100%);
    color:var(--paper);
    min-height:100%;
    overflow-x:hidden;
  }
  .display{font-family:'Didot','Bodoni MT','Playfair Display',Georgia,serif;letter-spacing:.5px}
  .mono{font-family:'Courier New',monospace}

  /* ============ SCREENS ============ */
  .screen{display:none;min-height:100vh}
  .screen.active{display:block}

  /* ============ LOGIN ============ */
  #loginScreen{display:none;align-items:center;justify-content:center;padding:20px;height:100vh;height:100dvh;overflow:hidden}
  #loginScreen.active{display:flex}
  .login-card{
    width:100%;max-width:360px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
    border:1px solid var(--line);
    border-radius:20px;padding:26px 24px;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    backdrop-filter:blur(6px);
  }
  .crest{
    width:72px;height:72px;margin:0 auto 12px;
    display:flex;align-items:center;justify-content:center;
  }
  .crest img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 16px rgba(201,162,75,.35))}
  .brand-name{text-align:center;font-size:21px;letter-spacing:3px;text-transform:uppercase;color:var(--paper)}
  .brand-sub{text-align:center;font-size:10px;letter-spacing:4px;color:var(--gold-soft);margin-top:5px;text-transform:uppercase;font-family:Arial,sans-serif}
  .divider{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px 0}
  .login-slogans{margin-top:16px;text-align:center;font-family:Arial,sans-serif}
  .login-slogans p{font-size:11px;letter-spacing:.5px;color:var(--grey);margin:4px 0;line-height:1.5}
  .login-slogans b{color:var(--gold-soft);letter-spacing:1px}
  .field{margin-bottom:12px}
  .field label{display:block;font-family:Arial,sans-serif;font-size:11px;letter-spacing:1px;color:var(--grey);text-transform:uppercase;margin-bottom:6px}
  .field input{
    width:100%;padding:13px 14px;border-radius:11px;
    background:rgba(0,0,0,.25);border:1px solid var(--line);
    color:var(--paper);font-size:15px;font-family:Arial,sans-serif;
  }
  .field input:focus{outline:none;border-color:var(--gold)}
  .btn{
    width:100%;padding:14px;border:none;border-radius:11px;cursor:pointer;
    font-family:Arial,sans-serif;font-weight:600;font-size:14px;letter-spacing:1px;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:var(--ink);
    transition:transform .15s,box-shadow .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--paper)}
  .btn.ghost.no{border-color:rgba(229,57,53,.4);color:#ff6b6b}
  .err{color:var(--bad);font-family:Arial,sans-serif;font-size:12px;text-align:center;margin-top:12px;min-height:16px}
  .hint{font-family:Arial,sans-serif;font-size:11px;color:var(--grey);text-align:center;margin-top:18px;line-height:1.6}

  /* ============ HUB ============ */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--line);
  }
  .topbar .who{font-family:Arial,sans-serif}
  .topbar .who b{display:block;font-size:15px;letter-spacing:.5px}
  .topbar .who span{font-size:11px;color:var(--gold-soft);letter-spacing:1px;text-transform:uppercase}
  .iconbtn{
    background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--paper);
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:16px;font-family:Arial,sans-serif;
  }
  .hub-head{text-align:center;padding:22px 20px 4px}
  .hub-logo{width:70px;height:70px;margin:0 auto 10px}
  .hub-logo img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 14px rgba(201,162,75,.3))}
  .hub-head h1{font-size:26px;letter-spacing:4px;text-transform:uppercase}
  .hub-head p{font-family:Arial,sans-serif;font-size:11px;color:var(--grey);letter-spacing:2px;margin-top:6px}

  /* ============ MODULE TABS ============ */
  .hub-tabs{display:flex;gap:6px;justify-content:center;padding:16px 20px 6px;max-width:520px;margin:0 auto}
  .hub-tab{flex:1;text-align:center;font-family:Arial,sans-serif;font-size:11.5px;letter-spacing:.3px;padding:9px 2px;color:var(--grey);border-bottom:2px solid transparent;cursor:pointer}
  .hub-remark{grid-column:1/-1;text-align:center;font-family:Arial,sans-serif;color:var(--grey);padding:46px 20px}
  .hub-remark .big{font-size:42px;margin-bottom:10px}
  .hub-remark h3{font-family:Georgia,serif;color:var(--paper);font-size:22px;letter-spacing:2px;margin-bottom:6px}
  .hub-remark p{font-size:12px;margin-bottom:16px}
  .hub-remark.small-remark{padding:20px}
  .badge-soon{display:inline-block;padding:7px 16px;border-radius:20px;border:1px dashed var(--gold);color:var(--gold-soft);font-size:11px;letter-spacing:.5px}
  .notif-wrap{grid-column:1/-1;font-family:Arial,sans-serif;display:flex;flex-direction:column;gap:10px}
  .notif-compose{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:6px}
  .notif-item{display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02)}
  .notif-ic{font-size:22px;line-height:1}
  .notif-tx{flex:1;display:flex;flex-direction:column;gap:2px}
  .notif-tx b{color:var(--paper);font-size:13px}
  .notif-tx span{color:var(--grey);font-size:12px;line-height:1.4}
  .hub-tab.on{color:var(--gold);border-bottom-color:var(--gold);font-weight:600}

  /* ============ APP GRID ============ */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:14px;
    padding:18px;max-width:520px;margin:0 auto 40px;
  }
  .tile{
    aspect-ratio:1/1;border-radius:18px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(160deg,#1d1a16,#0d0c0a);
    border:1px solid var(--gold);
    transition:transform .16s,border-color .16s,box-shadow .16s;
    position:relative;overflow:hidden;
  }
  .tile::after{content:'';position:absolute;inset:0;background:radial-gradient(120px 80px at 50% 0%,rgba(201,162,75,.12),transparent 70%);pointer-events:none}
  .tile:active{transform:scale(.95)}
  .tile.allowed:hover{box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 16px rgba(201,162,75,.25)}
  .tile .ic{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
  .tile .ic svg{width:38px;height:38px;stroke:var(--gold-soft);fill:none;stroke-width:1.6}
  .tile .lb{font-family:Arial,sans-serif;font-size:11.5px;letter-spacing:.3px;color:var(--paper);text-align:center;padding:0 6px}
  .tile.locked{opacity:.4;filter:grayscale(.85);cursor:not-allowed}
  .tile.locked .lock{position:absolute;top:9px;right:9px;font-size:12px}
  .grid-note{text-align:center;font-family:Arial,sans-serif;font-size:11px;color:var(--grey);padding:0 20px 30px}

  /* ============ INNER APP VIEW ============ */
  .app-view-head{
    display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  #appScreen.active{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}
  #avBody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .app-view-head h2{font-size:18px;letter-spacing:1px;font-family:Arial,sans-serif;font-weight:600}
  .placeholder{
    margin:40px 20px;padding:34px 24px;text-align:center;
    border:1px dashed var(--line);border-radius:16px;font-family:Arial,sans-serif;
  }
  .placeholder .big{font-size:40px;margin-bottom:14px}
  .placeholder .big svg{width:56px;height:56px;stroke:var(--gold-soft);fill:none;stroke-width:1.6}
  .placeholder h3{font-size:18px;margin-bottom:10px;letter-spacing:1px}
  .placeholder p{color:var(--grey);font-size:13px;line-height:1.7;max-width:360px;margin:0 auto}

  /* ============ ADMIN ============ */
  .admin-wrap{padding:20px;font-family:Arial,sans-serif;max-width:760px;margin:0 auto}
  .panel{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .panel h3{font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:14px}
  .urow{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
  .urow:last-child{border-bottom:none}
  .urow .uinfo b{font-size:14px}
  .urow .uinfo span{display:block;font-size:11px;color:var(--grey);margin-top:2px}
  .perm-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{
    font-size:11px;padding:7px 11px;border-radius:20px;cursor:pointer;
    border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--grey);user-select:none;
  }
  .chip.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:600}
  .mini-input{padding:9px 11px;border-radius:9px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--paper);font-size:13px;width:100%}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .small{font-size:11px;color:var(--grey);margin-top:6px;line-height:1.6}
  .save-bar{position:sticky;bottom:0;padding:14px 0;background:linear-gradient(0deg,var(--ink),transparent)}
  select.mini-input{appearance:none}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:var(--gold);color:var(--ink);font-family:Arial,sans-serif;font-size:13px;font-weight:600;padding:12px 22px;border-radius:30px;transition:transform .3s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .setup-note{margin:16px;padding:14px;border:1px solid var(--gold);border-radius:12px;background:rgba(201,162,75,.08);font-family:Arial,sans-serif;font-size:12px;color:var(--gold-soft);line-height:1.7}

  /* ===== ATTENDANCE ===== */
  .att-wrap{font-family:Arial,sans-serif;padding:20px;max-width:520px;margin:0 auto}
  .att-tabs{display:flex;gap:8px;margin-bottom:18px;position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--ink) 70%,transparent);padding:10px 0 12px}
  .att-tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--grey)}
  .att-tab.on{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
  .att-clock{text-align:center;margin:10px 0 22px}
  .att-clock .time{font-size:42px;font-weight:300;letter-spacing:1px;font-family:Georgia,serif}
  .att-clock .date{font-size:12px;color:var(--grey);margin-top:4px;letter-spacing:1px}
  .punch{width:170px;height:170px;border-radius:50%;margin:14px auto;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--ink);font-weight:700;font-size:17px;letter-spacing:1px;background:radial-gradient(circle at 50% 35%,var(--gold-soft),var(--gold));box-shadow:0 0 0 8px rgba(201,162,75,.12),0 16px 40px rgba(0,0,0,.45)}
  .punch.out{background:radial-gradient(circle at 50% 35%,#e08c7a,var(--bad));color:#fff}
  .punch small{font-weight:400;font-size:11px;margin-top:6px;opacity:.8}
  .att-status{text-align:center;font-size:13px;margin:6px 0 18px;min-height:18px}
  .pill{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:600}
  .pill.ok{background:rgba(47,158,111,.2);color:#5fd0a0}
  .pill.late{background:rgba(210,83,63,.2);color:#f0917f}
  .pill.off{background:rgba(154,163,184,.2);color:var(--grey)}
  .leave-row{display:flex;gap:8px;margin-top:8px}
  .leave-btn{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--paper);font-size:13px;font-weight:600;cursor:pointer}
  .att-card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .att-card h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-soft);margin-bottom:12px}
  .rec-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .rec-row:last-child{border-bottom:none}
  .rec-row .d{color:var(--grey)}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .sum-box{text-align:center;padding:12px 6px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line)}
  .sum-box b{display:block;font-size:22px;font-family:Georgia,serif}
  .sum-box span{font-size:10px;color:var(--grey);letter-spacing:.5px}
  .ded-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--line)}
  .ded-row:last-child{border-bottom:none}
  .ded-row.total{font-weight:700;font-size:15px;color:var(--gold-soft)}
  .att-input{width:100%;padding:11px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);color:var(--paper);font-size:14px;margin-bottom:10px}
  .mini-btn{border:none;border-radius:8px;padding:5px 11px;font-size:14px;font-weight:700;margin-left:6px;cursor:pointer}
  .mini-btn.ok{background:rgba(70,170,90,.18);color:#7ddc94}
  .mini-btn.no{background:rgba(229,57,53,.18);color:#ff6b6b}
  .toggle{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--grey);border-radius:20px;padding:5px 14px;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:.5px}
  .toggle.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}

  /* ===== MYSYARIKAT-STYLE PATTERNS (black/gold) ===== */
  /* horizontal clock card: glowing button + status side by side */
  .clock-card{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:18px}
  .geo-card{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
  .geo-map{height:160px;background:#1d1a16;display:flex;align-items:center;justify-content:center}
  .geo-loading{color:var(--grey);font-size:13px}
  .geo-foot{display:flex;align-items:center;gap:10px;padding:12px 14px}
  .geo-dist{font-weight:800;font-size:14px;padding:5px 12px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--grey);flex:0 0 auto}
  .geo-dist.in{background:rgba(70,170,90,.22);color:#7ddc94}
  .geo-dist.out{background:rgba(229,57,53,.20);color:#ff6b6b}
  .geo-loc{font-size:11.5px;color:var(--grey);line-height:1.3}
  .cam-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
  .cam-box{width:100%;max-width:420px;background:var(--navy-2,#1d1a16);border:1px solid var(--line);border-radius:18px;padding:16px}
  .cam-title{color:var(--gold-soft);font-size:13px;font-weight:700;text-align:center;margin-bottom:12px}
  .cam-box video{width:100%;border-radius:12px;background:#000;transform:scaleX(-1)}
  .cam-row{display:flex;gap:10px;margin-top:12px}
  .cam-row .btn{flex:1}
  .clock-orb{position:relative;width:96px;height:96px;flex:0 0 96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--ink);font-weight:800;font-size:14px;letter-spacing:.5px;background:radial-gradient(circle at 50% 35%,var(--gold-soft),var(--gold));box-shadow:0 0 0 6px rgba(201,162,75,.14),0 0 0 14px rgba(201,162,75,.06),0 10px 26px rgba(0,0,0,.45)}
  .clock-orb.out{background:radial-gradient(circle at 50% 35%,#e08c7a,var(--bad));color:#fff;box-shadow:0 0 0 6px rgba(210,83,63,.16),0 0 0 14px rgba(210,83,63,.07),0 10px 26px rgba(0,0,0,.45)}
  .clock-orb.pulse{animation:orbpulse 2.2s infinite}
  @keyframes orbpulse{0%{box-shadow:0 0 0 6px rgba(201,162,75,.18),0 0 0 14px rgba(201,162,75,.08)}50%{box-shadow:0 0 0 10px rgba(201,162,75,.10),0 0 0 22px rgba(201,162,75,.03)}100%{box-shadow:0 0 0 6px rgba(201,162,75,.18),0 0 0 14px rgba(201,162,75,.08)}}
  .clock-orb small{font-weight:400;font-size:9px;margin-top:3px;opacity:.85}
  .clock-info{flex:1}
  .clock-info .ci-prompt{font-size:15px;font-weight:700;color:var(--paper);margin-bottom:8px}
  .clock-info .ci-sub{font-size:12px;color:var(--grey)}
  .clock-time{font-family:Georgia,serif;font-size:30px;font-weight:300;text-align:center;color:var(--paper);letter-spacing:1px}
  .clock-date{text-align:center;font-size:11px;color:var(--grey);letter-spacing:1px;margin:2px 0 14px}
  .att-steps{display:flex;flex-direction:column;gap:8px;margin:4px 0 18px}
  .att-steps .stp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--grey);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
  .att-steps .stp span{width:22px;height:22px;flex:0 0 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:rgba(255,255,255,.06);color:var(--grey)}
  .att-steps .stp.now{color:var(--paper);border-color:var(--gold)}
  .att-steps .stp.now span{background:var(--gold);color:var(--ink)}
  .att-steps .stp.done{color:var(--gold-soft)}
  .att-steps .stp.done span{background:rgba(201,162,75,.25);color:var(--gold-soft)}
  /* avatar record cards */
  .rec-card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .rec-av{width:42px;height:42px;flex:0 0 42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-soft));display:flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;font-size:15px;font-family:Arial,sans-serif}
  .rec-mid{flex:1;min-width:0}
  .rec-mid .rn{font-size:13px;font-weight:700;color:var(--paper)}
  .rec-mid .rt{font-size:11px;color:var(--grey);margin-top:2px}
  .rec-right{text-align:right}
  .rec-right .rtime{font-size:13px;font-weight:700;color:var(--paper)}
  .rec-right .rtype{font-size:10px;color:var(--grey)}
  .rec-arrow{font-size:16px;margin-left:6px}
  .rec-date-head{font-size:12px;color:var(--gold-soft);font-weight:700;margin:14px 0 8px;letter-spacing:.5px}
  /* leave balance grid */
  .bal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .bal-box{padding:13px 8px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line)}
  .bal-box .bl{font-size:10px;color:var(--grey);letter-spacing:.3px;margin-bottom:5px}
  .bal-box .bv{font-size:17px;font-weight:800;font-family:Georgia,serif;color:var(--gold-soft)}
  .bal-box .bv small{font-size:11px;color:var(--grey);font-weight:400}
  /* leave timeline list */
  .lv-item{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
  .lv-item:last-child{border-bottom:none}
  .lv-date{flex:0 0 64px;border-left:2px solid var(--gold);padding-left:10px}
  .lv-date .lm{font-size:12px;font-weight:800;color:var(--gold-soft)}
  .lv-date .ld{font-size:10px;color:var(--grey)}
  .lv-body{flex:1}
  .lv-body .ln{font-size:13px;font-weight:700;color:var(--paper)}
  .lv-body .lt{font-size:11px;color:var(--grey);margin:2px 0 6px}

<!-- ============ LOGIN ============ -->
<div id="loginScreen" class="screen active">
  <div class="login-card">
    <div class="crest" id="loginCrest"></div>
    <div class="brand-name display">Grandpride</div>
    <div class="brand-sub">Internal Hub</div>
    <div class="divider"></div>
    <div class="field">
      <label>Username</label>
      <input id="liUser" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="liPass" type="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="••••••••">
    </div>
    <button class="btn" id="btnEnter">Welcome, have a good day.</button>
    <div class="err" id="liErr"></div>
    <div class="login-slogans">
      <p><b>Grandpride</b> — Exclusive Ride Make Possible</p>
      <p><b>Grandlab</b> — Your Personalize Detailer</p>
    </div>
  </div>
</div>

<!-- ============ HUB ============ -->
<div id="hubScreen" class="screen">
  <div class="topbar">
    <div class="who">
      <b id="hbName">—</b>
      <span id="hbRole">—</span>
    </div>
    <div style="display:flex;gap:10px">
      <button class="iconbtn" id="adminGear" title="Admin">⚙</button>
      <button class="iconbtn" id="btnLogout" title="Log out">⏻</button>
    </div>
  </div>
  <div class="hub-head">
    <div class="hub-logo" id="hubLogo"></div>
    <h1 class="display">Grandpride</h1>
    <p>Internal Hub</p>
  </div>
  <div class="hub-tabs">
    <div class="hub-tab on" id="tabModules">Modules</div>
    <div class="hub-tab" id="tabGrandpride">Grandpride</div>
    <div class="hub-tab" id="tabGrandlab">Grandlab</div>
    <div class="hub-tab" id="tabNotif">Notifications</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="grid-note" id="gridNote"></div>
</div>

<!-- ============ APP VIEW ============ -->
<div id="appScreen" class="screen">
  <div class="app-view-head">
    <button class="iconbtn" id="btnBackApp">←</button>
    <h2 id="avTitle">App</h2>
  </div>
  <div id="avBody"></div>
</div>

<!-- ============ ADMIN ============ -->
<div id="adminScreen" class="screen">
  <div class="app-view-head">
    <button class="iconbtn" id="btnBackAdmin">←</button>
    <h2>Admin — Access Control</h2>
  </div>
  <div id="setupNote" class="setup-note" style="display:none"></div>
  <div class="admin-wrap" id="adminBody"></div>
</div>

/* ================= STORAGE ================= */
const LS_KEY = 'grandpride_hub_v3';   // bump this (v3->v4...) when you change STAFF_SEED

function safeLocalGet(){
  try{ const r = localStorage.getItem(LS_KEY); return r?JSON.parse(r):null; }catch(e){ return memStore; }
}
let memStore = null;
function safeLocalSet(data){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(data)); }catch(e){ memStore = data; }
}

async function loadDB(){
  if(useCloud){
    try{
      const { data, error } = await sb.from('hub_users').select('*');
      if(error) throw error;
      DB.users = (data||[]).map(r=>({
        username:r.username, password:r.password, name:r.name, role:r.role,
        apps: Array.isArray(r.apps)? r.apps : (r.apps? JSON.parse(r.apps):[])
      }));
      if(DB.users.length===0){ await seedDefault(); }
      return;
    }catch(e){
      console.warn('Cloud load failed, falling back to local:', e);
      useCloud = false;
    }
  }
  const local = safeLocalGet();
  if(local && local.users && local.users.length){ DB = local; }
  else { seedDefaultLocal(); }
}

function seedDefaultLocal(){
  DB = { users: STAFF_SEED.map(u=>Object.assign({}, u)) };
  // bake in the Sheets URL + ImgBB key so staff configure nothing
  DB.attSettings = { gsUrl: GS_URL, imgbbKey: IMGBB_KEY, lat:null, lng:null, radius:150 };
  safeLocalSet(DB);
}

async function seedDefault(){
  seedDefaultLocal();
  if(useCloud){
    for(const u of DB.users){ await upsertUser(u); }
  }
}

async function saveDB(){
  safeLocalSet(DB);
  if(useCloud){
    for(const u of DB.users){ await upsertUser(u); }
  }
}

async function upsertUser(u){
  try{
    await sb.from('hub_users').upsert({
      username:u.username, password:u.password, name:u.name, role:u.role, apps:u.apps
    }, { onConflict:'username' });
  }catch(e){ console.warn('upsert failed', e); }
}

/* ================= AUTH ================= */
const REMEMBER_KEY = 'grandpride_last_user';
function rememberUser(username){ try{ localStorage.setItem(REMEMBER_KEY, username); }catch(e){} }
function forgetUser(){ try{ localStorage.removeItem(REMEMBER_KEY); }catch(e){} }
function getRememberedUser(){ try{ return localStorage.getItem(REMEMBER_KEY); }catch(e){ return null; } }

function doLogin(){
  const u = document.getElementById('liUser').value.trim().toLowerCase();
  const p = document.getElementById('liPass').value.trim();
  const err = document.getElementById('liErr');

  // Failsafe: guarantee admin can always get in, even if DB failed to load
  if(u==='admin' && p==='Gldetailing2019'){
    if(!DB.users.find(x=>x.username==='admin')){
      DB.users.push({username:'admin',password:'Gldetailing2019',name:'Administrator',role:'Admin',apps:APPS.map(a=>a.id)});
    }
    current = DB.users.find(x=>x.username==='admin');
    rememberUser('admin');
    err.textContent='';
    document.getElementById('liPass').value='';
    renderHub();
    show('hubScreen');
    return;
  }

  const found = DB.users.find(x=>x.username.toLowerCase()===u && x.password.trim()===p);
  if(!found){
    err.textContent = 'Wrong username or password.';
    return;
  }
  err.textContent='';
  current = found;
  rememberUser(found.username);
  document.getElementById('liPass').value='';
  renderHub();
  show('hubScreen');
}
function logout(){ current=null; forgetUser(); show('loginScreen'); }

/* Auto-login the remembered user (this device stays signed in). */
function tryAutoLogin(){
  const un = getRememberedUser();
  if(!un) return false;
  const found = (DB.users||[]).find(x=>x.username===un);
  if(!found) return false;
  current = found;
  renderHub();
  show('hubScreen');
  return true;
}

function renderTiles(cat){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let lockedCount = 0;
  const apps = APPS.filter(a=>a.cat===cat);
  apps.forEach(app=>{
    const allowed = current.apps.includes(app.id) || current.role==='Admin';
    if(!allowed) lockedCount++;
    const tile = document.createElement('div');
    tile.className = 'tile ' + (allowed?'allowed':'locked');
    const iconHtml = app.logo
      ? `<img src="${app.logo}" alt="" style="width:40px;height:40px;object-fit:contain">`
      : app.svg;
    tile.innerHTML = `

    if(allowed){ tile.addEventListener('click',()=>openApp(app)); }
    else { tile.addEventListener('click',()=>toast('No access — ask admin')); }

  });
  return lockedCount;
}

function switchHubTab(tab){

/* ============ NOTIFICATIONS ============ */
function getNotifications(){
  attData();
  const list = [];
  const today = todayKey();
  const md = today.slice(5); // MM-DD
  // tomorrow's MM-DD (handles month/year roll-over)
  const tmrDate = new Date(); tmrDate.setDate(tmrDate.getDate()+1);
  const tmrMd = todayKey(tmrDate).slice(5);
  const canPrep = current.role==='Admin' || current.canPostNotice; // who gets the cake heads-up

  // 1a. Birthday TOMORROW — heads-up to admin/receptionist to prepare the cake
  if(canPrep){
    (DB.users||[]).forEach(u=>{
      if(u.birthday && u.birthday.slice(5)===tmrMd){
        list.push({ icon:'🎁', title:u.name+"'s birthday is tomorrow", body:'Prepare the birthday cake 🎂', kind:'birthday-soon' });
      }
    });
  }

  // 1b. Birthdays TODAY (everyone sees them)
  (DB.users||[]).forEach(u=>{
    if(u.birthday && u.birthday.slice(5)===md){
      list.push({ icon:'🎂', title:'Happy Birthday '+u.name+'!', body:'Wish them a great day.', kind:'birthday' });
    }
  });

  // 2. Chauffeur assignment — ONLY the assigned chauffeur sees their own
  if(isChauffeur(current.username) && DB.chAssign && DB.chAssign[current.username]){
    const a=DB.chAssign[current.username];
    Object.keys(a).filter(d=>d>=today).sort().forEach(d=>{
      const when = new Date(d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
      list.push({ icon:'🚗', title:'Driving assignment — '+when, body:'Clock in at '+a[d].start+(a[d].by?(' · assigned by '+a[d].by):''), kind:'assign' });
    });
  }

  // 3. Announcements (admin/receptionist post; everyone sees)
  (DB.announcements||[]).slice().reverse().forEach(an=>{
    list.push({ icon:'📢', title:an.title||'Announcement', body:an.body+(an.by?(' — '+an.by):''), kind:'announce', id:an.id });
  });

  return list;
}

function updateNotifBadge(){
  const n = getNotifications().length;
  const tab = document.getElementById('tabNotif');
  if(!tab) return;
  tab.textContent = 'Notifications' + (n>0 ? ' ('+n+')' : '');
}

function renderNotifications(){
  const grid=document.getElementById('grid');
  const note=document.getElementById('gridNote');
  note.textContent='';
  const items = getNotifications();
  const canPost = current.role==='Admin' || current.canPostNotice;

  let html = '<div class="notif-wrap">';

  // admin/receptionist: write an announcement
  if(canPost){
    html += `<div class="notif-compose">
      <input id="anTitle" class="att-input" placeholder="Announcement title (e.g. Team Building)">
      <textarea id="anBody" class="att-input" rows="3" placeholder="Details — e.g. 12 June, please join at workshop 9am"></textarea>
      <button class="btn" id="anPost">Post Announcement</button>
    </div>`;
  }

  if(!items.length){
    html += `<div class="hub-remark"><div class="big">🔔</div><p>No notifications right now</p></div>`;
  } else {
    items.forEach((it,i)=>{
      const delBtn = (it.kind==='announce' && canPost) ? `<button class="mini-btn no" data-delnotice="${it.id}">✕</button>` : '';
      html += `<div class="notif-item">
        <div class="notif-ic">${it.icon}</div>
        <div class="notif-tx"><b>${it.title}</b><span>${it.body}</span></div>
        ${delBtn}
      </div>`;
    });
  }
  html += '</div>';
  grid.innerHTML = html;

  if(canPost){
    const pb=document.getElementById('anPost');
    if(pb) pb.addEventListener('click',()=>{
      const t=document.getElementById('anTitle').value.trim();
      const b=document.getElementById('anBody').value.trim();
      if(!b){ toast('Write the announcement details'); return; }
      if(!DB.announcements) DB.announcements=[];
      DB.announcements.push({ id:'an'+Date.now(), title:t||'Announcement', body:b, by:current.name, date:todayKey() });
      saveDB(); toast('Announcement posted'); renderNotifications(); updateNotifBadge();
    });
    grid.querySelectorAll('[data-delnotice]').forEach(btn=>btn.addEventListener('click',()=>{
      const id=btn.dataset.delnotice;
      DB.announcements = (DB.announcements||[]).filter(a=>a.id!==id);
      saveDB(); toast('Removed'); renderNotifications(); updateNotifBadge();
    }));
  }
}

/* Add-new-title flow for the Add User form's title dropdown */
function handleTitleAdd(sel, company){
  if(sel.value!=='__add__') return;
  const nt=prompt('New job title for '+company+':');
  if(nt && nt.trim()){
    if(!DB.titlePresets[company]) DB.titlePresets[company]=[];

// Fixed top-management reporting roles (always selectable as 'reports to')
const TOP_ROLES = ['CEO','Managing Director','Group CEO'];
function isChauffeur(username){
  const u = DB.users.find(x=>x.username===username);
  return !!(u && u.title && u.title.toLowerCase().indexOf('chauffeur')>=0);
}
function chauffeurCfg(username){
  const c = (DB.chauffeurCfg && DB.chauffeurCfg[username]) || {};
  return { workHours:+c.workHours||10, lunchHours:+c.lunchHours||1.5, normalRate:+c.normalRate||0, otRate:+c.otRate||0 };
}
function todayKey(d=new Date()){
  // use LOCAL date parts (toISOString uses UTC which rolls back a day before 08:00 in +08:00)
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
/* Payroll period runs 24th -> 23rd. Returns {start, end} date keys for the period containing dateKey. */
function payrollPeriod(dateKey){
  const d = dateKey ? new Date(dateKey) : new Date();
  const y=d.getFullYear(), m=d.getMonth(), day=d.getDate();
  let startY=y, startM=m;
  if(day < 24){ startM=m-1; if(startM<0){ startM=11; startY=y-1; } } // before 24th -> period started prev month
  const start=new Date(startY,startM,24);
  const end=new Date(startY,startM+1,23);
  return { start: todayKey(start), end: todayKey(end) };
}
function inPayrollPeriod(dateKey, period){ return dateKey>=period.start && dateKey<=period.end; }
/* The "period month" label (YYYY-MM) a date belongs to.
   Normal staff: payroll period named by END month (24th–23rd cut-off).
   Chauffeurs: plain calendar month (1st–31st). */
function payrollMonth(dateKey, username){
  if(username && isChauffeur(username)) return dateKey.slice(0,7); // calendar month
  const p = payrollPeriod(dateKey);
  return p.end.slice(0,7); // end month YYYY-MM
}
function fmtTime(d){ return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function toMin(hhmm){ if(!hhmm) return null; const [h,m]=hhmm.split(':').map(Number); return h*60+m; }

/* Leave entitlement from join date + admin confirmation.
   Probation ends only when admin confirms the staff (button). Default probation is 3 months,
   but staff stays on probation until confirmed (so it can be extended simply by not confirming yet).
   AL: 0 (probation), 8 (<2yr), 12 (2-5yr), 18 (5yr+) counted from JOIN date. MC: 12 for all.
   EL deducts from AL once off probation. Maternity 98, Paternity 7. */
function leaveEntitlement(joinDate, confirmedDate){
  const base = { onProbation:true, confirmed:false, dueForReview:false, months:0, years:0, al:0, mc:12, maternity:98, paternity:7, elFromAl:false };
  if(!joinDate) return base;
  const j=new Date(joinDate), now=new Date();
  if(isNaN(j)) return base;
  const months = (now.getFullYear()-j.getFullYear())*12 + (now.getMonth()-j.getMonth()) - (now.getDate()<j.getDate()?1:0);
  const years = months/12;
  const confirmed = !!confirmedDate;
  const onProbation = !confirmed;                 // probation ends only on admin confirm
  const dueForReview = onProbation && months >= 3; // passed default 3 months but not yet confirmed
  let al;
  if(onProbation) al=0;
  else if(years < 2) al=8;
  else if(years < 5) al=12;
  else al=18;
  return { onProbation, confirmed, dueForReview, months, years:Math.floor(years), al, mc:12, maternity:98, paternity:7, elFromAl:!onProbation };
}
function tenureLabel(ent){
  if(ent.onProbation) return ent.dueForReview ? 'On probation — due for review' : 'On probation';
  if(ent.years < 2) return (ent.months||0)+' months';
  return ent.years+' year'+(ent.years>1?'s':'');
}

/* Morning late-in penalty: on time until 9:14, then +30 min for every started 30-min block from 9:15.
   9:15-9:44 = 30, 9:45-10:14 = 60, 10:15-10:44 = 90 ... */
function morningLate(amInMin){
  const GRACE = 9*60+15;            // 09:15 — first late threshold
  if(amInMin < GRACE) return 0;     // 08:30-09:14 on time
  const over = amInMin - GRACE;     // minutes past 09:15
  return (Math.floor(over/30)+1)*30; // 09:15-09:44 -> 30, 09:45-10:14 -> 60 ...
}

/* Lunch late: only if break longer than 60 min. Overage counted in same 30-min blocks. */
function lunchLate(lunchOutMin, lunchInMin){
  if(lunchOutMin==null || lunchInMin==null) return 0;
  const brk = lunchInMin - lunchOutMin;
  if(brk <= 60) return 0;
  const over = brk - 60;
  return Math.ceil(over/30)*30;
}

/* OT: minutes worked after 19:00, only for entitled staff. */
function otMinutes(pmOutMin, entitled){
  if(!entitled || pmOutMin==null) return 0;
  const OT_START = 19*60;           // 7:00pm
  return pmOutMin > OT_START ? (pmOutMin - OT_START) : 0;
}

/* Early leaving: minutes clocked out before 18:30 (6:30pm end of work). */
function earlyMinutes(pmOutMin){
  if(pmOutMin==null) return 0;
  const END = 18*60+30;             // 6:30pm
  return pmOutMin < END ? (END - pmOutMin) : 0;
}

/* Recompute lateMins, otMins, status from the 4 punches. */
function recomputeDay(username, rec){
  if(rec.leave){ rec.lateMins=0; rec.otMins=0; rec.workMins=0; rec.status=rec.leave; return rec; }

  // ---- Chauffeur: flexible hours, no late penalty, OT = beyond daily limit + all Sunday hours ----
  if(isChauffeur(username)){
    let am=toMin(rec.amIn); const lo=toMin(rec.lunchOut), li=toMin(rec.lunchIn), pm=toMin(rec.pmOut);
    const cfg=chauffeurCfg(username);
    const dkey = rec._dateKey||todayKey();
    // assigned start time (set by HOD) — hours count from here, late recorded if clocked in after
    const asg = (DB.chAssign && DB.chAssign[username] && DB.chAssign[username][dkey]) ? DB.chAssign[username][dkey] : null;
    const asgStart = asg ? toMin(asg.start) : null;
    rec.lateMins = 0; rec.assignedStart = asg ? asg.start : null;
    if(am==null){ rec.otMins=0; rec.workMins=0; rec.status='—'; return rec; }
    if(asgStart!=null){
      // late if actual clock-in is after assigned time (record only)
      if(am > asgStart) rec.lateMins = am - asgStart;
      // hours always count from the assigned start (early clock-in gives no extra)
      am = asgStart;
    }
    if(pm==null){ rec.otMins=0; rec.workMins=0; rec.status='Working'; return rec; }
    let span = pm - am; if(span<0) span += 24*60;
    let lunch = (lo!=null && li!=null) ? (li-lo<0?(li-lo+24*60):(li-lo)) : Math.round(cfg.lunchHours*60);
    let worked = Math.max(0, span - lunch);
    rec.workMins = worked;
    const limit = Math.round(cfg.workHours*60);
    const dow = new Date(dkey).getDay();
    let ot;
    if(dow===0){ ot = worked; }                 // Sunday: all hours are OT
    else { ot = Math.max(0, worked - limit); }  // weekday: beyond daily limit
    rec.otMins = ot;
    const wh=(worked/60).toFixed(1), oth=(ot/60).toFixed(1);
    let st = dow===0 ? ('Sunday OT '+wh+'h') : (ot>0 ? (wh+'h ('+oth+'h OT)') : (wh+'h'));
    if(rec.lateMins>0) st += ' · Late '+rec.lateMins+'m';
    rec.status = st;
    return rec;
  }

  // ---- Normal office staff ----
  const am=toMin(rec.amIn), lo=toMin(rec.lunchOut), li=toMin(rec.lunchIn), pm=toMin(rec.pmOut);
  let late = 0;
  if(am!=null) late += morningLate(am);
  late += lunchLate(lo, li);
  const entitled = !!(DB.otStaff && DB.otStaff[username]);
  const ot = otMinutes(pm, entitled);
  // early = clocked out before 6:30pm (only when they HAVE clocked out)
  const early = earlyMinutes(pm);
  rec.lateMins = late;
  rec.otMins = ot;
  rec.earlyMins = early;
  if(am==null){ rec.status='—'; return rec; }
  if(pm==null){
    // still working — show late so far, no early/OT yet
    rec.status = late>0 ? (late>=60?('Late '+(late/60)+' hr'+(late>60?'s':'')):('Late '+late+' min')) : 'Working';
    return rec;
  }
  const parts = [];
  if(late>0) parts.push(late>=60 ? ('Late '+(late/60)+' hr'+(late>60?'s':'')) : ('Late '+late+' min'));
  if(early>0) parts.push(early>=60 ? ('Early '+(early/60)+' hr'+(early>60?'s':'')) : ('Early '+early+' min'));
  if(ot>0) parts.push('OT '+fmtLate(ot));
  rec.status = parts.length ? parts.join(' · ') : 'On Time';
  return rec;
}
function fmtLate(mins){
  if(!mins) return '';
  if(mins<60) return mins+' min';
  const h=Math.floor(mins/60), m=mins%60;
  return h+'h'+(m?' '+m+'m':'');
}

// live location vars
let geoLast=null; // {lat,lng,dist,inside,address}
function updateGeoView(){
  const s=DB.attSettings;
  const distEl=document.getElementById('geoDist'), locEl=document.getElementById('geoLoc'), mapEl=document.getElementById('geoMap');
  if(!distEl) return;
  if(!navigator.geolocation){ if(locEl) locEl.textContent='No GPS on device'; return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la=pos.coords.latitude, lo=pos.coords.longitude;
    const d=distM(la,lo,s.lat,s.lng);
    const inside = d<=s.radius;
    geoLast={lat:la,lng:lo,dist:d,inside,address:null};
    if(distEl){ distEl.textContent=Math.round(d)+' m'; distEl.className='geo-dist '+(inside?'in':'out'); }
    // static map image (OpenStreetMap via staticmap service, no key)
    if(mapEl){
      const z=17, w=600, h=180;
      mapEl.innerHTML=`<img src="https://staticmap.openstreetmap.de/staticmap.php?center=${la},${lo}&zoom=${z}&size=${w}x${h}&markers=${la},${lo},lightblue1&markers=${s.lat},${s.lng},red-pushpin" alt="map" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML='<div class=geo-loading>'+(${inside}?'You are at the office':'You are '+Math.round(${d})+'m away')+'</div>'">`;
    }
    // reverse geocode address
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${la}&lon=${lo}&zoom=18`,{headers:{'Accept':'application/json'}});
      const j=await r.json();
      if(j && j.display_name){ geoLast.address=j.display_name; if(locEl) locEl.textContent=(inside?'✓ At office · ':'⚠ Off-site · ')+j.display_name.split(',').slice(0,3).join(','); }
      else if(locEl) locEl.textContent=(inside?'✓ At office':'⚠ Off-site')+' · '+la.toFixed(5)+', '+lo.toFixed(5);
    }catch(e){ if(locEl) locEl.textContent=(inside?'✓ At office':'⚠ Off-site')+' · '+la.toFixed(5)+', '+lo.toFixed(5); }
  }, ()=>{ if(locEl) locEl.textContent='Location blocked — allow GPS'; }, {enableHighAccuracy:true,timeout:10000});
}

async function doPunch(){
  attData();
  const s=DB.attSettings;
  const chauffeur = isChauffeur(current.username);
  // geofence check (all punches) if office location is set
  if(s.lat && s.lng){
    const loc = geoLast || await getLocOnce();
    if(!loc){ toast('Need your location to clock in — allow GPS'); return; }
    if(!loc.inside){
      if(chauffeur){
        // chauffeur: off-site is normal, but must take a watermarked selfie as proof
        const photo = await captureOffsiteSelfie(loc);
        if(!photo){ toast('Off-site clock-in needs a photo'); return; }
        finishPunch(photo, loc);
        return;
      } else {
        // office staff: cannot clock in away from the office
        toast('You are '+Math.round(loc.dist)+'m away — clock in at the office');
        return;
      }
    }
  }
  finishPunch(null, geoLast);
}

function getLocOnce(){
  return new Promise(res=>{
    if(!navigator.geolocation){ res(null); return; }
    const s=DB.attSettings;
    navigator.geolocation.getCurrentPosition(pos=>{
      const la=pos.coords.latitude, lo=pos.coords.longitude;
      const d=distM(la,lo,s.lat,s.lng);
      res({lat:la,lng:lo,dist:d,inside:d<=s.radius,address:null});
    }, ()=>res(null), {enableHighAccuracy:true,timeout:10000});
  });
}

function finishPunch(photo, loc){
  const recs = DB.attendance[current.username] || (DB.attendance[current.username]={});
  const k = todayKey();
  const now = fmtTime(new Date());
  let rec = recs[k] || (recs[k]={ amIn:null,lunchOut:null,lunchIn:null,pmOut:null,leave:null,lateMins:0,otMins:0,status:'',offsite:{} });
  rec._dateKey = k;
  if(!rec.offsite) rec.offsite={};
  let punch='';
  if(!rec.amIn){ rec.amIn=now; punch='Morning In'; toast('Clocked in — '+now); }
  else if(!rec.lunchOut){ rec.lunchOut=now; punch='Lunch Out'; toast('Lunch out — '+now); }
  else if(!rec.lunchIn){ rec.lunchIn=now; punch='Lunch In'; toast('Welcome back — '+now); }
  else if(!rec.pmOut){ rec.pmOut=now; punch='Evening Out'; toast('Clocked out — '+now); }
  if(photo){ rec.offsite[punch]={photo, lat:loc&&loc.lat, lng:loc&&loc.lng, dist:loc?Math.round(loc.dist):null, address:loc&&loc.address, time:now}; }
  recomputeDay(current.username, rec);
  // On the FIRST punch of the day, if yesterday/recent days include a Sunday not yet logged, send a "Sunday — Off" row
  if(punch==='Morning In') maybeSendSunday(current.username, k);
  saveDB();
  syncAttendance(current.username, k, rec, {punch, time:now, offsite: photo?true:false, dist: loc?Math.round(loc.dist):''});
  renderAttClock();
}

/* When a staff punches, log the most recent past Sunday once, so each week's Sunday shows in the sheet. */
function maybeSendSunday(username, dateKey){
  if(!DB.sundaySent) DB.sundaySent={};
  if(!DB.sundaySent[username]) DB.sundaySent[username]=[];
  // find the Sunday of THIS week (the one just before/at this date)
  const d=new Date(dateKey);
  const back=d.getDay(); // days since Sunday
  const sun=new Date(d); sun.setDate(d.getDate()-back);
  const sk=todayKey(sun);
  if(sk>=dateKey) return; // don't log today if today is Sunday-or-future edge
  if(DB.sundaySent[username].includes(sk)) return;
  DB.sundaySent[username].push(sk);
  // send a Sunday-off marker row (no punch times)
  syncAttendance(username, sk, {amIn:null,lunchOut:null,lunchIn:null,pmOut:null,status:'Sunday — Off',lateMins:0,otMins:0,leave:null,_dateKey:sk}, {punch:'Sunday', time:''});
}

/* Capture a live selfie and stamp time/date/GPS/address watermark. Returns base64 or null. */
function captureOffsiteSelfie(loc){
  return new Promise(async res=>{
    // ensure we have address for the stamp
    if(loc && !loc.address){
      try{ const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${loc.lat}&lon=${loc.lng}&zoom=18`); const j=await r.json(); if(j&&j.display_name) loc.address=j.display_name; }catch(e){}
    }
    const overlay=document.createElement('div');
    overlay.className='cam-overlay';
    overlay.innerHTML=`
      <div class="cam-box">
        <div class="cam-title">Off-site clock-in — take a selfie</div>
        <video id="camVid" autoplay playsinline></video>
        <canvas id="camCanvas" style="display:none"></canvas>
        <div class="cam-row">
          <button class="btn ghost no" id="camCancel">Cancel</button>
          <button class="btn" id="camShot">Capture</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    let stream;
    const cleanup=()=>{ if(stream) stream.getTracks().forEach(t=>t.stop()); overlay.remove(); };
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      document.getElementById('camVid').srcObject=stream;
    }catch(e){ toast('Cannot open camera'); cleanup(); res(null); return; }
    document.getElementById('camCancel').addEventListener('click',()=>{ cleanup(); res(null); });
    document.getElementById('camShot').addEventListener('click',()=>{
      const v=document.getElementById('camVid'), c=document.getElementById('camCanvas');
      const w=v.videoWidth||640, h=v.videoHeight||480;
      c.width=w; c.height=h;
      const ctx=c.getContext('2d');
      ctx.drawImage(v,0,0,w,h);
      // watermark
      const now=new Date();
      const lines=[
        now.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})+'  '+now.toLocaleTimeString('en-GB'),
        loc?('GPS: '+loc.lat.toFixed(6)+', '+loc.lng.toFixed(6)+(loc.dist?('  ('+Math.round(loc.dist)+'m from office)'):'')):'GPS: n/a',
        loc&&loc.address ? loc.address : ''
      ].filter(Boolean);
      const pad=Math.round(w*0.02);
      const fs=Math.max(14, Math.round(w*0.030));
      ctx.font=fs+'px Arial';
      const lineH=fs*1.35;
      const boxH=lineH*lines.length+pad;
      ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.fillRect(0,h-boxH,w,boxH);
      ctx.fillStyle='#fff'; ctx.textBaseline='top';
      lines.forEach((ln,i)=>{
        // wrap long address
        const maxW=w-pad*2; let text=ln;
        while(ctx.measureText(text).width>maxW && text.length>10){ text=text.slice(0,-4); }
        if(text!==ln) text=text+'…';
        ctx.fillText(text, pad, h-boxH+pad/2+i*lineH);
      });
      // gold brand tag
      ctx.fillStyle='#c9a24b'; ctx.font='bold '+fs+'px Arial';
      ctx.fillText('GRANDPRIDE', pad, h-boxH-lineH);
      const b64=c.toDataURL('image/jpeg',0.7);
      cleanup(); res(b64);
    });
  });
}

function checkGeofence(s){
  return new Promise(res=>{
    if(!navigator.geolocation){ toast('No GPS on device'); res(true); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      const d = distM(pos.coords.latitude,pos.coords.longitude,s.lat,s.lng);
      if(d <= s.radius){ res(true); }
      else { toast('Too far from office ('+Math.round(d)+'m)'); res(false); }
    }, ()=>{ toast('Location blocked — allow GPS'); res(false); }, {enableHighAccuracy:true,timeout:8000});
  });
}
function distM(la1,lo1,la2,lo2){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLa=toR(la2-la1),dLo=toR(lo2-lo1);
  const a=Math.sin(dLa/2)**2+Math.cos(toR(la1))*Math.cos(toR(la2))*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* count working days (excl Sundays) between two dates inclusive */
function countLeaveDays(from,to){
  if(!from) return 0;
  const f=new Date(from), t=new Date(to||from);
  if(isNaN(f)||isNaN(t)||t<f) return 0;
  let n=0; const d=new Date(f);
  while(d<=t){ if(d.getDay()!==0) n++; d.setDate(d.getDate()+1); }
  return n;
}

/* Draw-signature pad. Returns a base64 PNG or null if cancelled. */
function getSignature(who){
  return new Promise(res=>{
    const overlay=document.createElement('div');
    overlay.className='cam-overlay';
    overlay.innerHTML=`
      <div class="cam-box">
        <div class="cam-title">${who} — sign below</div>
        <canvas id="sigPad" style="width:100%;height:200px;background:#fff;border-radius:12px;touch-action:none"></canvas>
        <div class="cam-row">
          <button class="btn ghost no" id="sigCancel">Cancel</button>
          <button class="btn ghost" id="sigClear">Clear</button>
          <button class="btn" id="sigDone">Done</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const c=document.getElementById('sigPad');
    const rect=c.getBoundingClientRect();
    c.width=rect.width*2; c.height=rect.height*2;
    const ctx=c.getContext('2d');
    ctx.scale(2,2); ctx.lineWidth=2.5; ctx.lineCap='round'; ctx.strokeStyle='#111';
    let drawing=false, used=false, lx=0, ly=0;
    const pos=e=>{ const r=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left, y:t.clientY-r.top}; };
    const start=e=>{ drawing=true; used=true; const p=pos(e); lx=p.x; ly=p.y; e.preventDefault(); };
    const move=e=>{ if(!drawing) return; const p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; e.preventDefault(); };
    const end=()=>{ drawing=false; };
    c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
    const cleanup=()=>{ window.removeEventListener('mouseup',end); overlay.remove(); };
    document.getElementById('sigCancel').addEventListener('click',()=>{ cleanup(); res(null); });
    document.getElementById('sigClear').addEventListener('click',()=>{ ctx.clearRect(0,0,c.width,c.height); used=false; });
    document.getElementById('sigDone').addEventListener('click',()=>{
      if(!used){ toast('Please sign first'); return; }
      const data=c.toDataURL('image/png');
      cleanup(); res(data);
    });
  });
}

async function submitLeave(){
  attData();
  const type=document.getElementById('lvType').value;
  const rangeOn=document.getElementById('lvRangeChk').checked;
  const from=document.getElementById('lvFrom').value;
  const to=rangeOn?document.getElementById('lvTo').value:from;
  const reason=document.getElementById('lvReason').value.trim();
  if(!from){ toast('Pick a date'); return; }
  if(rangeOn && (!to || new Date(to)<new Date(from))){ toast('End date must be after start'); return; }
  if(!reason){ toast('Please enter a reason'); return; }
  const days=countLeaveDays(from,to);
  if(days<=0){ toast('No working days selected'); return; }
  if(current.role!=='Admin'){
    const ent=leaveEntitlement(DB.joinDates && DB.joinDates[current.username], DB.confirmedDates && DB.confirmedDates[current.username]);
    if((type==='AL'||type==='EL') && ent.onProbation){ toast('No annual/emergency leave during probation'); return; }
    if(type==='AL' && ent.al<=0){ toast('You have no annual leave entitlement'); return; }
  }
  let proof=null;
  if(type==='MC'){
    const pe=document.getElementById('lvProof');
    proof = pe && pe.dataset.b64 ? pe.dataset.b64 : null;
    if(!proof){ toast('MC requires a proof photo'); return; }
  }
  // staff e-signature (required)
  const sig = await getSignature(current.name+' (Staff)');
  if(!sig){ toast('Signature required to submit'); return; }
  if(!DB.leaveReqs[current.username]) DB.leaveReqs[current.username]=[];
  DB.leaveReqs[current.username].unshift({ from, to, days, type, reason, status:'Pending', proof, submitted:todayKey(), staffSig:sig });
  saveDB();
  syncLeave(current.username, DB.leaveReqs[current.username][0]);
  toast('Leave request submitted to HOD');
  renderAttLeave();
}

async function setLeaveStatus(ref, status){
  attData();
  const [uname, idx] = ref.split('|');
  const arr = DB.leaveReqs[uname];
  if(arr && arr[idx]){
    const r=arr[idx];
    // HOD/approver e-signature required when approving
    if(status==='Approved'){
      const sig = await getSignature(current.name+' (Approver)');
      if(!sig){ toast('Signature required to approve'); return; }
      r.approverSig = sig;
    }
    r.status = status;
    r.decidedBy = current.name;
    r.decidedOn = todayKey();
    // On approval, upload MC proof photo to ImgBB (if key set & not already uploaded)
    if(status==='Approved' && r.proof && !r.proofUrl && DB.attSettings && DB.attSettings.imgbbKey){
      toast('Uploading MC proof…');
      const link = await uploadToImgBB(r.proof);
      if(link) r.proofUrl = link;
    }
    if(status==='Approved'){
      // mark every working day in the range as on-leave (keep punches if they already exist)
      if(!DB.attendance[uname]) DB.attendance[uname]={};
      const f=new Date(r.from||r.date), t=new Date(r.to||r.date);
      const d=new Date(f);
      while(d<=t){
        if(d.getDay()!==0){
          const k=todayKey(d);
          const ex = DB.attendance[uname][k] || {};
          DB.attendance[uname][k]={
            amIn:ex.amIn||null, lunchOut:ex.lunchOut||null, lunchIn:ex.lunchIn||null, pmOut:ex.pmOut||null,
            status:r.type, lateMins:ex.lateMins||0, otMins:ex.otMins||0, leave:r.type, _dateKey:k
          };
          // send a dedicated leave-day row to the staff's sheet tab
          syncAttendance(uname, k, DB.attendance[uname][k], {punch:'Leave ('+r.type+')', time:''});
        }
        d.setDate(d.getDate()+1);
      }
    }
    saveDB();
    syncLeave(uname, r);
    toast('Marked '+status);
    renderAttLeave();
  }
}

      : ('Auto: '+(tmp.lateMins?('Late '+fmtLate(tmp.lateMins)):'On time')+(tmp.otMins?(' · OT '+fmtLate(tmp.otMins)):''));
    renderSalEstimate(uname, tmp);
  };
  ['mgAmIn','mgLunchOut','mgLunchIn','mgPmOut'].forEach(id=>document.getElementById(id).addEventListener('input',recalc));
  document.getElementById('mgLeave').addEventListener('change',recalc);
  document.getElementById('mgSalary').addEventListener('input',recalc);
  document.getElementById('mgSave').addEventListener('click',()=>saveMgRecord(uname,date));
  document.getElementById('mgDelete').addEventListener('click',()=>deleteMgRecord(uname,date));
  document.getElementById('mgSaveSalary').addEventListener('click',()=>{
    if(!DB.salaries) DB.salaries={};
    const v=parseFloat(document.getElementById('mgSalary').value)||0;
    DB.salaries[uname]=v; saveDB(); toast('Salary saved'); recalc();
  });
  const showEnt=()=>{
    const jd=document.getElementById('mgJoin').value;
    const cd=DB.confirmedDates && DB.confirmedDates[uname];
    const ent=leaveEntitlement(jd, cd);
    const out=document.getElementById('mgEntOut');
    const prob=document.getElementById('mgProbBox');
    if(!jd){
      prob.innerHTML='';
      out.innerHTML='<p class="small" style="color:var(--grey)">Set a join date to auto-calculate leave entitlement.</p>';
      return;
    }
    // probation control
    if(ent.confirmed){
      prob.innerHTML = `<div class="ded-row"><span>Status</span><span style="color:#7ddc94">Confirmed on ${new Date(cd).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span></div>
        <button class="btn ghost no" id="mgUnconfirm" style="margin-top:8px">Revert to Probation</button>`;
    } else {
      const warn = ent.dueForReview ? '<p class="small" style="color:#f0b056;margin-bottom:8px">Passed 3-month default — due for review. Confirm to grant annual leave, or leave as-is to extend probation.</p>' : '<p class="small" style="color:var(--grey);margin-bottom:8px">On probation (no annual leave yet). Tap Confirm when probation is complete — this can be any time, so probation can be extended simply by confirming later.</p>';
      prob.innerHTML = warn + `<button class="btn" id="mgConfirm">✓ Confirm Staff (end probation today)</button>`;
    }
    out.innerHTML=`
      <div class="ded-row"><span>Tenure</span><span>${tenureLabel(ent)}</span></div>
      <div class="ded-row"><span>Annual Leave (AL)</span><span>${ent.al} days</span></div>
      <div class="ded-row"><span>Medical (MC)</span><span>${ent.mc} days</span></div>
      <div class="ded-row"><span>Emergency (EL)</span><span>${ent.elFromAl?'from AL':'after probation'}</span></div>
      <div class="ded-row"><span>Maternity / Paternity</span><span>${ent.maternity} / ${ent.paternity} days</span></div>`;
    const cBtn=document.getElementById('mgConfirm');
    if(cBtn) cBtn.addEventListener('click',()=>{
      if(!DB.confirmedDates) DB.confirmedDates={};
      DB.confirmedDates[uname]=todayKey();
      saveDB(); toast('Staff confirmed — probation ended'); showEnt();
    });
    const uBtn=document.getElementById('mgUnconfirm');
    if(uBtn) uBtn.addEventListener('click',()=>{
      delete DB.confirmedDates[uname];
      saveDB(); toast('Reverted to probation'); showEnt();
    });
  };
  document.getElementById('mgJoin').addEventListener('input',showEnt);
  document.getElementById('mgSaveJoin').addEventListener('click',()=>{
    if(!DB.joinDates) DB.joinDates={};
    const jd=document.getElementById('mgJoin').value;
    if(!jd){ toast('Pick a join date'); return; }
    DB.joinDates[uname]=jd; saveDB(); toast('Join date saved'); showEnt();
  });
  if(document.getElementById('mgSaveChauffeur')){
    const chCalc=()=>{
      if(!DB.chauffeurCfg) DB.chauffeurCfg={};
      const wh=+document.getElementById('chWork').value||10;
      const lh=+document.getElementById('chLunch').value||1.5;
      const nr=+document.getElementById('chNormal').value||0;
      const ot=+document.getElementById('chOT').value||0;
      // preview using the currently-loaded day's punches
      const tmp={ _dateKey:date, amIn:val('mgAmIn'),lunchOut:val('mgLunchOut'),lunchIn:val('mgLunchIn'),pmOut:val('mgPmOut'),leave:null };
      // temporarily apply cfg for preview
      DB.chauffeurCfg[uname]={workHours:wh,lunchHours:lh,normalRate:nr,otRate:ot};
      recomputeDay(uname,tmp);
      const el=document.getElementById('chCalc');
      if(tmp.workMins!=null && tmp.amIn && tmp.pmOut){
        const worked=tmp.workMins/60, oth=tmp.otMins/60;
        const monthly=parseFloat(document.getElementById('mgSalary').value)||0;
        const daily=monthly/26;
        const otPay=oth*ot;
        const dayTotal=daily+otPay;
        const isSun = new Date(date).getDay()===0;
        el.innerHTML='Worked <b>'+worked.toFixed(1)+'h</b> '
          +(isSun?'(Sunday — all OT)':'(limit '+wh+'h)')
          +' → OT <b>'+oth.toFixed(1)+'h</b><br>'
          +'Base (salary ÷26): RM '+daily.toFixed(2)+'<br>'
          +'OT: '+oth.toFixed(1)+'h × RM '+ot.toFixed(2)+' = RM '+otPay.toFixed(2)+'<br>'
          +'<b>Day total: RM '+dayTotal.toFixed(2)+'</b>';
      } else el.textContent='Enter the day\u2019s punches and monthly salary above to preview pay.';
    };
    document.getElementById('mgSaveChauffeur').addEventListener('click',()=>{
      if(!DB.chauffeurCfg) DB.chauffeurCfg={};
      DB.chauffeurCfg[uname]={
        workHours:+document.getElementById('chWork').value||10,
        lunchHours:+document.getElementById('chLunch').value||1.5,
        normalRate:+document.getElementById('chNormal').value||0,
        otRate:+document.getElementById('chOT').value||0
      };
      saveDB(); toast('Chauffeur settings saved'); chCalc();
    });
    ['chWork','chLunch','chNormal','chOT','mgSalary','mgAmIn','mgLunchOut','mgLunchIn','mgPmOut'].forEach(id=>{
      const e=document.getElementById(id); if(e) e.addEventListener('input',chCalc);
    });
    chCalc();
  }
  showEnt();
  recalc();
  function val(id){ return document.getElementById(id).value||null; }
}

function renderSalEstimate(uname, dayRec){
  const out=document.getElementById('mgSalOut'); if(!out) return;
  const sal=parseFloat(document.getElementById('mgSalary').value)||0;
  if(!sal){ out.innerHTML='<p class="small" style="color:var(--grey)">Enter a monthly salary to see daily/hourly rate and this day\u2019s late/OT value.</p>'; return; }
  const daily=sal/26, hourly=daily/8;
  const lateVal=(dayRec.lateMins||0)/60*hourly;
  const otVal=(dayRec.otMins||0)/60*hourly;
  out.innerHTML=`
    <div class="ded-row"><span>Daily rate (÷26)</span><span>RM ${daily.toFixed(2)}</span></div>
    <div class="ded-row"><span>Hourly rate (÷8)</span><span>RM ${hourly.toFixed(2)}</span></div>
    <div class="ded-row"><span>Late deduction (this day)</span><span style="color:var(--bad)">− RM ${lateVal.toFixed(2)}</span></div>
    <div class="ded-row"><span>OT pay (this day)</span><span style="color:var(--gold-soft)">+ RM ${otVal.toFixed(2)}</span></div>`;
}

function saveMgRecord(uname,date){
  attData();
  if(!DB.attendance[uname]) DB.attendance[uname]={};
  const leave=document.getElementById('mgLeave').value;
  let rec;
  if(leave){
    rec={ amIn:null,lunchOut:null,lunchIn:null,pmOut:null,leave, lateMins:0, otMins:0, status:leave };
  } else {
    rec={
      amIn: document.getElementById('mgAmIn').value||null,
      lunchOut: document.getElementById('mgLunchOut').value||null,
      lunchIn: document.getElementById('mgLunchIn').value||null,
      pmOut: document.getElementById('mgPmOut').value||null,
      leave:null, lateMins:0, otMins:0, status:''
    };
    recomputeDay(uname, rec);
  }
  DB.attendance[uname][date]=rec;
  saveDB();
  syncAttendance(uname,date,rec);
  toast('Record saved');
}

function deleteMgRecord(uname,date){
  attData();
  if(DB.attendance[uname] && DB.attendance[uname][date]){
    delete DB.attendance[uname][date];
    saveDB();
    syncAttendance(uname,date,{amIn:null,lunchOut:null,lunchIn:null,pmOut:null,status:'',lateMins:0,otMins:0,leave:null});
    toast('Record deleted');
    document.getElementById('mgEdit').innerHTML='';
  } else {
    toast('No record on that date');
  }
}
function staffTodayRows(){
  const k=todayKey();
  return DB.users.filter(u=>u.role!=='Admin').map(u=>{
    const r=(DB.attendance[u.username]||{})[k];
    let st;
    if(!r) st='<span class="pill off">—</span>';
    else if(r.leave) st=`<span class="pill off">${r.leave}</span>`;
    else {
      const t=[r.amIn,r.pmOut].filter(Boolean).join(' → ')||'—';
      const tag=r.lateMins>0?'late':'ok';
      st=`<span class="pill ${tag}">${t}</span>`+(r.otMins>0?` <span class="pill pending">OT ${fmtLate(r.otMins)}</span>`:'');
    }
    return `<div class="rec-row"><span class="d">${u.name}</span><span>${st}</span></div>`;
  }).join('') || '<div class="rec-row"><span class="d">No staff</span></div>';
}

/* sync one record to Supabase + Google Sheets */
async function syncAttendance(username, dateKey, rec, ev){
  const name=(DB.users.find(u=>u.username===username)||{}).name||username;
  if(useCloud && sb){
    try{
      await sb.from('hub_attendance').upsert({
        username, date:dateKey, am_in:rec.amIn, lunch_out:rec.lunchOut, lunch_in:rec.lunchIn,
        pm_out:rec.pmOut, status:rec.status, late_mins:rec.lateMins, ot_mins:rec.otMins, leave_type:rec.leave
      }, { onConflict:'username,date' });
    }catch(e){ console.warn('att supabase sync failed', e); }
  }
  const url = DB.attSettings && DB.attSettings.gsUrl;
  if(url){
    try{
      const chauffeur = isChauffeur(username);
      // 'sheet' = staff tab. 'punch'/'punchTime' = the single event that just happened (for the full log).
      fetch(url, { method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          type:'punch', sheet: name, username, name, date:dateKey, periodMonth: payrollMonth(dateKey, username),
          punch: ev&&ev.punch ? ev.punch : '', punchTime: ev&&ev.time ? ev.time : '',
          amIn:rec.amIn||'', lunchOut:rec.lunchOut||'', lunchIn:rec.lunchIn||'', pmOut:rec.pmOut||'',
          status:rec.status||'', lateMins:rec.lateMins||0, otMins:rec.otMins||0, earlyMins:rec.earlyMins||0, leave:rec.leave||'',
          // chauffeur extras (blank for normal staff)
          isChauffeur: chauffeur ? 'Yes' : '',
          workedHours: chauffeur && rec.workMins ? (rec.workMins/60).toFixed(2) : '',
          otHours: chauffeur && rec.otMins ? (rec.otMins/60).toFixed(2) : '',
          assignedStart: chauffeur ? (rec.assignedStart||'') : '',
          offsite: ev&&ev.offsite ? 'Yes' : ''
        }) });
    }catch(e){ console.warn('sheets sync failed', e); }
  }
}

/* Upload a base64 image to ImgBB, return the public URL (or null). */
async function uploadToImgBB(base64){
  const key = DB.attSettings && DB.attSettings.imgbbKey;
  if(!key || !base64) return null;
  try{
    // strip the data: prefix — ImgBB wants the raw base64
    const raw = base64.indexOf(',')>=0 ? base64.split(',')[1] : base64;
    const form = new FormData();
    form.append('image', raw);
    const res = await fetch('https://api.imgbb.com/1/upload?key='+encodeURIComponent(key), { method:'POST', body:form });
    const j = await res.json();
    if(j && j.success && j.data && j.data.url) return j.data.url;
  }catch(e){ console.warn('imgbb upload failed', e); }
  return null;
}

/* sync a leave request to Google Sheets (own 'Leave' tab). Photo proof not sent (too large); kept in-app. */
async function syncLeave(username, r){
  const name=(DB.users.find(u=>u.username===username)||{}).name||username;
  const url = DB.attSettings && DB.attSettings.gsUrl;
  if(url){
    try{
      fetch(url, { method:'POST', mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body: JSON.stringify({
          sheet:'Leave', type:'leave', username, name, periodMonth: payrollMonth(r.from||r.date, username),
          leaveType:r.type, from:r.from||r.date, to:r.to||r.date, days:r.days||1,
          reason:r.reason||'', status:r.status||'', submitted:r.submitted||'',
          decidedBy:r.decidedBy||'', decidedOn:r.decidedOn||'', hasProof: r.proof?'Yes':'No', proofUrl: r.proofUrl||''
        }) });
    }catch(e){ console.warn('leave sheets sync failed', e); }
  }
}

/* Push a sample payroll period of punches + leave to the Sheet so the format can be reviewed. */
async function sendTestMonth(){
  const url = DB.attSettings && DB.attSettings.gsUrl;
  if(!url){ toast('Save your Sheets URL first'); return; }
  const name = 'TEST STAFF';
  const period = payrollPeriod();   // current 24th -> 23rd window
  const start = new Date(period.start), end = new Date(period.end);
  toast('Sending test period… please wait');

  let posts = 0;
  const postPunch = (dateKey, punch, time, late, ot, status, leave) => {
    return fetch(url, { method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({
        type:'punch', sheet:name, username:'teststaff', name, date:dateKey, periodMonth: payrollMonth(dateKey),
        punch, punchTime:time||'', amIn:'', lunchOut:'', lunchIn:'', pmOut:'',
        status, lateMins: late||0, otMins: ot||0, leave: leave||''
      }) });
  };

  // pick a couple of leave days inside the period (3rd and 12th working days roughly)
  const periodStartKey = period.start;
  const dAdd = (base, n)=>{ const x=new Date(base); x.setDate(x.getDate()+n); return todayKey(x); };
  const leaveDays = { [dAdd(start,4)]:'AL', [dAdd(start,5)]:'AL', [dAdd(start,12)]:'MC' };

  let dayIdx = 0;
  const cur = new Date(start);
  while(cur <= end){
    const dateKey = todayKey(cur);
    dayIdx++;

    // Sundays -> a "Sunday — Off" row
    if(cur.getDay()===0){
      await postPunch(dateKey,'Sunday','',0,0,'Sunday — Off','');
      posts++; if(posts%4===0) await new Promise(r=>setTimeout(r,150));
      cur.setDate(cur.getDate()+1); continue;
    }
    // Approved leave days -> a leave row
    if(leaveDays[dateKey]){
      const lt = leaveDays[dateKey];
      await postPunch(dateKey, 'Leave ('+lt+')', '', 0, 0, lt, lt);
      posts++; if(posts%4===0) await new Promise(r=>setTimeout(r,150));
      cur.setDate(cur.getDate()+1); continue;
    }
    // normal working day
    const late = (dayIdx%5===0) ? 30 : 0;
    const ot   = (dayIdx%7===0) ? 90 : 0;    // every 7th day OT: clock out 8:30pm = 90 min past 7pm
    const leftEarly = (dayIdx%6===0);          // every 6th day leaves early
    const amIn = late ? '09:20' : '08:30';
    const pmOut = ot ? '20:30' : (leftEarly ? '18:00' : '18:30');  // 18:30 = on time end
    await postPunch(dateKey,'Morning In', amIn, 0,0,'','');
    await postPunch(dateKey,'Lunch Out', '12:00', 0,0,'','');
    await postPunch(dateKey,'Lunch In', '13:00', 0,0,'','');
    // build status the same way recomputeDay does, so the sheet matches
    const eMin = leftEarly ? 30 : 0;
    const parts=[];
    if(late>0) parts.push('Late '+late+' min');
    if(eMin>0) parts.push('Early '+eMin+' min');
    if(ot>0) parts.push('OT '+fmtLate(ot));
    const status = parts.length? parts.join(' · ') : 'On Time';
    await postPunch(dateKey,'Evening Out', pmOut, late, ot, status, '');
    posts++; if(posts%4===0) await new Promise(r=>setTimeout(r,150));
    cur.setDate(cur.getDate()+1);
  }

  // also send the leave records to the dedicated Leave tab
  const alFrom = dAdd(start,4), alTo = dAdd(start,5), mcDay = dAdd(start,12);
  const lv = [
    {type:'AL', from:alFrom, to:alTo, days:2, reason:'Family trip', status:'Approved', submitted:periodStartKey, decidedBy:'Liam Ong'},
    {type:'MC', from:mcDay, to:mcDay, days:1, reason:'Fever', status:'Approved', submitted:mcDay, decidedBy:'Liam Ong', proof:true}
  ];
  for(const r of lv){
    await fetch(url, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'},
      body: JSON.stringify({ sheet:'Leave', type:'leave', username:'teststaff', name, periodMonth: payrollMonth(r.from),
        leaveType:r.type, from:r.from, to:r.to, days:r.days, reason:r.reason, status:r.status,
        submitted:r.submitted, decidedBy:r.decidedBy, decidedOn:r.submitted, hasProof:r.proof?'Yes':'No' }) });
  }

  toast('Test month sent — check your Google Sheet ("'+name+'" tab)');
}

/* ================= TOAST ================= */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2200);
}

/* ================= INIT ================= */
async function init(){
  if(SUPABASE_URL && SUPABASE_ANON_KEY){
    try{
      await new Promise((res,rej)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
        s.onload=res; s.onerror=rej;
        document.head.appendChild(s);
      });
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      useCloud = true;
    }catch(e){ useCloud=false; }
  }
  try{
    await loadDB();
  }catch(e){
    console.warn('loadDB failed, seeding defaults', e);
    seedDefaultLocal();
  }
  if(!DB.users || !DB.users.length){ seedDefaultLocal(); }

  // ---- bind all buttons here (preview sandboxes strip inline onclick) ----
  const lc=document.getElementById('loginCrest'); if(lc) lc.innerHTML = `<img src="${LOGO}" alt="Grandpride">`;
  const bind=(id,fn)=>{ const e=document.getElementById(id); if(e) e.addEventListener('click',fn); };
  bind('btnEnter', doLogin);
  bind('btnLogout', logout);
  bind('adminGear', openAdmin);
  bind('btnBackApp', goHub);
  bind('btnBackAdmin', goHub);
  bind('tabModules', ()=>switchHubTab('modules'));
  bind('tabGrandpride', ()=>switchHubTab('grandpride'));
  bind('tabGrandlab', ()=>switchHubTab('grandlab'));
  bind('tabNotif', ()=>switchHubTab('notif'));

  const pw=document.getElementById('liPass');
  if(pw) pw.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

  // Remembered device: auto-login the last user so they skip the login screen
  tryAutoLogin();
}
init();
