<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Appointment Reminder</title>
<style>
  :root{
    --ink:#0a0908; --paper:#f5f3ee; --gold:#c9a24b; --gold-soft:#e3c887;
    --grey:#9a958c; --line:rgba(201,162,75,.18); --card:#15120d;
    --green:#5a9e6f; --red:#d2533f; --blue:#5b8bb0; --amber:#d4a23a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:var(--paper);margin:0;min-height:100vh;padding-bottom:40px}
  .top{position:sticky;top:0;z-index:30;background:rgba(10,9,8,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .top .lg{width:38px;height:38px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;color:var(--gold);font-size:15px;border:1px solid var(--line);flex:0 0 auto}
  .top .ti h2{font-family:Georgia,serif;font-size:15px;letter-spacing:1px;margin:0}
  .top .ti p{font-size:11px;color:var(--grey);margin:2px 0 0}
  .wrap{max-width:680px;margin:0 auto;padding:14px 16px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--gold-soft);padding:10px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;border-color:transparent;font-weight:bold}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .panel h3{font-family:Georgia,serif;font-size:16px;margin:0 0 4px}
  .muted{color:var(--grey);font-size:12px;line-height:1.5}
  label{display:block;font-size:11px;letter-spacing:.5px;color:var(--grey);text-transform:uppercase;margin:12px 0 5px}
  input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--paper);background:#0f0d0a;text-align:left;-webkit-appearance:none;appearance:none;
    border:1px solid var(--line);border-radius:10px;padding:12px}
  select,input[type="date"],input[type="time"],input[type="datetime-local"]{text-align:left;text-align-last:left;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
  textarea{min-height:56px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:10px;cursor:pointer;border:none}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;font-weight:bold}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold-soft)}
  .btn.bad{background:transparent;border:1px solid var(--red);color:var(--red)}
  .btn.sm{font-size:13px;padding:9px 11px}
  .btn.full{width:100%}
  .seg{display:flex;gap:8px}
  .seg .opt{flex:1;min-width:90px;text-align:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;background:#100e0b;cursor:pointer;font-size:14px}
  .seg .opt.sel{border-color:var(--gold);background:#1c1810;font-weight:bold}
  .days{display:flex;gap:8px;flex-wrap:wrap}
  .day{padding:9px 14px;border:1.5px solid var(--line);border-radius:20px;background:#100e0b;cursor:pointer;font-size:13px}
  .day.sel{border-color:var(--gold);background:#1c1810;color:var(--gold-soft);font-weight:bold}
  .calc{font-size:14px;color:var(--gold-soft);margin-top:8px;font-weight:bold}
  .appt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .appt .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .appt .dt{font-family:Georgia,serif;font-size:17px}
  .appt .cd{font-size:12px;color:var(--grey);margin-top:2px}
  .appt .ms{font-size:12px;color:var(--grey);margin-top:6px;line-height:1.5}
  .appt .ms b{color:var(--gold-soft)}
  .cd-badge{font-size:10px;padding:4px 9px;border-radius:20px;font-weight:bold;white-space:nowrap}
  .cd-badge.soon{background:var(--amber);color:#000} .cd-badge.over{background:var(--red);color:#fff}
  .cd-badge.ok{background:#2a2620;color:var(--gold-soft)} .cd-badge.paid{background:var(--green);color:#000}
  .cd-badge.bal{background:var(--red);color:#fff}
  .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--grey);padding:30px 20px;font-size:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1810;border:1px solid var(--gold);
    color:var(--gold-soft);padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="top">
    <button onclick="history.back()" style="background:transparent;border:1px solid var(--line);color:var(--gold-soft);width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer;flex:0 0 auto">←</button>
    <div class="lg">GP</div>
    <div class="ti"><h2>APPOINTMENT REMINDER</h2><p id="syncNote">Car rental appointments</p></div>
  </div>

  <div class="wrap">

    <!-- LIST -->
    <div id="listView">
      <div id="apptList"><div class="empty">Loadingâ¦</div></div>
    </div>

    <!-- NEW / EDIT -->
    <div id="newView" style="display:none">
      <div class="panel">
        <h3 id="formTitle">New appointment</h3>
        <div class="two">
          <div><label>Rental date</label><input type="date" id="aDate"></div>
          <div><label>Time</label><input type="time" id="aTime"></div>
        </div>
        <label>Car</label>
        <select id="aCar"><option value="">Select carâ¦</option></select>
        <label>Service type</label>
        <div class="seg" id="aType" style="flex-wrap:wrap">
          <div class="opt sel" data-v="rental" onclick="pickType('rental')">Rental</div>
          <div class="opt" data-v="leasing" onclick="pickType('leasing')">Leasing</div>
          <div class="opt" data-v="lto" onclick="pickType('lto')">LTO</div>
          <div class="opt" data-v="subscription" onclick="pickType('subscription')">Subscription</div>
        </div>
        <label>Service description</label>
        <textarea id="aDesc" placeholder="e.g. 3-day self-drive, airport pickup included"></textarea>
        <label>Customer name</label>
        <input id="aCust" placeholder="Customer name">
        <label>Customer contact</label>
        <input id="aContact" type="tel" placeholder="01x-xxxxxxx">
      </div>

      <div class="panel">
        <h3>Payment</h3>
        <label>Full payment received?</label>
        <div class="seg" id="aPaid">
          <div class="opt" data-v="no" onclick="pickPaid('no')">No â deposit</div>
          <div class="opt sel" data-v="yes" onclick="pickPaid('yes')">Yes â full</div>
        </div>
        <label>Full amount (RM)</label>
        <input type="number" inputmode="decimal" id="aFull" oninput="calcBal()" placeholder="0.00">
        <div id="depWrap" style="display:none">
          <label>Deposit paid (RM)</label>
          <input type="number" inputmode="decimal" id="aDep" oninput="calcBal()" placeholder="0.00">
          <div class="calc" id="balNote"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Reminders</h3>
        <p class="muted">Pick when to be reminded before the rental date.</p>
        <div class="days" id="aDays">
          <div class="day sel" data-d="7" onclick="toggleDay(7)">7 days</div>
          <div class="day sel" data-d="5" onclick="toggleDay(5)">5 days</div>
          <div class="day sel" data-d="3" onclick="toggleDay(3)">3 days</div>
          <div class="day" data-d="1" onclick="toggleDay(1)">1 day</div>
        </div>
      </div>

      <button class="btn gold full" onclick="saveAppt()">Save appointment</button>
      <button class="btn ghost full" id="cancelEdit" style="margin-top:8px;display:none" onclick="resetForm();setTab('list')">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
var SB_URL="https://iefevjkeckysdluzazeq.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZmV2amtlY2t5c2RsdXphemVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODI1MTMsImV4cCI6MjA5NjY1ODUxM30.xVqifxHta7rPtxf0hh1C4_rexhwWQhaiOxEzVr_oM5k";
function sbH(extra){ return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, extra||{}); }
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function rm(n){ return 'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function daysUntil(dateStr){ var d=new Date(dateStr+'T00:00:00'); var t=new Date(); t.setHours(0,0,0,0); return Math.round((d-t)/(1000*60*60*24)); }
function upcase(el){var s=el.selectionStart,e=el.selectionEnd;el.value=el.value.toUpperCase();try{el.setSelectionRange(s,e);}catch(_){}}
document.addEventListener('input',function(e){var el=e.target;if(!el)return;var t=(el.tagName||'').toLowerCase();
  if(t==='textarea'||(t==='input'&&(!el.type||el.type==='text'))){upcase(el);}},true);

var FLEET=[], APPTS=[], EDIT_ID=null;
// Google Apps Script Web App URL (shared Booking+Appointment sheet)
var APPT_SHEET_URL='https://script.google.com/macros/s/AKfycbypjDXMY5bmBY3kiIJL3h6QVv7iaoRuDQVraD4tc54iSnjtjuEZH_443F2AeLfCfCGE/exec';
function apptSheetPush(rec){
  try{ if(!APPT_SHEET_URL||APPT_SHEET_URL.indexOf('http')!==0) return;
    rec.kind='appointment';
    fetch(APPT_SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}).catch(function(){});
  }catch(e){}
}
var F_TYPE='rental', F_PAID='yes', F_DAYS=[7,5,3];

/* ===== Load ===== */
async function loadFleet(){
  try{ var r=await fetch(SB_URL+'/rest/v1/gp_fleet?select=id,plate,model&order=plate.asc',{headers:sbH()});
    if(r.ok) FLEET=await r.json(); }catch(e){}
  $('aCar').innerHTML='<option value="">Select carâ¦</option>'+FLEET.map(c=>`<option value="${c.id}">${esc(c.plate)} â ${esc(c.model||'')}</option>`).join('');
}
async function loadAppts(){
  $('apptList').innerHTML='<div class="empty">Loadingâ¦</div>';
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_appointments?status=eq.upcoming&select=*&order=rental_date.asc',{headers:sbH()});
    APPTS=r.ok?await r.json():[];
    $('syncNote').textContent='Live â¢ '+APPTS.length+' upcoming';
  }catch(e){ APPTS=[]; $('syncNote').textContent='Offline'; }
  renderList();
}
function renderList(){
  if(!APPTS.length){ $('apptList').innerHTML='<div class="empty">No upcoming appointments. They appear here automatically when a booking is made.</div>'; return; }
  $('apptList').innerHTML=APPTS.map(a=>{
    var du=daysUntil(a.rental_date);
    var cd = du<0 ? '<span class="cd-badge over">'+Math.abs(du)+'d ago</span>'
           : du===0 ? '<span class="cd-badge over">TODAY</span>'
           : du<=3 ? '<span class="cd-badge soon">in '+du+' days</span>'
           : '<span class="cd-badge ok">in '+du+' days</span>';
    var pay = a.deposit_paid ? '<span class="cd-badge paid">DEPOSIT PAID</span>'
            : '<span class="cd-badge bal">DEPOSIT NOT PAID</span>';
    return `<div class="appt">
      <div class="row1" onclick='goAgreement("${a.id}")' style="cursor:pointer">
        <div><div class="dt">${esc(a.rental_date)}${a.rental_time?(' Â· '+esc(a.rental_time)):''}</div>
        <div class="cd">${esc(a.plate||'')} ${esc(a.car_model||'')} Â· ${esc(a.service_type||'')}</div></div>
        <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${cd}${pay}</div>
      </div>
      <div class="ms" onclick='goAgreement("${a.id}")' style="cursor:pointer"><b>${esc(a.customer_name||'â')}</b>${a.customer_contact?(' Â· '+esc(a.customer_contact)):''}</div>
      ${a.service_desc?('<div class="ms">'+esc(a.service_desc)+'</div>'):''}
      <div class="ms">Total ${rm(a.full_amount)} Â· Deposit ${rm(a.deposit_amount)}${a.deposit_paid?(' (paid '+rm(a.deposit_paid_amt||a.deposit_amount)+(a.deposit_paid_date?' on '+esc(a.deposit_paid_date):'')+')'):' (not paid)'}</div>
      <div class="act">
        <button class="btn gold sm" onclick='goAgreement("${a.id}")'>â Agreement</button>
        <button class="btn ghost sm" onclick='editAppt("${a.id}")'>Edit</button>
        <button class="btn ghost sm" onclick='markDone("${a.id}")'>â Done</button>
        <button class="btn bad sm" onclick='cancelAppt("${a.id}")'>Cancel</button>
      </div>
    </div>`;
  }).join('');
}

/* ===== Form ===== */
function setTab(t){
  $('listView').style.display=t==='list'?'block':'none';
  $('newView').style.display=t==='new'?'block':'none';
  if($('tabList')) $('tabList').classList.toggle('on',t==='list');
  if($('tabNew')) $('tabNew').classList.toggle('on',t==='new');
  if(t==='list') loadAppts();
}
function pickType(v){ F_TYPE=v; document.querySelectorAll('#aType .opt').forEach(o=>o.classList.toggle('sel',o.dataset.v===v)); }
function pickPaid(v){ F_PAID=v; document.querySelectorAll('#aPaid .opt').forEach(o=>o.classList.toggle('sel',o.dataset.v===v));
  $('depWrap').style.display=v==='no'?'block':'none'; calcBal(); }
function toggleDay(d){ var i=F_DAYS.indexOf(d); if(i>=0)F_DAYS.splice(i,1); else F_DAYS.push(d);
  document.querySelectorAll('#aDays .day').forEach(x=>x.classList.toggle('sel',F_DAYS.indexOf(+x.dataset.d)>=0)); }
function calcBal(){
  var full=parseFloat($('aFull').value||'0')||0;
  var dep=parseFloat($('aDep').value||'0')||0;
  var bal=Math.max(0, full-dep);
  if(F_PAID==='no') $('balNote').textContent='Balance to collect: '+rm(bal);
}
function resetForm(){
  EDIT_ID=null; $('formTitle').textContent='New appointment'; $('cancelEdit').style.display='none';
  $('aDate').value=todayISO(); $('aTime').value='';
  $('aCar').value=''; $('aDesc').value=''; $('aCust').value=''; $('aContact').value='';
  $('aFull').value=''; $('aDep').value=''; $('balNote').textContent='';
  F_TYPE='rental'; pickType('rental'); F_PAID='yes'; pickPaid('yes');
  F_DAYS=[7,5,3]; document.querySelectorAll('#aDays .day').forEach(x=>x.classList.toggle('sel',F_DAYS.indexOf(+x.dataset.d)>=0));
}
function editAppt(id){
  var a=APPTS.find(x=>x.id===id); if(!a) return;
  EDIT_ID=id; setTab('new');
  $('formTitle').textContent='Edit appointment'; $('cancelEdit').style.display='block';
  $('aDate').value=a.rental_date||todayISO(); $('aTime').value=a.rental_time||'';
  $('aCar').value=a.fleet_id||''; $('aDesc').value=a.service_desc||'';
  $('aCust').value=a.customer_name||''; $('aContact').value=a.customer_contact||'';
  $('aFull').value=a.full_amount||''; $('aDep').value=a.deposit_amount||'';
  F_TYPE=a.service_type||'rental'; pickType(F_TYPE);
  F_PAID=a.full_payment?'yes':'no'; pickPaid(F_PAID);
  F_DAYS=Array.isArray(a.remind_days)?a.remind_days.slice():[7,5,3];
  document.querySelectorAll('#aDays .day').forEach(x=>x.classList.toggle('sel',F_DAYS.indexOf(+x.dataset.d)>=0));
}
async function saveAppt(){
  var date=$('aDate').value;
  if(!date){ toast('Pick a rental date'); return; }
  var cust=($('aCust').value||'').trim();
  if(!cust){ toast('Enter customer name'); return; }
  var car=FLEET.find(c=>c.id===$('aCar').value);
  var full=parseFloat($('aFull').value||'0')||0;
  var dep=F_PAID==='no'?(parseFloat($('aDep').value||'0')||0):full;
  var bal=F_PAID==='no'?Math.max(0,full-dep):0;
  var now=new Date().toISOString();
  var row={
    rental_date:date, rental_time:$('aTime').value||'',
    fleet_id:car?car.id:null, plate:car?car.plate:'', car_model:car?(car.model||''):'',
    service_type:F_TYPE, service_desc:($('aDesc').value||'').trim(),
    customer_name:cust, customer_contact:($('aContact').value||'').trim(),
    full_payment:F_PAID==='yes', full_amount:full, deposit_amount:dep, balance_amount:bal,
    remind_days:F_DAYS.slice().sort((a,b)=>b-a), updated_at:now
  };
  try{
    var r;
    if(EDIT_ID){
      r=await fetch(SB_URL+'/rest/v1/gp_appointments?id=eq.'+EDIT_ID,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(row)});
    } else {
      row.status='upcoming'; row.reminded=[]; row.created_at=now;
      r=await fetch(SB_URL+'/rest/v1/gp_appointments',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(row)});
    }
    if(!r.ok){ toast('Save failed'); return; }
    apptSheetPush(Object.assign({}, row, {status: row.status||'upcoming'}));
    toast(EDIT_ID?'Appointment updated':'Appointment saved');
    resetForm(); setTab('list');
  }catch(e){ toast('Offline â not saved'); }
}
async function markDone(id){
  if(!confirm('Mark this appointment as done?')) return;
  try{ await fetch(SB_URL+'/rest/v1/gp_appointments?id=eq.'+id,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({status:'done',updated_at:new Date().toISOString()})});
    toast('Marked done'); loadAppts(); }catch(e){ toast('Offline'); }
}
async function cancelAppt(id){
  if(!confirm('Cancel this appointment?')) return;
  try{ await fetch(SB_URL+'/rest/v1/gp_appointments?id=eq.'+id,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({status:'cancelled',updated_at:new Date().toISOString()})});
    toast('Cancelled'); loadAppts(); }catch(e){ toast('Offline'); }
}
/* hand off to agreement with prefilled params */
function goAgreement(id){
  var a=APPTS.find(x=>x.id===id); if(!a) return;
  // pass the full booking data (and appointment summary) to the agreement
  var payload = Object.assign({}, a.booking_data||{}, {
    _from:'appt', customer_name:a.customer_name, contact:a.customer_contact,
    car_plate:a.plate, car_model:a.car_model, service_type:a.service_type,
    rental_date:a.rental_date, full_amount:a.full_amount, deposit:a.deposit_amount,
    deposit_paid:a.deposit_paid, deposit_paid_amt:a.deposit_paid_amt, deposit_paid_date:a.deposit_paid_date
  });
  try{ sessionStorage.setItem('gp_agreement_prefill', JSON.stringify(payload)); }catch(e){}
  window.location.href='gp-agreement.html?from=appt';
}

/* ===== init ===== */
(async function(){ $('aDate').value=todayISO(); await loadFleet(); await loadAppts(); })();
</script>
</body>
</html>
