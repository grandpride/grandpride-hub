<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Vehicle Use Log</title>
<style>
  :root{
    --ink:#0a0908; --paper:#f5f3ee; --gold:#c9a24b; --gold-soft:#e3c887;
    --grey:#9a958c; --line:rgba(201,162,75,.18); --card:#15120d;
    --green:#5a9e6f; --red:#d2533f; --blue:#5b8bb0; --amber:#d4a23a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:var(--paper);margin:0;min-height:100vh;padding-bottom:40px}
  .top{position:sticky;top:0;z-index:30;background:rgba(10,9,8,.96);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .top .lg{width:38px;height:38px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;color:var(--gold);font-size:15px;border:1px solid var(--line);flex:0 0 auto}
  .top .ti h2{font-family:Georgia,serif;font-size:15px;letter-spacing:1px;margin:0}
  .top .ti p{font-size:11px;color:var(--grey);margin:2px 0 0}
  .wrap{max-width:680px;margin:0 auto;padding:14px 16px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .panel h3{font-family:Georgia,serif;font-size:16px;margin:0 0 4px}
  .muted{color:var(--grey);font-size:12px;line-height:1.5}
  label{display:block;font-size:11px;letter-spacing:.5px;color:var(--grey);text-transform:uppercase;margin:12px 0 5px}
  input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--paper);background:#0f0d0a;text-align:left;-webkit-appearance:none;appearance:none;
    border:1px solid var(--line);border-radius:10px;padding:12px}
  select,input[type="date"],input[type="time"],input[type="datetime-local"]{text-align:left;text-align-last:left;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none}
  textarea{min-height:60px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{font-family:inherit;font-size:14px;padding:12px 14px;border-radius:10px;cursor:pointer;border:none}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;font-weight:bold}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold-soft)}
  .btn.bad{background:transparent;border:1px solid var(--red);color:var(--red)}
  .btn.sm{font-size:13px;padding:9px 11px}
  .btn.full{width:100%}
  .sigwrap{margin-top:4px}
  .sigpad{width:100%;height:120px;background:#fff;border-radius:10px;border:1px solid var(--line);touch-action:none;display:block}
  .pending{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .pending .pl{font-family:Georgia,serif;font-size:16px}
  .pending .ms{font-size:12px;color:var(--grey);margin-top:3px}
  .pill{font-size:10px;padding:4px 9px;border-radius:20px;font-weight:bold;background:#7b9ac8;color:#000}
  .empty{text-align:center;color:var(--grey);padding:24px;font-size:14px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;background:transparent;border:1px solid var(--line);color:var(--gold-soft);padding:10px;border-radius:10px;font-size:13px;font-family:inherit;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;border-color:transparent;font-weight:bold}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1810;border:1px solid var(--gold);
    color:var(--gold-soft);padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
  .opsbadge{background:var(--red);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;margin-left:4px;font-weight:bold}
  .calc{font-size:13px;color:var(--gold-soft);margin-top:8px}
  @media print{.top,.tabs,.btn,.pending .act{display:none!important}body{background:#fff;color:#000}.sigpad{border:1px solid #999}
    .logtbl{font-size:8px}.logtbl th,.logtbl td{border:1px solid #999!important;color:#000!important}
    .rep-scroll{overflow:visible!important}.sigimg{filter:none}.rep-head{color:#000!important}}
  .rep-head{font-family:Georgia,serif;font-size:14px;margin:4px 2px 12px;color:var(--gold-soft);text-align:center;line-height:1.5}
  .rep-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:8px}
  .logtbl{border-collapse:collapse;width:100%;font-size:11px;background:#fff;color:#111}
  .logtbl th{background:#1c1810;color:var(--gold-soft);font-weight:600;padding:6px 5px;border:1px solid #c9a24b33;
    white-space:nowrap;font-size:10px;text-align:left}
  .logtbl td{padding:5px;border:1px solid #ddd;vertical-align:top;white-space:nowrap}
  .logtbl td.rmk{white-space:normal;min-width:140px}
  .logtbl tbody tr:nth-child(even){background:#f6f4ef}
  .sigimg{height:26px;width:auto;max-width:70px;display:block}

/* ==== GRANDPRIDE UPPERCASE (visual) ==== */
body, input, select, textarea, button, .tile, .card, h1,h2,h3,h4,label{ text-transform:uppercase; }
/* keep these lowercase-sensitive: email, password, url, phone, links, code */
input[type="email"], input[type="password"], input[type="url"], input[type="tel"],
input[type="number"], input[type="date"], input[type="time"], input[type="file"],
input[inputmode="email"], input[inputmode="tel"], input[inputmode="url"],
a, code, .no-upper, .keep-case, .email, .url{ text-transform:none !important; }
/* placeholders read nicer in normal case */
::placeholder{ text-transform:none; }

</style>
</head>
<body>
  <div class="top">
    <div class="lg">GP</div>
    <div class="ti"><h2>VEHICLE USE LOG</h2><p id="syncNote">Company / internal use</p></div>
  </div>

  <div class="wrap">
    <div class="tabs">
      <button id="tabNew" class="on" onclick="setTab('new')">🚗 Sign Out</button>
      <button id="tabOps" onclick="setTab('ops')">✍️ Ops Sign <span id="opsBadge" class="opsbadge" style="display:none">0</span></button>
      <button id="tabPending" onclick="setTab('pending')">↩️ Return</button>
      <button id="tabReport" onclick="setTab('report')">📊 Report</button>
    </div>

    <!-- NEW / SIGN OUT -->
    <div id="newView">
      <div class="panel">
        <h3>Trip details</h3>
        <label>Car</label>
        <select id="carSel"><option value="">Select a car…</option></select>
        <label>Driver name</label>
        <select id="driverSel"><option value="">Select driver…</option></select>
        <label>Purpose of use (what for?)</label>
        <input id="purpose" placeholder="e.g. Fetch boss to airport">
        <label>Destination (where to?)</label>
        <input id="dest" placeholder="e.g. KLIA">
      </div>

      <div class="panel">
        <h3>Vehicle OUT</h3>
        <div class="two">
          <div><label>Date out</label><input type="date" id="oDate"></div>
          <div><label>Time out</label><input type="time" id="oTime"></div>
        </div>
        <div class="two">
          <div><label>Mileage out (km)</label><input type="number" inputmode="numeric" id="oMile" placeholder="start odometer"></div>
          <div><label>Petrol bar out</label><input type="number" inputmode="numeric" id="oPet" placeholder="0–8" min="0" max="8"></div>
        </div>
        <label>Driver signature</label>
        <div class="sigwrap"><canvas class="sigpad" id="sigODrv"></canvas></div>
        <button class="btn ghost sm" style="margin-top:6px" onclick="clearSig('sigODrv')">Clear</button>
        <p class="muted" style="margin-top:10px">After you sign out, GP Operation will be notified to add their signature before the car is released.</p>
      </div>

      <button class="btn gold full" onclick="signOut()">Sign Out — request release</button>
    </div>

    <!-- OPS SIGN -->
    <div id="opsView" style="display:none">
      <div id="opsList"><div class="empty">Loading…</div></div>
    </div>

    <!-- PENDING / SIGN IN -->
    <div id="pendingView" style="display:none">
      <div id="pendingList"><div class="empty">Loading…</div></div>
    </div>

    <!-- REPORT -->
    <div id="reportView" style="display:none">
      <div class="panel">
        <h3>Usage report</h3>
        <div class="tabs" style="margin-top:8px">
          <button id="rWeek" class="on" onclick="setRange('week')">This week</button>
          <button id="rMonth" onclick="setRange('month')">This month</button>
        </div>
        <div class="two">
          <div><label>From</label><input type="date" id="rFrom" onchange="renderReport()"></div>
          <div><label>To</label><input type="date" id="rTo" onchange="renderReport()"></div>
        </div>
      </div>
      <div id="reportBody"></div>
      <button class="btn ghost full" onclick="window.print()" style="margin-top:6px">🖨 Print / Save PDF</button>
    </div>
  </div>

  <!-- SIGN IN MODAL -->
  <div class="panel" id="inPanel" style="display:none;position:fixed;inset:0;z-index:60;overflow:auto;border-radius:0;margin:0;background:var(--ink);padding:16px">
    <div style="max-width:680px;margin:0 auto">
      <h3 id="inTitle" style="font-family:Georgia,serif;font-size:18px">Sign In — return car</h3>
      <p class="muted" id="inSub"></p>
      <div class="two">
        <div><label>Date in</label><input type="date" id="iDate"></div>
        <div><label>Time in</label><input type="time" id="iTime"></div>
      </div>
      <div class="two">
        <div><label>Mileage in (km)</label><input type="number" inputmode="numeric" id="iMile" oninput="calcDist()" placeholder="end odometer"></div>
        <div><label>Petrol bar in</label><input type="number" inputmode="numeric" id="iPet" placeholder="0–8" min="0" max="8"></div>
      </div>
      <div class="calc" id="distNote"></div>
      <label>Remark (damage / issues / notes)</label>
      <textarea id="iRem" placeholder="Anything to note about the trip or car"></textarea>
      <label>Driver signature</label>
      <div class="sigwrap"><canvas class="sigpad" id="sigIDrv"></canvas></div>
      <button class="btn ghost sm" style="margin-top:6px" onclick="clearSig('sigIDrv')">Clear</button>
      <label>GP Operation signature</label>
      <div class="sigwrap"><canvas class="sigpad" id="sigIOps"></canvas></div>
      <button class="btn ghost sm" style="margin-top:6px" onclick="clearSig('sigIOps')">Clear</button>
      <button class="btn gold full" style="margin-top:14px" onclick="signIn()">Sign In — complete return</button>
      <button class="btn ghost full" style="margin-top:8px" onclick="window.print()">🖨 Print this record</button>
      <button class="btn bad full" style="margin-top:8px" onclick="closeIn()">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- OPS SIGN MODAL -->
  <div class="panel" id="opsPanel" style="display:none;position:fixed;inset:0;z-index:60;overflow:auto;border-radius:0;margin:0;background:var(--ink);padding:16px">
    <div style="max-width:680px;margin:0 auto">
      <h3 id="opsTitle" style="font-family:Georgia,serif;font-size:18px">GP Operation — authorize release</h3>
      <p class="muted" id="opsSub"></p>
      <div class="panel" id="opsDetail" style="margin-top:10px"></div>
      <label>GP Operation signature</label>
      <div class="sigwrap"><canvas class="sigpad" id="sigOpsApprove"></canvas></div>
      <button class="btn ghost sm" style="margin-top:6px" onclick="clearSig('sigOpsApprove')">Clear</button>
      <label>Who is signing (GP Operation)</label>
      <select id="opsBy"><option value="">Select staff…</option></select>
      <button class="btn gold full" style="margin-top:14px" onclick="opsSign()">Authorize & release car</button>
      <button class="btn bad full" style="margin-top:8px" onclick="closeOps()">Cancel</button>
    </div>
  </div>

<script>
var SB_URL="https://iefevjkeckysdluzazeq.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZmV2amtlY2t5c2RsdXphemVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODI1MTMsImV4cCI6MjA5NjY1ODUxM30.xVqifxHta7rPtxf0hh1C4_rexhwWQhaiOxEzVr_oM5k";
function sbH(extra){ return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, extra||{}); }
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function upcase(el){var s=el.selectionStart,e=el.selectionEnd;el.value=el.value.toUpperCase();try{el.setSelectionRange(s,e);}catch(_){}}
function bindUpper(){document.querySelectorAll('input[type="text"],input:not([type]),textarea').forEach(function(el){if(el.dataset._up)return;el.dataset._up='1';el.addEventListener('input',function(){upcase(el);});});}
function nowTime(){var d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function fmt(iso){if(!iso)return '';var d=new Date(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:true});}

var FLEET=[], STAFF=[], STAFF_ALL=[], STAFF_OPS=[], OPS_USERNAMES=[], PENDING=[], IN_REC=null;

/* ===== Signature pads ===== */
var PADS={};
function initPad(id){
  var cv=$(id); if(!cv) return;
  var r=cv.getBoundingClientRect();
  cv.width=r.width*2; cv.height=r.height*2;
  var ctx=cv.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  var draw=false, has=false;
  function pos(e){var rect=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return{x:t.clientX-rect.left,y:t.clientY-rect.top};}
  function down(e){draw=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!draw)return;var p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();has=true;PADS[id].has=true;e.preventDefault();}
  function up(){draw=false;}
  cv.onmousedown=down;cv.onmousemove=move;window.addEventListener('mouseup',up);
  cv.ontouchstart=down;cv.ontouchmove=move;cv.ontouchend=up;
  PADS[id]={cv:cv,ctx:ctx,has:false};
}
function clearSig(id){var p=PADS[id];if(p){p.ctx.clearRect(0,0,p.cv.width,p.cv.height);p.has=false;}}
function sigData(id){var p=PADS[id];return (p&&p.has)?p.cv.toDataURL('image/png'):'';}

/* ===== Load ===== */
async function loadStaff(){
  try{
    // only staff who can drive (flag) or whose title is Chauffeur
    var r=await fetch(SB_URL+'/rest/v1/gp_staff?select=name,username,can_drive,can_authorize,title&order=name.asc',{headers:sbH()});
    if(r.ok){
      var rows=await r.json();
      STAFF_ALL=rows.map(x=>x.name).filter(Boolean);
      STAFF=rows.filter(x=>x.can_drive===true || (x.title&&String(x.title).toLowerCase().indexOf('chauffeur')>=0)).map(x=>x.name).filter(Boolean);
      if(!STAFF.length) STAFF=STAFF_ALL.slice(); // fallback: show all if none flagged yet
      var ops=rows.filter(x=>x.can_authorize===true);
      STAFF_OPS=ops.map(x=>x.name).filter(Boolean);
      OPS_USERNAMES=ops.map(x=>x.username).filter(Boolean);
      if(!STAFF_OPS.length) STAFF_OPS=STAFF_ALL.slice(); // fallback if none flagged yet
    }
  }catch(e){}
  $('driverSel').innerHTML='<option value="">Select driver…</option>'+STAFF.map(n=>`<option>${esc(n)}</option>`).join('');
}
async function loadFleet(){
  try{var r=await fetch(SB_URL+'/rest/v1/gp_fleet?select=*&order=plate.asc',{headers:sbH()});if(r.ok)FLEET=await r.json();}catch(e){}
  $('carSel').innerHTML='<option value="">Select a car…</option>'+FLEET.map(c=>`<option value="${c.id}">${esc(c.plate)} — ${esc(c.model||'')}</option>`).join('');
}
async function loadPending(){
  $('pendingList').innerHTML='<div class="empty">Loading…</div>';
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_vehicle_use?status=eq.out&select=*&order=created_at.desc',{headers:sbH()});
    PENDING=r.ok?await r.json():[];
  }catch(e){ PENDING=[]; }
  if(!PENDING.length){ $('pendingList').innerHTML='<div class="empty">No cars currently signed out.</div>'; return; }
  $('pendingList').innerHTML=PENDING.map(p=>`
    <div class="pending">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <div class="pl">${esc(p.plate)} <span class="pill">OUT</span></div>
      </div>
      <div class="ms">${esc(p.model||'')} · ${esc(p.driver_name||'')}</div>
      <div class="ms">📋 ${esc(p.purpose||'—')}${p.destination?(' → '+esc(p.destination)):''}</div>
      <div class="ms">Out: ${esc(p.out_date||'')} ${esc(p.out_time||'')} · ${p.out_mileage?Number(p.out_mileage).toLocaleString()+' km':''}</div>
      <div class="act" style="margin-top:10px"><button class="btn gold sm full" onclick="openIn('${p.id}')">Sign In / Return</button></div>
    </div>`).join('');
}

function setTab(t){
  $('newView').style.display=t==='new'?'block':'none';
  $('opsView').style.display=t==='ops'?'block':'none';
  $('pendingView').style.display=t==='pending'?'block':'none';
  $('reportView').style.display=t==='report'?'block':'none';
  $('tabNew').classList.toggle('on',t==='new');
  $('tabOps').classList.toggle('on',t==='ops');
  $('tabPending').classList.toggle('on',t==='pending');
  $('tabReport').classList.toggle('on',t==='report');
  if(t==='ops') loadOps();
  if(t==='pending') loadPending();
  if(t==='report'){ setRange('week'); }
}

/* ===== Report ===== */
function setRange(which){
  $('rWeek').classList.toggle('on',which==='week');
  $('rMonth').classList.toggle('on',which==='month');
  var now=new Date(), from, to=new Date();
  if(which==='week'){ var day=(now.getDay()+6)%7; from=new Date(now); from.setDate(now.getDate()-day); }
  else { from=new Date(now.getFullYear(), now.getMonth(), 1); }
  $('rFrom').value=from.toISOString().slice(0,10);
  $('rTo').value=to.toISOString().slice(0,10);
  renderReport();
}
async function renderReport(){
  var from=$('rFrom').value, to=$('rTo').value;
  if(!from||!to) return;
  $('reportBody').innerHTML='<div class="empty">Loading…</div>';
  try{
    var url=SB_URL+'/rest/v1/gp_vehicle_use?select=*&out_date=gte.'+from+'&out_date=lte.'+to+'&order=out_date.asc';
    var r=await fetch(url,{headers:sbH()});
    var rows=r.ok?await r.json():[];
    if(!rows.length){ $('reportBody').innerHTML='<div class="empty">No vehicle use in this period.</div>'; return; }
    var trips=rows.length, totalKm=0, byDriver={};
    rows.forEach(x=>{
      var dist=(x.in_mileage&&x.out_mileage)?(x.in_mileage-x.out_mileage):0;
      if(dist>0) totalKm+=dist;
      var d=x.driver_name||'—'; byDriver[d]=(byDriver[d]||0)+1;
    });
    var topDrivers=Object.keys(byDriver).sort((a,b)=>byDriver[b]-byDriver[a]);

    // ---- summary cards ----
    var html='<div class="rep-sum" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px">'+
      '<div class="panel" style="text-align:center;margin:0"><div style="font-family:Georgia,serif;font-size:24px;color:var(--gold-soft)">'+trips+'</div><div class="muted">Trips</div></div>'+
      '<div class="panel" style="text-align:center;margin:0"><div style="font-family:Georgia,serif;font-size:24px;color:var(--gold-soft)">'+totalKm.toLocaleString()+'</div><div class="muted">Total km</div></div>'+
      '<div class="panel" style="text-align:center;margin:0"><div style="font-family:Georgia,serif;font-size:24px;color:var(--gold-soft)">'+topDrivers.length+'</div><div class="muted">Drivers</div></div></div>';

    // ---- report header line ----
    html+='<div class="rep-head"><b>GRANDPRIDE — VEHICLE USE LOG</b><br><span class="muted">'+esc(from)+' to '+esc(to)+'</span></div>';

    // ---- logbook table (matches paper book) ----
    function sig(d){ return d ? '<img src="'+d+'" class="sigimg">' : ''; }
    html+='<div class="rep-scroll"><table class="logtbl"><thead><tr>'+
      '<th>Name</th><th>Car No</th><th>Car Model</th><th>Km Out</th><th>Date Out</th><th>Time Out</th><th>Fuel Out</th><th>Driver Sign</th><th>PIC Sign</th>'+
      '<th>Date In</th><th>Time In</th><th>Km In</th><th>Fuel In</th><th>Driver Sign</th><th>PIC Sign</th><th>Remark</th>'+
      '</tr></thead><tbody>'+
      rows.map(x=>{
        return '<tr>'+
          '<td>'+esc(x.driver_name||'')+'</td>'+
          '<td>'+esc(x.plate||'')+'</td>'+
          '<td>'+esc(x.model||'')+'</td>'+
          '<td>'+(x.out_mileage?Number(x.out_mileage).toLocaleString():'')+'</td>'+
          '<td>'+esc(x.out_date||'')+'</td>'+
          '<td>'+esc(x.out_time||'')+'</td>'+
          '<td>'+(x.out_petrol!=null&&x.out_petrol!==''?esc(x.out_petrol)+'/8':'')+'</td>'+
          '<td>'+sig(x.out_sign_driver)+'</td>'+
          '<td>'+sig(x.out_sign_ops)+'</td>'+
          '<td>'+esc(x.in_date||'')+'</td>'+
          '<td>'+esc(x.in_time||'')+'</td>'+
          '<td>'+(x.in_mileage?Number(x.in_mileage).toLocaleString():'')+'</td>'+
          '<td>'+(x.in_petrol!=null&&x.in_petrol!==''?esc(x.in_petrol)+'/8':'')+'</td>'+
          '<td>'+sig(x.in_sign_driver)+'</td>'+
          '<td>'+sig(x.in_sign_ops)+'</td>'+
          '<td class="rmk">'+esc(((x.purpose||'')+(x.destination?(' → '+x.destination):'')+(x.remark?(' · '+x.remark):'')).trim())+'</td>'+
        '</tr>';
      }).join('')+
      '</tbody></table></div>';

    // ---- by-driver summary ----
    html+='<div class="panel" style="margin-top:14px"><h3 style="font-size:14px">By driver</h3>'+topDrivers.map(d=>'<div class="ms">'+esc(d)+' — <b>'+byDriver[d]+' trip'+(byDriver[d]>1?'s':'')+'</b></div>').join('')+'</div>';

    $('reportBody').innerHTML=html;
  }catch(e){ $('reportBody').innerHTML='<div class="empty">Could not load report.</div>'; }
}

/* ===== push to GP Operation (reuses Hub push function) ===== */
var PUSH_FN_URL='https://iefevjkeckysdluzazeq.supabase.co/functions/v1/push-send';
// Google Apps Script Web App URL for the Vehicle Use Log sheet (set after you deploy it)
var USE_SHEET_URL='https://script.google.com/macros/s/AKfycbxqLh1rKK9i00UozzRvUnFIQYZbv-IARiEcqyUrKsWeyQkXhHLQ7zOisxPfpPibGCw/exec';
function sheetPush(rec){
  try{
    if(!USE_SHEET_URL || USE_SHEET_URL.indexOf('http')!==0) return; // not configured yet
    fetch(USE_SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(rec)}).catch(function(){});
  }catch(e){}
}
function pushNotify(title,body,target){
  try{
    fetch(PUSH_FN_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY},
      body:JSON.stringify({title:title,body:body,target:target||'all'})}).catch(function(){});
  }catch(e){}
}

/* ===== SIGN OUT (driver only -> awaiting ops) ===== */
async function signOut(){
  var carId=$('carSel').value;
  var driver=$('driverSel').value;
  var car=FLEET.find(c=>c.id===carId);
  if(!car){ toast('Select a car'); return; }
  if(!driver){ toast('Select a driver'); return; }
  var purpose=($('purpose').value||'').trim();
  if(!purpose){ toast('Enter the purpose'); return; }
  var sigD=sigData('sigODrv');
  if(!sigD){ toast('Driver signature required'); return; }
  var oMile=parseInt($('oMile').value||'0',10)||0;
  var now=new Date().toISOString();
  var row={
    fleet_id:car.id, plate:car.plate, model:car.model, driver_name:driver,
    purpose:purpose, destination:($('dest').value||'').trim(),
    status:'out', ops_status:'awaiting_ops',
    out_date:$('oDate').value||todayISO(), out_time:$('oTime').value||nowTime(),
    out_mileage:oMile, out_petrol:parseInt($('oPet').value||'0',10)||0,
    out_sign_driver:sigD, out_sign_ops:'', created_by:driver, created_at:now, updated_at:now
  };
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_vehicle_use',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(row)});
    if(!r.ok){ toast('Save failed'); return; }
    // notify the GP Operation people who can authorize (fallback to all if none set)
    var title='🚗 Car release needs your sign-off';
    var body=driver+' wants '+car.plate+' for: '+purpose+'. Open Vehicle Use Log → Ops Sign.';
    if(OPS_USERNAMES.length) OPS_USERNAMES.forEach(function(u){ pushNotify(title, body, u); });
    else pushNotify(title, body, 'all');
    toast('Sent ✓ — waiting for GP Operation to authorize');
    resetNew();
    loadOps();
  }catch(e){ toast('Offline — not saved'); }
}
function resetNew(){
  ['purpose','dest','oMile','oPet'].forEach(id=>$(id).value='');
  $('carSel').value=''; $('driverSel').value='';
  $('oDate').value=todayISO(); $('oTime').value=nowTime();
  clearSig('sigODrv');
}

/* ===== OPS SIGN (separate approval) ===== */
var OPS_PENDING=[], OPS_REC=null;
async function loadOps(){
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_vehicle_use?ops_status=eq.awaiting_ops&select=*&order=created_at.desc',{headers:sbH()});
    OPS_PENDING=r.ok?await r.json():[];
  }catch(e){ OPS_PENDING=[]; }
  // badge
  var b=$('opsBadge');
  if(OPS_PENDING.length){ b.textContent=OPS_PENDING.length; b.style.display='inline-block'; }
  else b.style.display='none';
  // list (only render if on ops tab)
  var ol=$('opsList');
  if(ol){
    if(!OPS_PENDING.length){ ol.innerHTML='<div class="empty">Nothing waiting for GP Operation signature.</div>'; }
    else ol.innerHTML=OPS_PENDING.map(p=>`
      <div class="pending">
        <div class="pl">${esc(p.plate)} <span class="pill" style="background:var(--amber)">AWAITING OPS</span></div>
        <div class="ms">${esc(p.model||'')} · ${esc(p.driver_name||'')}</div>
        <div class="ms">📋 ${esc(p.purpose||'—')}${p.destination?(' → '+esc(p.destination)):''}</div>
        <div class="ms">Out: ${esc(p.out_date||'')} ${esc(p.out_time||'')} · ${p.out_mileage?Number(p.out_mileage).toLocaleString()+' km':''}</div>
        <div class="act" style="margin-top:10px"><button class="btn gold sm full" onclick="openOps('${p.id}')">Review & sign</button></div>
      </div>`).join('');
  }
}
function openOps(id){
  OPS_REC=OPS_PENDING.find(p=>p.id===id); if(!OPS_REC) return;
  $('opsTitle').textContent='Authorize — '+OPS_REC.plate;
  $('opsSub').textContent='Review the trip, then sign to release the car.';
  $('opsDetail').innerHTML=
    '<div class="ms"><b>Driver:</b> '+esc(OPS_REC.driver_name||'')+'</div>'+
    '<div class="ms"><b>Purpose:</b> '+esc(OPS_REC.purpose||'—')+'</div>'+
    (OPS_REC.destination?'<div class="ms"><b>Destination:</b> '+esc(OPS_REC.destination)+'</div>':'')+
    '<div class="ms"><b>Out:</b> '+esc(OPS_REC.out_date||'')+' '+esc(OPS_REC.out_time||'')+'</div>'+
    '<div class="ms"><b>Mileage:</b> '+(OPS_REC.out_mileage?Number(OPS_REC.out_mileage).toLocaleString()+' km':'—')+'</div>'+
    (OPS_REC.out_sign_driver?'<div class="ms" style="margin-top:6px"><b>Driver signed:</b></div><img src="'+OPS_REC.out_sign_driver+'" style="height:60px;background:#fff;border-radius:6px;margin-top:4px">':'');
  $('opsBy').innerHTML='<option value="">Select staff…</option>'+STAFF_OPS.map(n=>`<option>${esc(n)}</option>`).join('');
  $('opsPanel').style.display='block';
  setTimeout(()=>initPad('sigOpsApprove'),40);
}
function closeOps(){ $('opsPanel').style.display='none'; OPS_REC=null; }
async function opsSign(){
  if(!OPS_REC) return;
  var sig=sigData('sigOpsApprove');
  var by=$('opsBy').value;
  if(!sig){ toast('GP Operation signature required'); return; }
  if(!by){ toast('Select who is signing'); return; }
  var now=new Date().toISOString();
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_vehicle_use?id=eq.'+OPS_REC.id,
      {method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({out_sign_ops:sig, ops_status:'signed', updated_at:now})});
    if(!r.ok){ toast('Save failed'); return; }
    // now flip the car to company/internal status
    var car=FLEET.find(c=>c.id===OPS_REC.fleet_id);
    if(car){
      var patch={status:'internal', remark:'Driver: '+OPS_REC.driver_name+(OPS_REC.purpose?(' — '+OPS_REC.purpose):''), driver_sign:OPS_REC.out_sign_driver||'', changed_by:by, changed_at:now};
      var om=OPS_REC.out_mileage||0;
      if(om && om>=(car.current_mileage||0)){ patch.current_mileage=om; patch.mileage_updated=now; }
      await fetch(SB_URL+'/rest/v1/gp_fleet?id=eq.'+car.id,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(patch)});
      await fetch(SB_URL+'/rest/v1/gp_fleet_log',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),
        body:JSON.stringify({fleet_id:car.id,plate:car.plate,model:car.model,status:'internal',remark:'Company use — '+OPS_REC.driver_name+' (ops: '+by+')',changed_by:by,changed_at:now})});
    }
    // push back to the driver
    pushNotify('✅ Car released — '+OPS_REC.plate, 'GP Operation authorized. You can take the car.', OPS_REC.driver_name);
    // send to Google Sheet (out record)
    sheetPush(Object.assign({}, OPS_REC, {out_sign_ops:sig, ops_by:by, event:'OUT'}));
    toast('Authorized ✓ — car released');
    closeOps(); loadOps(); loadFleet();
  }catch(e){ toast('Offline — not saved'); }
}

/* ===== SIGN IN ===== */
function openIn(id){
  IN_REC=PENDING.find(p=>p.id===id); if(!IN_REC) return;
  $('inTitle').textContent='Sign In — '+IN_REC.plate;
  $('inSub').textContent=(IN_REC.model||'')+' · '+(IN_REC.driver_name||'')+' · out at '+(IN_REC.out_mileage?Number(IN_REC.out_mileage).toLocaleString()+' km':'—');
  $('iDate').value=todayISO(); $('iTime').value=nowTime();
  $('iMile').value=''; $('iPet').value=''; $('iRem').value='';
  $('distNote').textContent='';
  $('inPanel').style.display='block';
  setTimeout(()=>{ initPad('sigIDrv'); initPad('sigIOps'); },40);
}
function calcDist(){
  var im=parseInt($('iMile').value||'0',10)||0;
  var om=IN_REC?(IN_REC.out_mileage||0):0;
  if(im && om && im>=om) $('distNote').textContent='Distance used: '+(im-om).toLocaleString()+' km';
  else $('distNote').textContent='';
}
function closeIn(){ $('inPanel').style.display='none'; IN_REC=null; }
async function signIn(){
  if(!IN_REC) return;
  var sigD=sigData('sigIDrv'), sigO=sigData('sigIOps');
  if(!sigD){ toast('Driver signature required'); return; }
  if(!sigO){ toast('GP Operation signature required'); return; }
  var iMile=parseInt($('iMile').value||'0',10)||0;
  var now=new Date().toISOString();
  var patch={
    status:'returned',
    in_date:$('iDate').value||todayISO(), in_time:$('iTime').value||nowTime(),
    in_mileage:iMile, in_petrol:parseInt($('iPet').value||'0',10)||0,
    in_sign_driver:sigD, in_sign_ops:sigO, remark:($('iRem').value||'').trim(), updated_at:now
  };
  try{
    var r=await fetch(SB_URL+'/rest/v1/gp_vehicle_use?id=eq.'+IN_REC.id,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(patch)});
    if(!r.ok){ toast('Save failed'); return; }
    // offer to set car back to Ready at GP
    var car=FLEET.find(c=>c.id===IN_REC.fleet_id);
    if(car && confirm('Set '+IN_REC.plate+' back to “Ready at GP”?')){
      var fp={status:'ready', remark:'', driver_sign:'', changed_by:IN_REC.driver_name||'ops', changed_at:now};
      if(iMile && iMile>=(car.current_mileage||0)){ fp.current_mileage=iMile; fp.mileage_updated=now; }
      await fetch(SB_URL+'/rest/v1/gp_fleet?id=eq.'+car.id,{method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify(fp)});
      await fetch(SB_URL+'/rest/v1/gp_fleet_log',{method:'POST',headers:sbH({'Prefer':'return=minimal'}),
        body:JSON.stringify({fleet_id:car.id,plate:car.plate,model:car.model,status:'ready',remark:'Returned from company use',changed_by:IN_REC.driver_name||'ops',changed_at:now})});
    }
    toast('Signed in ✓ — return complete');
    sheetPush(Object.assign({}, IN_REC, patch, {event:'IN', distance: (iMile&&IN_REC.out_mileage)?(iMile-IN_REC.out_mileage):''}));
    closeIn(); loadPending(); loadFleet();
  }catch(e){ toast('Offline — not saved'); }
}

/* ===== init ===== */
(async function(){
  $('oDate').value=todayISO(); $('oTime').value=nowTime();
  await loadStaff(); await loadFleet(); await loadOps();
  bindUpper();
  setTimeout(()=>{ initPad('sigODrv'); },60);
})();
</script>
