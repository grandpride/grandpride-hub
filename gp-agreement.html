<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Agreement</title>
<style>
:root{
  --ink:#141210; --panel:#1b1815; --panel2:#221e1a; --line:#2c2722;
  --gold:#c9a24b; --gold-soft:#d8bd78; --grey:#9a8f7e; --text:#f5f0e6;
  --red:#e05a54; --green:#3fae6b; --blue:#4a78c0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:16px;padding-bottom:80px}

/* ---- top bar ---- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 4px;position:sticky;top:0;background:var(--ink);z-index:30;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.3px}
.topbar .sub{font-size:11px;color:var(--gold-soft)}
.back-btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px 12px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.spacer{flex:1}

/* ---- buttons ---- */
.btn{background:linear-gradient(135deg,var(--gold),#8a5f1e);border:none;color:#1a1408;border-radius:10px;padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--panel2);border:1px solid var(--red);color:var(--red)}
.btn.ok{background:linear-gradient(135deg,var(--green),#247a47);color:#fff}
.btn.full{width:100%}
.mini{padding:7px 11px;font-size:12.5px;border-radius:8px}

/* ---- chooser cards ---- */
.chooser{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.type-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;cursor:pointer;transition:.15s;position:relative}
.type-card:hover{border-color:var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.type-card .ico{font-size:30px;margin-bottom:10px}
.type-card h3{font-size:16px;margin-bottom:5px}
.type-card p{font-size:12.5px;color:var(--grey);line-height:1.5}
.type-card.soon{opacity:.55}
.type-card.soon::after{content:'Coming soon';position:absolute;top:14px;right:14px;font-size:10px;color:var(--gold-soft);border:1px dashed var(--gold);padding:3px 8px;border-radius:20px}

/* ---- form ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.panel h3{font-size:14px;color:var(--gold-soft);margin-bottom:12px;letter-spacing:.4px;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--grey);margin:10px 0 4px;font-weight:600}
input,textarea,select{width:100%;background:#13110e;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none}
input[type="date"]{-webkit-appearance:none;appearance:none;min-height:44px;color-scheme:dark;position:relative}
input[type="date"]::-webkit-calendar-picker-indicator{filter:invert(0.8);opacity:1;cursor:pointer;font-size:18px;padding:0 2px}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hint{font-size:11px;color:var(--grey);margin-top:3px}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr}}

/* ---- payment phases ---- */
.phase-row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;align-items:end;margin-bottom:8px}
.phase-row .x{background:var(--panel2);border:1px solid var(--red);color:var(--red);border-radius:8px;padding:9px 11px;cursor:pointer;font-size:13px}
@media(max-width:640px){.phase-row{grid-template-columns:1fr 1fr;}.phase-row .x{grid-column:1/-1}}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--text);padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90%}
#toast.show{opacity:1}

/* ---- list ---- */
.rec{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rec:last-child{border-bottom:none}
.rec .meta b{font-size:14px}
.rec .meta small{color:var(--grey);font-size:12px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.draft{background:#3a332300;border:1px solid var(--grey);color:var(--grey)}
.pill.lessor{background:#2a3550;border:1px solid var(--blue);color:#9cc0ff}
.pill.done{background:#1f3a28;border:1px solid var(--green);color:#7be0a0}

/* ---- signature pad ---- */
.sigwrap{margin-top:8px}
.sigpad{width:100%;height:150px;background:#fff;border:2px solid var(--line);border-radius:10px;touch-action:none;display:block}
.sigpad.initial{height:90px}
.sig-actions{display:flex;gap:8px;margin-top:6px}

/* =========================================================
   PRINTABLE AGREEMENT  (A4 pages)
   ========================================================= */
#doc{display:none}
.doc-page{
  width:210mm;min-height:297mm;background:#fff;color:#000;margin:0 auto 16px;
  padding:20mm 18mm 24mm;position:relative;font-family:'Times New Roman',Georgia,serif;
  font-size:11.2pt;line-height:1.5;box-shadow:0 4px 20px rgba(0,0,0,.4);box-sizing:border-box;overflow:hidden
}
.doc-page *{color:#000}
.doc h1.title{font-size:12pt;text-align:center;font-weight:bold;text-decoration:underline;margin-bottom:14pt;letter-spacing:.3px}
.doc p{margin:7pt 0;text-align:justify}
.doc p.head{margin:13pt 0 6pt;font-weight:bold}
.doc ol.num{margin:5pt 0;padding-left:22pt;list-style:decimal}
.doc ol.alpha{margin:5pt 0;padding-left:22pt;list-style:lower-alpha}
.doc ol li{margin:6pt 0;text-align:justify;padding-left:4pt}
.doc .rng{color:#000}
.doc table.vt{width:100%;border-collapse:collapse;margin:8pt 0}
.doc table.vt td{border:1px solid #000;padding:5pt 8pt;vertical-align:top;font-size:10.8pt}
.doc table.vt td.k{width:42%;font-weight:bold;background:#f4f4f4}
.doc table.vt td.c{width:4%;text-align:center}
.fill{font-weight:bold}
.doc .sigrow{display:flex;justify-content:space-between;gap:20pt;margin-top:18pt}
.doc .sigcol{width:46%}
.doc .sigcol p{margin:4pt 0;text-align:left}
.doc .sigline{border-bottom:1px solid #000;width:60mm;height:46px;display:flex;align-items:flex-end;margin:6pt 0}
.doc .sigline img{max-height:44px;max-width:58mm}
.doc .witness{margin-top:8pt;font-size:10.5pt}
/* page initials bottom-right */
.pg-initials{position:absolute;right:14mm;bottom:9mm;display:flex;flex-direction:column;gap:1.5mm;align-items:flex-end}
.pg-initials .slot{width:28mm;text-align:center;font-size:6.5pt;color:#444}
.pg-initials .slot .sig{height:7mm;display:flex;align-items:flex-end;justify-content:center}
.pg-initials .slot .sig img{max-height:7mm;max-width:26mm;display:block}
.pg-initials .slot .lbl{border-top:1px solid #000;padding-top:0.5mm;margin-top:0.5mm}
.pg-num{position:absolute;left:0;right:0;bottom:6mm;text-align:center;font-size:8pt;color:#666}

@media print{
  html,body{background:#fff;margin:0;padding:0;width:210mm}
  .wrap{display:none !important}
  #doc{display:block !important}
  .doc-page{
    width:210mm;height:297mm;min-height:auto;box-shadow:none;margin:0;
    padding:18mm 18mm 22mm;overflow:hidden;page-break-after:always;break-after:page
  }
  .doc-page:last-child{page-break-after:auto;break-after:auto}
  .pg-initials{bottom:8mm}
  .pg-num{bottom:5mm}
  @page{size:A4 portrait;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back-btn" href="index.html">‹ Hub</a>
    <div>
      <h1>GP Agreement</h1>
      <div class="sub" id="sub">Choose agreement type</div>
    </div>
    <div class="spacer"></div>
    <button class="btn sec mini" id="listBtn" style="display:none" onclick="showList()">Saved</button>
  </div>

  <div id="view"></div>
</div>

<!-- printable doc renders here -->
<div id="doc"></div>

<div id="toast"></div>

<script src="supa.js"></script>
<script>
/* ============================================================
   GP AGREEMENT — Phase 1
   Reuses the Hub's supa.js (same Supabase project).
   Table: gp_agreements
   ============================================================ */

/* ---- Supabase REST (reuse Hub credentials from supa.js) ---- */
var SB_URL = (typeof SUPABASE_URL!=='undefined' && SUPABASE_URL) || '';
var SB_KEY = (typeof SUPABASE_ANON_KEY!=='undefined' && SUPABASE_ANON_KEY) ||
             (typeof SUPABASE_KEY!=='undefined' && SUPABASE_KEY) ||
             (typeof SUPABASE_ANON!=='undefined' && SUPABASE_ANON) || '';
function sbBase(){ return (SB_URL||'').replace(/\/rest\/v1\/?$/,''); }
function sbHeaders(extra){ return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, extra||{}); }
var CLOUD = !!(SB_URL && SB_KEY);

/* Apps Script web app — fills the Google Doc template, exports PDF to Drive, logs to Sheet */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwBuZ0AKRp5mIO1ZxKTDNLXWbTFp9TbXWIVFnMyHkHLhDHPd1Ecv7pirBXIGCHjHWg/exec';

async function sbUpsert(row){
  if(!CLOUD) return false;
  const r = await fetch(sbBase()+'/rest/v1/gp_agreements?on_conflict=id', {
    method:'POST', headers:sbHeaders({'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify(row)
  });
  return r.ok;
}
async function sbList(){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+'/rest/v1/gp_agreements?select=*&order=created_at.desc', {headers:sbHeaders()});
  if(!r.ok) return [];
  return await r.json();
}
async function sbGet(id){
  if(!CLOUD) return null;
  const r = await fetch(sbBase()+'/rest/v1/gp_agreements?id=eq.'+encodeURIComponent(id)+'&select=*', {headers:sbHeaders()});
  if(!r.ok) return null;
  const rows = await r.json();
  return rows[0]||null;
}
async function sbDelete(id){
  if(!CLOUD) return false;
  const r = await fetch(sbBase()+'/rest/v1/gp_agreements?id=eq.'+encodeURIComponent(id), {method:'DELETE', headers:sbHeaders({'Prefer':'return=minimal'})});
  return r.ok;
}

/* ===== LOAD FROM BOOKING ===== */
async function sbLeasingBookings(){
  if(!CLOUD) return [];
  const r = await fetch(sbBase()+"/rest/v1/gp_bookings?service=eq.leasing&select=*&order=created_at.desc", {headers:sbHeaders()});
  if(!r.ok) return [];
  return await r.json();
}
async function openBookingPicker(){
  toast('Loading bookings…');
  const rows = await sbLeasingBookings();
  const ov = document.createElement('div');
  ov.id='bookingPicker';
  ov.style.cssText='position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.85);display:flex;flex-direction:column;padding:18px;overflow:auto';
  let inner = `<div style="max-width:560px;margin:0 auto;width:100%">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="color:#d8bd78;font-weight:800;font-size:16px">Pick a leasing booking</div>
      <button class="btn sec mini" onclick="closeBookingPicker()">Close</button>
    </div>`;
  if(!rows.length){
    inner += `<p style="color:#9a8f7e">No leasing bookings found.</p>`;
  } else {
    inner += rows.map(r=>{
      const d=r.data||{};
      return `<div onclick='fillFromBooking(${JSON.stringify(JSON.stringify(r)).replace(/'/g,"&#39;")})' style="background:#15120c;border:1px solid #2a2419;border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer">
        <div style="color:#f5f0e6;font-weight:700">${esc(r.customer_name||'(no name)')} ${r.car_plate?('· '+esc(r.car_plate)):''}</div>
        <div style="color:#9a8f7e;font-size:12px;margin-top:2px">${esc(r.car_model||'')} ${d.start?('· '+esc((d.start||'').slice(0,10))):''} ${d.grand_total?('· RM'+d.grand_total):''}</div>
      </div>`;
    }).join('');
  }
  inner += `</div>`;
  ov.innerHTML = inner;
  document.body.appendChild(ov);
}
function closeBookingPicker(){ const o=$('bookingPicker'); if(o) o.remove(); }

function fillFromBooking(rowJson){
  let r; try{ r = JSON.parse(rowJson); }catch(e){ toast('Could not read booking'); return; }
  const d = r.data || {};
  const a = STATE.current;
  // map booking -> agreement fields
  a.lessee_name   = (d.customer_name||'').toUpperCase();
  a.v_make_model  = (d.car_model||'').toUpperCase();
  a.v_reg         = (d.car_plate||'').toUpperCase();
  a.petrol_type   = d.fuel_type || a.petrol_type;
  a.lease_from    = (d.start||'').slice(0,10);
  a.lease_to      = (d.end||'').slice(0,10);
  a.leasing_price = d.rate!=null ? String(d.rate) : a.leasing_price;
  if(d.insured_pct){ a.insurance_insured = String(d.insured_pct); }
  // carry extras for the checklist later (stored on the agreement record)
  a.from_booking_id = r.id;
  a.contact         = d.contact || '';
  a.deposit         = d.deposit!=null ? String(d.deposit) : '';
  a.mileage_given   = d.mileage_given || '';
  a.per_km          = d.per_km || '';
  a.grand_total     = d.grand_total!=null ? String(d.grand_total) : '';
  closeBookingPicker();
  showLeaseForm(); // re-render with filled values
  toast('Loaded from booking ✓');
}

/* ---- helpers ---- */
function $(id){ return document.getElementById(id); }
function nricFmt(el){
  let v=el.value.replace(/[^0-9]/g,'').slice(0,12);
  let out=v;
  if(v.length>6) out=v.slice(0,6)+'-'+v.slice(6,8)+(v.length>8?'-'+v.slice(8):'');
  el.value=out;
}
function upper(el){ el.value = el.value.toUpperCase(); }

/* Customer vs Corporate lessee. Corporate re-labels the NRIC field to
   "Company Registration Number" and drops the NRIC number formatting. */
function setLesseeType(t){
  if(STATE.current) STATE.current.lessee_type = t;
  var nameLbl=document.getElementById('lbl_lessee_name');
  var nricLbl=document.getElementById('lbl_lessee_nric');
  var nameIn=document.getElementById('f_lessee_name');
  var nricIn=document.getElementById('f_lessee_nric');
  var cust=document.getElementById('lesseeTypeCust');
  var corp=document.getElementById('lesseeTypeCorp');
  var isCorp = (t==='corporate');
  if(nameLbl) nameLbl.textContent = isCorp ? 'Company Name (UPPERCASE)' : 'Lessee name (UPPERCASE)';
  if(nricLbl) nricLbl.textContent = isCorp ? 'Company Registration Number' : 'NRIC / Passport No.';
  if(nameIn) nameIn.placeholder = isCorp ? 'GRANDPRIDE LUXURY TRAVEL SDN BHD' : 'DICKSON CHEN DI SHAN';
  if(nricIn){
    nricIn.placeholder = isCorp ? '201801035116 (1234567-A)' : '970515-23-5237';
    // corporate reg numbers aren't NRIC-formatted; swap the input handler
    if(isCorp){ nricIn.setAttribute('oninput','upper(this)'); nricIn.removeAttribute('inputmode'); }
    else { nricIn.setAttribute('oninput','nricFmt(this)'); nricIn.setAttribute('inputmode','numeric'); }
  }
  // highlight the active button
  if(cust) cust.className = isCorp ? 'btn sec' : 'btn';
  if(corp) corp.className = isCorp ? 'btn' : 'btn sec';
}
var AGR_FLEET=[];
async function loadAgrFleet(){
  var sel=document.getElementById('f_v_car'); if(!sel) return;
  try{ const r=await fetch(sbBase()+'/rest/v1/gp_fleet?select=id,plate,model&order=plate.asc',{headers:sbHeaders()});
    if(r.ok) AGR_FLEET=await r.json(); }catch(e){}
  var cur=(STATE.current&&STATE.current.v_reg)||'';
  if(!AGR_FLEET.length){ sel.innerHTML='<option value="">No cars in fleet — add in GP Vehicle Fleet first</option>'; return; }
  sel.innerHTML='<option value="">Select car…</option>'+AGR_FLEET.map(c=>
    `<option value="${c.id}" data-plate="${(c.plate||'')}" data-model="${(c.model||'').replace(/"/g,'&quot;')}" ${cur&&c.plate===cur?'selected':''}>${(c.plate||'')} — ${(c.model||'')}</option>`
  ).join('');
}
function onAgrCarPick(){
  var sel=document.getElementById('f_v_car'); if(!sel) return;
  var opt=sel.options[sel.selectedIndex];
  var plate=opt?opt.getAttribute('data-plate'):'';
  var model=opt?opt.getAttribute('data-model'):'';
  if(document.getElementById('f_v_make_model')) document.getElementById('f_v_make_model').value=(model||'').toUpperCase();
  if(document.getElementById('f_v_reg')) document.getElementById('f_v_reg').value=(plate||'').toUpperCase();
  if(STATE.current){ STATE.current.v_make_model=(model||'').toUpperCase(); STATE.current.v_reg=(plate||'').toUpperCase(); }
}
function money(el){
  let v = el.value.replace(/[^0-9.]/g,'');
  const firstDot = v.indexOf('.');
  if(firstDot!==-1){ v = v.slice(0,firstDot+1) + v.slice(firstDot+1).replace(/\./g,''); }
  el.value = v; // keep raw while typing
}
function moneyBlur(el){
  let v = el.value.replace(/[^0-9.]/g,'');
  if(v==='') { el.value=''; return; }
  let [intp, decp=''] = v.split('.');
  intp = intp.replace(/^0+(?=\d)/,'');
  intp = (intp||'0').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  decp = (decp+'00').slice(0,2);
  el.value = intp + '.' + decp;
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2600); }
function uid(){ return 'ag'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function todayISO(){ return new Date().toISOString(); }
function curUser(){ try{ return new URLSearchParams(location.search).get('u')||'staff'; }catch(e){ return 'staff'; } }
function ord(n){ const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function fmtDate(d){ if(!d) return ''; try{ const x=new Date(d+'T00:00:00'); const mon=['January','February','March','April','May','June','July','August','September','October','November','December'][x.getMonth()]; return ord(x.getDate())+' '+mon+' '+x.getFullYear(); }catch(e){ return d; } }

/* ---- app state ---- */
var STATE = { view:'chooser', current:null };

function setSub(t){ $('sub').textContent=t; }

/* ---- router ---- */
function showChooser(){
  STATE.view='chooser'; setSub('Choose agreement type'); $('listBtn').style.display='';
  $('doc').style.display='none';
  $('view').innerHTML = `
    <div class="chooser">
      <div class="type-card soon" onclick="toast('Lease to Own — temporarily hidden')">
        <div class="ico">📄</div><h3>Lease to Own</h3>
        <p>Vehicle lease where ownership transfers after full payment term.</p>
      </div>
      <div class="type-card" onclick="startNew('lease')">
        <div class="ico">🚗</div><h3>Car Leasing</h3>
        <p>Standard vehicle leasing agreement.</p>
      </div>
      <div class="type-card soon" onclick="toast('Subscription — coming soon')">
        <div class="ico">🔁</div><h3>Subscription</h3>
        <p>Recurring subscription-based vehicle plan.</p>
      </div>
    </div>
    <div style="margin-top:14px"><div class="hint" style="margin-bottom:6px">Test fill:</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sec mini" onclick="fillSample('lease')">Car Leasing</button>
      </div></div>`;
}


function fillSample(type){ if(type==='lease'){ fillLeaseSample(); return; } if(type&&type!=='lto'){ toast('Only these are ready'); return; }
  STATE.current = Object.assign(blankLTO(), {
    agreement_date:'2024-07-02',
    lessee_name:'ONG YUNG TIAM', lessee_nric:'840604-14-5799',
    lessee_address:'NO 4 JALAN PANDAN INDAH 12 TAMAN PANDAN INDAH 55100 KUALA LUMPUR W. PERSEKUTUAN (KL)',
    v_make_model:'TOYOTA / ALPHARD DBA-AGH30W', v_year:'MOTOKAR / 2019',
    v_reg:'PPM131', v_engine:'2AR2231837', v_chassis:'AGH30-0268877',
    v_equip:'N/A', v_odo:'N/A',
    commence_date:'2024-08-03', duration_months:'48',
    vehicle_price:'302,000.02', upfront_sum:'35,000.00',
    late_charge:'8', safety_fee_yearly:'600.00',
    total_downpayment:'35,000.00', safety_fee_amount:'1,000.00',
    appendix_from:'2024-08-03', appendix_to:'2028-08-02',
    phases:[
      {label:'1-6/48 (6 months)', amount:'10,341.67', range:'3rd Sep 2024 - 2nd Mar 2025'},
      {label:'7-8/48 (2 months)', amount:'9,625.00', range:'3rd Mar 2025 - 2nd May 2025'},
      {label:'9-23/48 (15 months)', amount:'6,000.00', range:'3rd May 2025 - 2nd Aug 2026'},
      {label:'24-48/48 (25 months)', amount:'4,000.00', range:'3rd Aug 2026 - 2nd Sep 2028'}
    ]
  });
  showForm();
  toast('Sample data filled');
}

function startNew(type){
  if(type==='lease'){ STATE.current = blankLEASE(); showLeaseForm(); return; }
  if(type==='lto'){ STATE.current = blankLTO(); showForm(); return; }
}
function blankLTO(){
  return {
    id: uid(), type:'lto', status:'draft', created_at: todayISO(), created_by: curUser(),

function phaseRow(p,i){
  return `<div class="phase-row" data-i="${i}">

    <div><label>Date range</label><input class="p_range" value="${esc(p.range)}" placeholder="3rd Sep 2024 \u2013 2nd Mar 2025"></div>
    <button class="x" onclick="delPhase(${i})">\u2715</button>
  </div>`;
}
function readPhases(){
  return [...document.querySelectorAll('#phases .phase-row')].map(r=>({
    label:r.querySelector('.p_label').value, amount:r.querySelector('.p_amount').value, range:r.querySelector('.p_range').value
  }));
}
function addPhase(){ STATE.current.phases=readPhases(); STATE.current.phases.push({label:'',amount:'',range:''}); refreshPhases(); }
function delPhase(i){ STATE.current.phases=readPhases(); STATE.current.phases.splice(i,1); if(!STATE.current.phases.length) STATE.current.phases.push({label:'',amount:'',range:''}); refreshPhases(); }
function refreshPhases(){ $('phases').innerHTML = STATE.current.phases.map((p,i)=>phaseRow(p,i)).join(''); }

function renderDoc(a){ $('doc').innerHTML = (a.type==='lease') ? buildLeaseDoc(a) : buildDoc(a); }

function previewDoc(){
  if($('f_lessee_name')){ if(STATE.current.type==='lease') readLeaseForm(); else readForm(); }   // only pull from the form when it's actually on screen
  const a=STATE.current;
  if(!a.lessee_name){ toast('Enter lessee name first'); return; }
  STATE.view='preview'; setSub('Preview \u2014 '+(a.lessee_name||''));
  renderDoc(a);                 // still build it (hidden) so "Print (browser)" backup works
  $('doc').style.display='none'; // don't show the rough HTML draft on screen
  const lessorDone=!!a.sig_lessor, lesseeDone=!!a.sig_lessee, both=lessorDone&&lesseeDone;
  $('view').innerHTML = `
    <div class="panel">
      <h3>Sign &amp; Finalise</h3>
      <p style="font-size:13px;color:var(--grey);margin-bottom:10px">Both parties sign here (any order), then tap <b style="color:var(--gold-soft)">Preview PDF</b> to see the real agreement in your template format.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn ${lessorDone?'sec':''}" onclick="openSign('lessor')">${lessorDone?'Lessor signed \u2713 (re-sign)':'Sign \u2014 Lessor (GP)'}</button>
        <button class="btn ${lesseeDone?'sec':'ok'}" onclick="openSign('lessee')">${lesseeDone?'Lessee signed \u2713 (re-sign)':'Sign \u2014 Lessee'}</button>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;border-top:1px solid var(--line);padding-top:14px">
        <button class="btn" onclick="saveCurrent()">Save</button>
        <button class="btn" id="previewBtn" onclick="generatePdf('preview')" ${both?'':'disabled'}>Preview PDF</button>
        <button class="btn ok" id="genBtn" onclick="generatePdf('final')" ${both?'':'disabled'}>Finalise to Drive</button>
        <button class="btn sec" onclick="backToForm()">\u2039 Edit details</button>
        <a class="btn sec" href="index.html" style="text-decoration:none">Exit to Hub</a>
      </div>
      ${both
        ? '<div class="hint" style="margin-top:10px">Tap <b>Preview PDF</b> to review, or <b>Finalise to Drive</b> to save the signed copy.</div>'
        : '<div class="hint" style="margin-top:10px">Both signatures needed before you can preview or finalise.</div>'}
    </div>

    <div class="panel" style="text-align:center;padding:30px 18px">
      <div style="font-size:34px;margin-bottom:8px">📄</div>
      <div style="font-size:14px;color:var(--text);font-weight:600">Real agreement opens as a PDF</div>
      <div style="font-size:12.5px;color:var(--grey);margin-top:6px;line-height:1.6">
        The on-screen draft has been removed to avoid confusion.<br>
        Sign both parties, then tap <b style="color:var(--gold-soft)">Preview PDF</b> — the exact
        agreement (with your header, watermark &amp; formatting) opens in a new tab.
      </div>
    </div>`;
}


function showPreviewLink(url){
  const v=document.getElementById('view');
  if(!v) return;
  const old=document.getElementById('previewCard'); if(old) old.remove();
  const box=document.createElement('div');
  box.className='panel'; box.id='previewCard';
  box.innerHTML =
    '<h3>Preview Ready</h3>'+
    '<p style="font-size:13px;color:var(--grey);margin-bottom:10px">Your preview PDF is ready. Tap to open it (it may also have opened in a new tab).</p>'+
    '<a class="btn ok" href="'+esc(url)+'" target="_blank" style="text-decoration:none;display:inline-block">Open Preview PDF ›</a>';
  v.insertBefore(box, v.firstChild);
}

function showWhatsapp(pdfUrl, a){
  // insert a WhatsApp card at the top of the view
  const v=document.getElementById('view');
  if(!v) return;
  const existing=document.getElementById('waCard'); if(existing) existing.remove();
  const box=document.createElement('div');
  box.className='panel'; box.id='waCard';
  box.innerHTML =
    '<h3>Send to Customer</h3>'+
    '<p style="font-size:13px;color:var(--grey);margin-bottom:10px">Agreement finalised. Open WhatsApp, choose the customer, and the message (with the PDF link) is ready to send.</p>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<button class="btn ok" onclick="sendWhatsapp(\''+encodeURIComponent(pdfUrl)+'\')">Send via WhatsApp</button>'+
      '<a class="btn sec" href="'+esc(pdfUrl)+'" target="_blank" style="text-decoration:none">Open PDF</a>'+
    '</div>'+
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">'+
      '<button class="btn" onclick="startNew(\'lease\')">+ New Agreement</button>'+
      '<button class="btn sec" onclick="showChooser()">Done</button>'+
      '<a class="btn sec" href="index.html" style="text-decoration:none">‹ Back to Hub</a>'+
    '</div>';
  v.insertBefore(box, v.firstChild);
}

function sendWhatsapp(encUrl){
  const a=STATE.current||{};
  const url=decodeURIComponent(encUrl);
  const name=(a.lessee_name||'').trim();
  const car=(a.v_make_model||'').trim();
  const reg=(a.v_reg||'').trim();
  let msg='Hi'+(name?' '+name:'')+', here is your GRANDPRIDE leasing agreement';
  if(car) msg+=' for '+car;
  if(reg) msg+=' ('+reg+')';
  msg+='.\n\nPlease review and keep a copy:\n'+url+'\n\nThank you for choosing Grandpride Luxury Travel.';
  // wa.me with no number -> opens WhatsApp and lets you pick the contact
  const wa='https://wa.me/?text='+encodeURIComponent(msg);
  window.open(wa,'_blank');
}

async function saveCurrent(){
  const a=STATE.current;
  if(a.sig_lessor&&a.sig_lessee) a.status='done';
  else if(a.sig_lessor||a.sig_lessee) a.status='lessor';
  else a.status='draft';
  const ok=await sbUpsert(rowFor(a));
  toast(ok?'Saved':'Saved (cloud off)');
  if(STATE.view==='preview') previewDoc();
}

function pdfName(a){
  const type=(a.type==='lease')?'LEASING':(a.type==='subscription')?'SUBSCRIPTION':'LEASE TO OWN';
  const name=(a.lessee_name||'NAME').trim();
  // agreement date -> e.g. 2JULY2024
  let dstr='';
  if(a.agreement_date){ try{ const x=new Date(a.agreement_date+'T00:00:00');
    const mon=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][x.getMonth()];
    dstr=x.getDate()+mon+x.getFullYear(); }catch(e){} }
  const reg=(a.v_reg||'').trim();
  return [type,name,dstr,reg].filter(Boolean).join('_');
}

function doPrint(){
  const a=STATE.current;
  const prev=document.title;
  document.title = pdfName(a);   // browsers use document.title as default PDF filename
  window.print();
  setTimeout(()=>{ document.title=prev; }, 800);
}


async function generatePdf(mode){
  const a=STATE.current;
  if(!a.sig_lessor || !a.sig_lessee){ toast('Both signatures needed first'); return; }
  const payload = Object.assign({}, a);
  payload.lease_period = (a.lease_from||a.lease_to) ? (fmtDate(a.lease_from)+' - '+fmtDate(a.lease_to)) : '';
  payload.mode = (mode==='preview') ? 'preview' : 'final';

  const previewBtn=document.getElementById('previewBtn');
  const genBtn=document.getElementById('genBtn');
  const btn = (mode==='preview') ? previewBtn : genBtn;
  const label = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='Generating…'; }
  toast('Generating '+(mode==='preview'?'preview':'final')+' PDF…');

  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    const out = await res.json();
    if(out.ok){
      if(mode==='final'){
        a.status='done'; a.pdf_url=out.url; await saveCurrent();
        toast('Finalised & saved to Drive ✓');
        showWhatsapp(out.url, a);
      } else {
        toast('Preview ready — tap "Open Preview PDF"');
        showPreviewLink(out.url);
      }
      // No auto-popup (iOS blocks it). User taps the link button to open.
    } else {
      toast('Failed: '+(out.error||'unknown'));
    }
  }catch(e){
    toast('Error: '+e.message);
  }finally{
    if(btn){ btn.disabled=false; btn.textContent=label; }
  }
}

function showPdfLink(url,name){
  const v=document.getElementById('view');
  const box=document.createElement('div');
  box.className='panel';
  box.innerHTML='<h3>PDF Generated</h3>'+
    '<p style="font-size:13px;color:var(--grey);margin-bottom:10px">'+esc(name||'')+'.pdf saved to Drive.</p>'+
    '<a class="btn ok" href="'+esc(url)+'" target="_blank" style="text-decoration:none;display:inline-block">Open PDF in Drive ›</a>';
  v.insertBefore(box, v.firstChild);
}

function backToForm(){ if(STATE.current.type==='lease') showLeaseForm(); else showForm(); }

/* signature modal */
function openSign(party){
  const a=STATE.current;
  const wrap=document.createElement('div');
  wrap.id='sigModal';
  wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px';
  wrap.innerHTML=`
    <div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:520px;width:100%">
      <h3 style="color:var(--gold-soft);font-size:14px;margin-bottom:10px;text-transform:uppercase">${party==='lessor'?'Lessor (GP) Signature':'Lessee Signature'}</h3>
      ${party==='lessor'?`<label>Signatory name (GP representative)</label><input id="sg_name" value="${esc(a.sig_lessor_name||'')}" placeholder="Name" style="margin-bottom:8px">`:''}
      <label>Full signature</label>
      <div class="sigwrap"><canvas class="sigpad" id="padFull"></canvas>
        <div class="sig-actions"><button class="btn sec mini" onclick="clearPad('padFull')">Clear</button></div></div>
      <label style="margin-top:10px">Initials (small \u2014 stamped on every page)</label>
      <div class="sigwrap"><canvas class="sigpad initial" id="padInit"></canvas>
        <div class="sig-actions"><button class="btn sec mini" onclick="clearPad('padInit')">Clear</button></div></div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn ok" onclick="saveSign('${party}')">Save signature</button>
        <button class="btn sec" onclick="closeSign()">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  initPad('padFull'); initPad('padInit');
  // preload existing
  if(party==='lessor'){ if(a.sig_lessor) loadPad('padFull',a.sig_lessor); if(a.sig_lessor_initial) loadPad('padInit',a.sig_lessor_initial); }
  else { if(a.sig_lessee) loadPad('padFull',a.sig_lessee); if(a.sig_lessee_initial) loadPad('padInit',a.sig_lessee_initial); }
}
function closeSign(){ const m=$('sigModal'); if(m) m.remove(); }

async function saveSign(party){
  const a=STATE.current;
  const full=getPad('padFull'), init=getPad('padInit');
  if(!full){ toast('Please sign (full signature)'); return; }
  if(party==='lessor'){
    a.sig_lessor=full; a.sig_lessor_initial=init||a.sig_lessor_initial;
    a.sig_lessor_name=($('sg_name')&&$('sg_name').value)||a.sig_lessor_name;
    a.sig_lessor_date=todayISO();
  } else {
    a.sig_lessee=full; a.sig_lessee_initial=init||a.sig_lessee_initial; a.sig_lessee_date=todayISO();
  }
  closeSign();
  await saveCurrent();
  toast('Signature saved');
}

/* ---- canvas pad ---- */
var PADS={};
function initPad(id){
  const c=$(id); const r=c.getBoundingClientRect();
  c.width=r.width*2; c.height=r.height*2;
  const ctx=c.getContext('2d'); ctx.scale(2,2); ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle='#111';
  let drawing=false,last=null,dirty=false;
  function pos(e){ const rect=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return {x:t.clientX-rect.left,y:t.clientY-rect.top}; }
  function down(e){ drawing=true; last=pos(e); e.preventDefault(); }
  function move(e){ if(!drawing)return; const p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; dirty=true; e.preventDefault(); }
  function up(){ drawing=false; }
  c.addEventListener('mousedown',down); c.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  c.addEventListener('touchstart',down,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',up);
  PADS[id]={c,ctx,isDirty:()=>dirty,setDirty:v=>dirty=v};
}
function clearPad(id){ const p=PADS[id]; if(!p)return; p.ctx.clearRect(0,0,p.c.width,p.c.height); p.setDirty(false); }
function getPad(id){ const p=PADS[id]; if(!p||!p.isDirty())return ''; return p.c.toDataURL('image/png'); }
function loadPad(id,dataUrl){ const p=PADS[id]; if(!p)return; const img=new Image(); img.onload=()=>{ p.ctx.drawImage(img,0,0,p.c.width/2,p.c.height/2); p.setDirty(true); }; img.src=dataUrl; }

/* ---- saved list ---- */
async function showList(){
  STATE.view='list'; setSub('Saved agreements'); $('doc').style.display='none';
  $('view').innerHTML='<div class="panel"><h3>Saved Agreements</h3><div id="listBody">Loading\u2026</div></div>';
  const rows=await sbList();
  if(!rows.length){ $('listBody').innerHTML='<p style="color:var(--grey);font-size:13px">No saved agreements yet.</p>'; return; }
  $('listBody').innerHTML=rows.map(r=>{
    const a=r.data||r; const st=a.status||'draft';
    const pill=st==='done'?'<span class="pill done">Completed</span>':st==='lessor'?'<span class="pill lessor">Awaiting lessee</span>':'<span class="pill draft">Draft</span>';
    return `<div class="rec">
      <div class="meta"><b>${esc(a.lessee_name||'(no name)')}</b> ${pill}<br>
        <small>${esc(a.v_reg||'')} \u00b7 ${({lto:'Lease to Own'}[a.type]||a.type)} \u00b7 ${new Date(r.created_at||a.created_at).toLocaleDateString('en-GB')}</small></div>
      <div style="display:flex;gap:6px">
        <button class="btn sec mini" onclick="openSaved('${a.id}')">Open</button>
        <button class="btn danger mini" onclick="delSaved('${a.id}')">\u2715</button>
      </div></div>`;
  }).join('');
}
async function openSaved(id){
  const r=await sbGet(id); if(!r){ toast('Not found'); return; }
  STATE.current = r.data||r;
  previewDoc();
}
async function delSaved(id){
  if(!confirm('Delete this agreement?'))return;
  await sbDelete(id); toast('Deleted'); showList();
}

/* ---- init ---- */
/* if arriving from Appointment with prefill, open a lease form filled from the booking */
function tryApptPrefill(){
  try{
    var p=new URLSearchParams(location.search);
    if(p.get('from')!=='appt') return false;
    var raw=sessionStorage.getItem('gp_agreement_prefill'); if(!raw) return false;
    var d=JSON.parse(raw);
    var a=blankLEASE();
    a.lessee_name = d.customer_name||'';
    a.v_make_model = (d.car_model||'').toUpperCase();
    a.v_reg = (d.car_plate||'').toUpperCase();
    a.v_year = d.v_year||'';
    a.lease_from = (d.start||d.rental_date||'').slice(0,10);
    a.lease_to = (d.end||'').slice(0,10);
    a.leasing_price = d.rate||d.full_amount||'';
    if(d.insured_pct){ a.insurance_insured=String(d.insured_pct); a.insurance_bear=String(Math.max(0,100-(parseFloat(d.insured_pct)||0))); }
    if(d.fuel_type) a.petrol_type=d.fuel_type;
    STATE.current=a; STATE.view='lease';
    showLeaseForm();
    sessionStorage.removeItem('gp_agreement_prefill');
    return true;
  }catch(e){ return false; }
}
if(!tryApptPrefill()) showChooser();
