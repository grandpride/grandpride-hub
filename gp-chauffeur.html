<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GP Chauffeur</title>
<style>
  :root{
    --ink:#0a0908; --paper:#f5f3ee; --gold:#c9a24b; --gold-soft:#e3c887;
    --grey:#9a958c; --line:rgba(201,162,75,.18); --card:#15120d;
    --green:#5a9e6f; --red:#d2533f; --amber:#d4a23a; --blue:#5b8bb0; --purple:#9a78c0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:var(--paper);margin:0;min-height:100vh;padding-bottom:40px}
  .top{position:sticky;top:0;z-index:30;background:rgba(10,9,8,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  .top .lg{width:38px;height:38px;background:#000;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:var(--gold);font-size:15px;border:1px solid var(--line);flex:0 0 auto}
  .top .ti h2{font-family:Georgia,serif;font-size:15px;letter-spacing:1px;margin:0}
  .top .ti p{font-size:11px;color:var(--grey);margin:2px 0 0}
  .wrap{max-width:680px;margin:0 auto;padding:14px 16px}
  .counts{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
  .cnt{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;min-width:84px}
  .cnt .n{font-family:Georgia,serif;font-size:20px} .cnt .l{font-size:10px;color:var(--grey)}
  .ch{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .ava{width:46px;height:46px;border-radius:50%;background:#2a2620;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:var(--gold-soft);font-size:18px;flex:0 0 auto;overflow:hidden}
  .ava img{width:100%;height:100%;object-fit:cover}
  .ch .nm{font-family:Georgia,serif;font-size:16px}
  .ch .meta{font-size:12px;color:var(--grey);margin-top:2px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:bold;margin-top:4px}
  .p-ready{background:var(--green);color:#000} .p-hod{background:var(--blue);color:#fff}
  .p-outside{background:var(--amber);color:#000} .p-off{background:#555;color:#fff} .p-leave{background:var(--purple);color:#fff}
  .btn{font-family:inherit;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;border:none}
  .btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold-soft));color:#000;font-weight:bold}
  .btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--gold-soft)}
  .btn.sm{font-size:12px;padding:8px 10px}
  .empty{text-align:center;color:var(--grey);padding:30px;font-size:14px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .modal.show{display:flex}
  .sheet{background:#14110c;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:680px;padding:18px 16px 28px}
  .sheet h3{font-family:Georgia,serif;margin:0 0 10px;font-size:18px}
  .opt{display:flex;align-items:center;gap:10px;padding:13px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:15px}
  .opt.sel{border-color:var(--gold);background:#1c1810}
  input{width:100%;font-family:inherit;font-size:15px;color:var(--paper);background:#0f0d0a;border:1px solid var(--line);border-radius:9px;padding:11px;margin-top:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1c1810;border:1px solid var(--gold);color:var(--gold-soft);padding:10px 18px;border-radius:10px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div class="top">
    <div class="lg">GP</div>
    <div class="ti"><h2>CHAUFFEUR</h2><p id="syncNote">Availability board</p></div>
  </div>

  <div class="wrap">
    <div class="counts" id="counts"></div>
    <div id="list"><div class="empty">Loading…</div></div>
  </div>

  <!-- STATUS MODAL -->
  <div class="modal" id="stModal">
    <div class="sheet">
      <h3 id="stTitle">Set status</h3>
      <div id="stOpts"></div>
      <input id="stNote" placeholder="Note (optional) — e.g. job for Datuk Lim">
      <button class="btn gold" style="width:100%;margin-top:12px" onclick="saveStatus()">Save</button>
      <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSt()">Cancel</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
var SB_URL="https://iefevjkeckysdluzazeq.supabase.co";
var SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZmV2amtlY2t5c2RsdXphemVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODI1MTMsImV4cCI6MjA5NjY1ODUxM30.xVqifxHta7rPtxf0hh1C4_rexhwWQhaiOxEzVr_oM5k";
function sbH(x){ return Object.assign({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY}, x||{}); }
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800);}

var STATUSES=[
  {k:'ready',  name:'Ready at GP',  pill:'p-ready',  emoji:'✅'},
  {k:'hod',    name:'HOD using',    pill:'p-hod',    emoji:'🧑‍💼'},
  {k:'outside',name:'Outside job',  pill:'p-outside',emoji:'🚗'},
  {k:'off',    name:'Off day',      pill:'p-off',    emoji:'😴'},
  {k:'leave',  name:'On leave',     pill:'p-leave',  emoji:'🌴'}
];
function stOf(k){ return STATUSES.find(s=>s.k===k)||STATUSES[0]; }

/* who am I (from Hub session) + permission */
var ME=null, CAN_OPS=false;
function loadMe(){
  try{
    var raw=localStorage.getItem('gp_current_user'); // Hub stores current user
    if(raw){ ME=JSON.parse(raw); }
  }catch(e){}
}

var CH=[], PICK=null, PICK_STATUS='ready';
function fetchT(url, opts, ms){
  return Promise.race([
    fetch(url, opts),
    new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('timeout')); }, ms||10000); })
  ]);
}
async function load(){
  // show something immediately so it's never a blank "Loading…"
  $('list').innerHTML='<div class="empty">Loading chauffeurs…</div>';
  try{
    var r=await fetchT(SB_URL+"/rest/v1/gp_staff?is_chauffeur=eq.true&select=*&order=name.asc",{headers:sbH()}, 10000);
    if(!r.ok){
      var t=''; try{ t=await r.text(); }catch(e){}
      $('list').innerHTML='<div class="empty">Server error '+r.status+'.<br><small>'+esc((t||'').slice(0,160))+'</small></div>';
      $('syncNote').textContent='Error '+r.status;
      return;
    }
    CH = await r.json();
    if(!CH.length){
      var r2=await fetchT(SB_URL+"/rest/v1/gp_staff?select=*&order=name.asc",{headers:sbH()}, 10000);
      if(r2.ok){
        var all=await r2.json();
        CH=all.filter(function(x){ return x.is_chauffeur===true || (x.title && String(x.title).toLowerCase().indexOf('chauffeur')>=0); });
      }
    }
    $('syncNote').textContent='Live • '+CH.length+' chauffeurs';
  }catch(e){
    CH=[];
    $('syncNote').textContent='Could not load';
    $('list').innerHTML='<div class="empty">Could not load chauffeurs.<br><small>'+esc(String(e&&e.message||e))+'</small><br><br>Check connection, or that the chauffeur columns exist (run the schema SQL).</div>';
    console.warn('chauffeur load error', e);
    return;
  }
  try{ render(); }catch(e){ console.warn('render error', e); $('list').innerHTML='<div class="empty">Error showing chauffeurs.<br><small>'+esc(String(e&&e.message||e))+'</small></div>'; }
}
function render(){
  // counts
  var by={}; STATUSES.forEach(s=>by[s.k]=0);
  CH.forEach(c=>{ var k=c.chauffeur_status||'ready'; by[k]=(by[k]||0)+1; });
  $('counts').innerHTML=STATUSES.map(s=>`<div class="cnt"><div class="n">${by[s.k]||0}</div><div class="l">${s.name}</div></div>`).join('');
  if(!CH.length){ $('list').innerHTML='<div class="empty">No chauffeurs yet. Mark staff as “Is a chauffeur” in Staff Manager.</div>'; return; }
  $('list').innerHTML=CH.map(c=>{
    var st=stOf(c.chauffeur_status||'ready');
    var initials=(c.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
    var ava=c.photo_url?`<img src="${c.photo_url}">`:esc(initials);
    var when=c.chauffeur_updated?new Date(c.chauffeur_updated).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
    return `<div class="ch">
      <div class="ava">${ava}</div>
      <div style="flex:1">
        <div class="nm">${esc(c.name||c.username)}</div>
        <div><span class="pill ${st.pill}">${st.emoji} ${st.name}</span></div>
        ${c.chauffeur_note?('<div class="meta">📝 '+esc(c.chauffeur_note)+'</div>'):''}
        ${when?('<div class="meta">updated '+when+'</div>'):''}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${(c.chauffeur_status&&c.chauffeur_status!=='ready')?`<button class="btn gold sm" onclick="quickReady('${c.username}')">✓ Done</button>`:''}
        <button class="btn ghost sm" onclick="openSt('${c.username}')">Change</button>
      </div>
    </div>`;
  }).join('');
}

function openSt(username){
  PICK=CH.find(c=>c.username===username); if(!PICK) return;
  PICK_STATUS=PICK.chauffeur_status||'ready';
  $('stTitle').textContent='Status — '+(PICK.name||username);
  $('stOpts').innerHTML=STATUSES.map(s=>`<div class="opt ${PICK_STATUS===s.k?'sel':''}" onclick="pickSt('${s.k}')">${s.emoji} ${s.name}</div>`).join('');
  $('stNote').value=PICK.chauffeur_note||'';
  $('stModal').classList.add('show');
}
function pickSt(k){ PICK_STATUS=k; document.querySelectorAll('#stOpts .opt').forEach((o,i)=>o.classList.toggle('sel',STATUSES[i].k===k)); }
function closeSt(){ $('stModal').classList.remove('show'); PICK=null; }

async function setStatus(username, status, note, by){
  var now=new Date().toISOString();
  try{
    var r=await fetch(SB_URL+"/rest/v1/gp_staff?username=eq."+encodeURIComponent(username),
      {method:'PATCH',headers:sbH({'Prefer':'return=minimal'}),body:JSON.stringify({chauffeur_status:status,chauffeur_note:note||'',chauffeur_updated:now})});
    if(!r.ok){ toast('Save failed'); return false; }
    await fetch(SB_URL+"/rest/v1/gp_chauffeur_log",{method:'POST',headers:sbH({'Prefer':'return=minimal'}),
      body:JSON.stringify({staff_username:username,staff_name:(CH.find(c=>c.username===username)||{}).name||'',status:status,note:note||'',by_name:by||''})});
    return true;
  }catch(e){ toast('Offline'); return false; }
}
async function saveStatus(){
  if(!PICK) return;
  var ok=await setStatus(PICK.username, PICK_STATUS, ($('stNote').value||'').trim(), (ME&&ME.name)||'');
  if(ok){ toast('Status updated'); closeSt(); load(); }
}
async function quickReady(username){
  var ok=await setStatus(username,'ready','',(ME&&ME.name)||'');
  if(ok){ toast('Back to Ready ✓'); load(); }
}

/* init */
loadMe();
load();
setInterval(load, 60000); // auto-refresh each minute
