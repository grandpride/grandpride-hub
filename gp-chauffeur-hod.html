<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GrandPride Chauffeur — HOD</title>
<link rel="manifest" href="gp-chauffeur-hod.webmanifest">
<meta name="theme-color" content="#0b0b0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GP Chauffeur HOD">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root{ --bg:#0b0b0b; --card:#151515; --card2:#1c1c1a; --border:#2a2a26; --text:#f5f3ee; --muted:#9a978d; --gold:#e3c887; --green:#3ba55d; --red:#d2533f; --amber:#e0b060; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px 60px}
  .hidden{display:none!important}
  h2{font-size:19px;margin:0 0 4px;color:var(--gold);text-align:center;letter-spacing:.08em}
  .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase}
  input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:12px;font-size:16px;font-family:inherit}
  .btn{background:var(--gold);color:#1c1810;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .err{color:var(--red);font-size:13px;margin-top:8px;text-align:center;min-height:16px}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}
  .drv{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card2)}
  .drv-top{display:flex;align-items:center;gap:10px}
  .av{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold);overflow:hidden;flex-shrink:0}
  .av img{width:100%;height:100%;object-fit:cover}
  .drv h4{margin:0;font-size:15px}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--card)}
  .pill.in{background:#12331f;color:#7fe0a0}
  .pill.out{background:#3a2020;color:#e8a08f}
  .pill.off{background:#2a2a26;color:var(--muted)}
  .pill.trip{background:#2f2a16;color:var(--gold);margin-left:4px}
  .drv .row{font-size:13px;color:var(--muted);margin-top:6px}
  .drv .times{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:6px}
  .drv .times b{color:var(--text);font-variant-numeric:tabular-nums}
  .selfie{margin-top:8px}
  .selfie img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--border)}
  .muted{color:var(--muted)}
  a.map{color:var(--gold);text-decoration:none;font-size:13px}
  .refresh{background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 14px;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="wrap hidden">
  <div style="text-align:center;margin:14px 0" id="loginLogo"></div>
  <h2>CHAUFFEUR — HOD</h2>
  <div class="sub">Sign in with your GrandPride account</div>
  <div class="card">
    <label>Email</label>
    <input id="lg_email" type="email" autocomplete="username" placeholder="you@grandpride.com">
    <label>Password</label>
    <input id="lg_pass" type="password" autocomplete="current-password" placeholder="........">
    <button class="btn" style="margin-top:16px" onclick="doLogin()">Sign in</button>
    <div class="err" id="lg_err"></div>
  </div>
</div>

<!-- NO ACCESS -->
<div id="noAccess" class="wrap hidden">
  <h2>CHAUFFEUR — HOD</h2>
  <div class="card" style="text-align:center">
    <div style="font-size:40px;margin-bottom:8px">&#128683;</div>
    <p>This account doesn't have chauffeur-ops access.</p>
    <button class="btn sec" style="margin-top:14px" onclick="doLogout()">Sign out</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="wrap hidden">
  <div class="topbar">
    <h2 style="margin:0">CHAUFFEUR — HOD</h2>
    <button class="btn sec" style="width:auto;padding:8px 12px;font-size:13px" onclick="doLogout()">Sign out</button>
  </div>
  <div class="sub" id="daySub"></div>
  <div style="text-align:center;margin-bottom:12px"><button class="refresh" onclick="loadBoard()">↻ Refresh</button></div>
  <div id="board"><div class="muted" style="text-align:center">Loading…</div></div>
</div>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://iefevjkeckysdluzazeq.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImllZmV2amtlY2t5c2RsdXphemVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwODI1MTMsImV4cCI6MjA5NjY1ODUxM30.xVqifxHta7rPtxf0hh1C4_rexhwWQhaiOxEzVr_oM5k";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:true,autoRefreshToken:true}});
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
function show(id){['login','noAccess','app'].forEach(x=>$(x).classList.toggle('hidden',x!==id));}
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

let ME=null;

async function boot(){
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){ show('login'); return; }
  await afterLogin(data.session);
}
async function afterLogin(session){
  const email=(session.user&&session.user.email)||'';
  const {data:rows}=await sb.from('gp_staff').select('username,name,can_chauffeur_ops').or('email.eq.'+email+',auth_id.eq.'+session.user.id);
  const me=(rows||[])[0];
  if(!me || !me.can_chauffeur_ops){ show('noAccess'); return; }
  ME=me; show('app'); loadBoard();
}
async function doLogin(){
  $('lg_err').textContent='';
  const email=$('lg_email').value.trim(), pass=$('lg_pass').value;
  if(!email||!pass){ $('lg_err').textContent='Enter email and password'; return; }
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ $('lg_err').textContent=error.message; return; }
  await afterLogin(data.session);
}
async function doLogout(){ await sb.auth.signOut(); ME=null; show('login'); }

async function loadBoard(){
  const k=todayKey();
  $('daySub').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const box=$('board'); box.innerHTML='<div class="muted" style="text-align:center">Loading…</div>';
  // all chauffeurs
  const cs=await sb.from('gp_staff').select('username,name,photo_url,chauffeur_status').eq('is_chauffeur',true).order('name');
  const chauffeurs=cs.data||[];
  if(!chauffeurs.length){ box.innerHTML='<div class="muted" style="text-align:center">No chauffeurs registered.</div>'; return; }
  const usernames=chauffeurs.map(c=>c.username);
  // today's attendance for all
  const at=await sb.from('gp_attendance').select('username,rec').in('username',usernames).eq('date_key',k);
  const attByUser={}; (at.data||[]).forEach(a=>attByUser[a.username]=a.rec||{});
  // active jobs (with trip status) for all
  const jb=await sb.from('gp_jobs').select('driver_username,customer_name,car_plate,trip_status,trip_updated_at,stage')
    .in('driver_username',usernames).in('stage',['booked','paid','delivered']);
  const jobByUser={}; (jb.data||[]).forEach(j=>{ if(!jobByUser[j.driver_username]) jobByUser[j.driver_username]=j; });

  const tripLabel={on_the_way:'🚗 On the way',arrived:'📍 Arrived',pob:'🧑 On board',completed:'✅ Completed'};
  box.innerHTML=chauffeurs.map(c=>{
    const rec=attByUser[c.username]||{};
    const job=jobByUser[c.username];
    let statePill;
    if(rec.pmOut) statePill='<span class="pill off">Clocked out</span>';
    else if(rec.amIn) statePill='<span class="pill in">Clocked in</span>';
    else statePill='<span class="pill off">Not in</span>';
    const trip=job&&job.trip_status?('<span class="pill trip">'+(tripLabel[job.trip_status]||job.trip_status)+'</span>'):'';
    // last selfie proof (latest punch that has offsite)
    let proof=null, proofPunch='';
    const order=['Evening Out','Lunch In','Lunch Out','Morning In'];
    if(rec.offsite){ for(const p of order){ if(rec.offsite[p]&&rec.offsite[p].photo){ proof=rec.offsite[p]; proofPunch=p; break; } } }
    const av=c.photo_url?('<img src="'+esc(c.photo_url)+'">'):esc((c.name||c.username||'?').charAt(0).toUpperCase());
    return `<div class="drv">
      <div class="drv-top">
        <div class="av">${av}</div>
        <div style="flex:1">
          <h4>${esc(c.name||c.username)}</h4>
          <div>${statePill}${trip}</div>
        </div>
      </div>
      <div class="times">
        <span>In: <b>${rec.amIn||'—'}</b></span>
        <span>Lunch: <b>${rec.lunchOut||'—'}</b>/<b>${rec.lunchIn||'—'}</b></span>
        <span>Out: <b>${rec.pmOut||'—'}</b></span>
      </div>
      ${rec.status?`<div class="row">Status: ${esc(rec.status)}</div>`:''}
      ${job?`<div class="row">Job: ${esc(job.customer_name||'')}${job.car_plate?(' · '+esc(job.car_plate)):''}</div>`:''}
      ${proof?`<div class="selfie"><img src="${esc(proof.photo)}"> <span class="muted" style="font-size:12px">${esc(proofPunch)} · ${esc(proof.time||'')}${proof.address?(' · '+esc(proof.address.split(',').slice(0,2).join(','))):''}</span>${(proof.lat&&proof.lng)?` · <a class="map" href="https://maps.google.com/?q=${proof.lat},${proof.lng}" target="_blank">map ›</a>`:''}</div>`:''}
    </div>`;
  }).join('');
}

boot();
</script>
</body>
</html>
