<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Set Your Password — Grandpride Hub</title>
<style>
  :root{
    --ink:#0a0908; --paper:#f5f3ee; --gold:#c9a24b; --gold-soft:#e3c887;
    --grey:#9a958c; --line:rgba(201,162,75,.18); --bad:#d2533f; --ok:#5a9e6f;
    --card:#15120d;
  }
  *{box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:var(--ink);color:var(--paper);
    min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:26px 22px}
  .lg{width:54px;height:54px;background:#000;border-radius:50%;margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;
    color:var(--gold);font-size:22px;border:1px solid var(--line)}
  h1{font-family:Georgia,serif;font-size:21px;text-align:center;margin:0 0 4px;letter-spacing:1px}
  .sub{color:var(--grey);font-size:13px;text-align:center;margin:0 0 20px;line-height:1.5}
  label{display:block;font-size:11px;letter-spacing:.5px;color:var(--grey);
    text-transform:uppercase;margin:14px 0 5px}
  input{width:100%;font-family:inherit;font-size:16px;color:var(--paper);background:#0f0d0a;
    border:1px solid var(--line);border-radius:10px;padding:13px 12px}
  input:focus{border-color:var(--gold);outline:none}
  .btn{width:100%;font-family:inherit;font-size:15px;font-weight:bold;padding:14px;border:none;
    border-radius:10px;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--gold-soft));
    color:#000;margin-top:20px}
  .btn:disabled{opacity:.5}
  .msg{font-size:13px;text-align:center;margin-top:14px;line-height:1.5;min-height:18px}
  .msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
  .hint{font-size:11px;color:var(--grey);margin-top:6px}
</style>
</head>
<body>
  <div class="box">
    <div class="lg">GP</div>
    <h1>Set Your Password</h1>
    <p class="sub" id="sub">Welcome to Grandpride Hub. Choose a password to finish setting up your login.</p>

    <div id="form">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters">
      <div class="hint">Use 8+ characters. Don't reuse a password from elsewhere.</div>
      <label for="pw2">Confirm password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Type it again">
      <button class="btn" id="go">Save password &amp; continue</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

<script src="supa.js"></script>
<script>
  var HUB_URL = 'https://grandpride.github.io/grandpride-hub/index.html';
  var msg = document.getElementById('msg');
  var sub = document.getElementById('sub');
  var form = document.getElementById('form');

  function show(t, cls){ msg.textContent = t; msg.className = 'msg' + (cls?(' '+cls):''); }

  (async function(){
    await SUPA.init();
    var type = SUPA.pendingInviteType(); // 'invite' | 'recovery' | 'signup' | null
    var hasSession = await SUPA.hasInviteSession();

    if(type === 'recovery'){
      sub.textContent = 'Reset your password below.';
    }
    if(!hasSession){
      // No valid token in the link (expired, already used, or opened directly)
      form.style.display = 'none';
      show('This link is invalid or has expired. Ask your admin to send a fresh invite.', 'bad');
    }
  })();

  document.getElementById('go').addEventListener('click', async function(){
    var pw = document.getElementById('pw').value;
    var pw2 = document.getElementById('pw2').value;
    if(pw.length < 8){ show('Password must be at least 8 characters.', 'bad'); return; }
    if(pw !== pw2){ show('Passwords do not match.', 'bad'); return; }

    var btn = document.getElementById('go');
    btn.disabled = true; show('Saving…');

    var res = await SUPA.setMyPassword(pw);
    if(!res || !res.ok){
      btn.disabled = false;
      show((res && res.error) ? res.error : 'Could not save password.', 'bad');
      return;
    }
    show('Password set! Taking you to the Hub…', 'ok');
    SUPA.clearAuthHash();
    try{ await SUPA.signOut(); }catch(e){}
    setTimeout(function(){ window.location.href = HUB_URL; }, 1200);
  });
</script>
</body>
</html>
