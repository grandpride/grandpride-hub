<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>GP Jobs</title>
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0b; --card:#151515; --card2:#1c1c1a; --border:#2a2a26;
    --text:#f5f3ee; --muted:#9a978d; --muted2:#6d6b64;
    --gold:#e3c887; --gold2:#c9a94e;
    --green:#3ba55d; --amber:#e0a02a; --red:#d2533f; --blue:#4a90d9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 90px}
  a{color:var(--gold)}
  .hubback{position:fixed;top:12px;left:12px;z-index:30;background:rgba(20,20,20,.85);border:1px solid var(--border);color:var(--gold);font-size:12px;font-weight:700;padding:7px 12px;border-radius:20px;backdrop-filter:blur(4px);text-decoration:none}
  .head{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 12px;border-bottom:1px solid var(--border);margin-bottom:14px}
  .head .lg img{height:30px;display:block}
  .head small{color:var(--gold);font-size:12px;letter-spacing:.14em;font-weight:600}
  h3{font-size:15px;margin:0 0 10px;color:var(--gold)}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.03em}
  input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--gold2)}
  textarea{resize:vertical;min-height:56px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .btn{background:var(--gold);color:#1c1810;border:none;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;width:100%;cursor:pointer;font-family:inherit}
  .btn.sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
  .btn.danger{background:#3a1a1a;color:#ffb3a6;border:1px solid var(--red)}
  .btn.sm{padding:8px 10px;font-size:13px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:11px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .st-booked{background:#33260f;color:#e0b060}
  .st-paid{background:#12331f;color:#7fe0a0}
  .st-delivered{background:#1a2a33;color:#7fcbe0}
  .st-returned{background:#2a1a33;color:#c79fe0}
  .st-deposit_settled{background:#1a3320;color:#8fe0a8}
  .st-done{background:#2a2a26;color:var(--muted)}
  .st-cancelled{background:#331a1a;color:#ffb3a6}
  .tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .tab{background:var(--card2);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
  .tab.on{background:var(--gold);color:#1c1810;border-color:var(--gold)}
  .search{position:relative;margin-bottom:12px}
  .search input{padding-left:38px}
  .search i{position:absolute;left:12px;top:12px;color:var(--muted)}
  .fab{position:fixed;bottom:18px;right:18px;z-index:25;background:var(--gold);color:#1c1810;width:56px;height:56px;border-radius:50%;border:none;font-size:26px;box-shadow:0 4px 16px rgba(0,0,0,.4);cursor:pointer}
  .rowline{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
  .rowline:last-child{border-bottom:none}
  .muted{color:var(--muted)}
  .hint{font-size:12px;color:var(--muted2);margin-top:6px}
  .hidden{display:none!important}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .modal{background:var(--bg);border-top:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:92vh;overflow-y:auto;padding:18px 16px 40px}
  .modal .x{float:right;background:var(--card2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .gate{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
  .gate .box{max-width:340px;width:100%;text-align:center}
  .gate img{height:54px;margin-bottom:20px}
  .pickrow{padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:7px;cursor:pointer;background:var(--card2)}
  .pickrow:active{border-color:var(--gold2)}
  .stagebar{display:flex;gap:4px;margin:10px 0}
  .stagebar .s{flex:1;height:5px;border-radius:3px;background:var(--card2)}
  .stagebar .s.done{background:var(--gold)}
  .jobcard-top{display:flex;justify-content:space-between;align-items:flex-start}
  .jc-name{font-weight:700;font-size:15px}
  .jc-sub{font-size:12px;color:var(--muted);margin-top:1px}
  .chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--card2);color:var(--muted);margin-right:5px}

/* ==== GRANDPRIDE UPPERCASE (visual) ==== */
body, input, select, textarea, button, .tile, .card, h1,h2,h3,h4,label{ text-transform:uppercase; }
/* keep these lowercase-sensitive: email, password, url, phone, links, code */
input[type="email"], input[type="password"], input[type="url"], input[type="tel"],
input[type="number"], input[type="date"], input[type="time"], input[type="file"],
input[inputmode="email"], input[inputmode="tel"], input[inputmode="url"],
a, code, .no-upper, .keep-case, .email, .url{ text-transform:none !important; }
/* placeholders read nicer in normal case */
::placeholder{ text-transform:none; }

</style>
</head>
<body>

<a class="hubback" href="index.html">‹ Hub</a>

<div id="gate" class="gate hidden">
  <div class="box">
    <div id="gateLogo"></div>
    <h3 style="color:var(--gold);letter-spacing:.1em">GP JOBS</h3>
    <p class="muted" style="font-size:13px">Open this from inside the Hub while signed in.</p>
    <button class="btn sec" onclick="location.href='index.html'" style="margin-top:14px">‹ Back to Hub</button>
  </div>
</div>

<div class="wrap">
  <div class="head">
    <div class="lg" id="topLogo"></div>
    <small>GP JOBS</small>
  </div>

  <div class="tabs" id="stageTabs">
    <div class="tab on" data-f="active" onclick="setFilter('active')">Active</div>
    <div class="tab" data-f="booked" onclick="setFilter('booked')">Booked</div>
    <div class="tab" data-f="delivered" onclick="setFilter('delivered')">Out now</div>
    <div class="tab" data-f="returned" onclick="setFilter('returned')">Returned</div>
    <div class="tab" data-f="deposit" onclick="setFilter('deposit')">Deposit due</div>
    <div class="tab" data-f="stuff" onclick="setFilter('stuff')">Car stuff</div>
    <div class="tab" data-f="done" onclick="setFilter('done')">Done</div>
    <div class="tab" data-f="customers" onclick="setFilter('customers')">Customers</div>
  </div>

  <div class="search">
    <i class="ti ti-search"></i>
    <input id="searchBox" placeholder="Search customer, car, job…" oninput="render()">
  </div>

  <div id="listArea"></div>
  <div id="listEmpty" class="muted hidden" style="text-align:center;padding:40px 0"></div>
</div>

<button class="fab" id="addFab" onclick="newJob()" aria-label="New job">+</button>

<div id="modalHost"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gp-cars.js"></script>

/* compress an image in-browser (cap long edge, JPEG re-encode) before upload */
function compressImage(file, maxEdge, quality){
  maxEdge=maxEdge||1200; quality=quality||0.8;
  return new Promise(function(resolve){
    if(!file || !/^image\//.test(file.type) || /gif/i.test(file.type)){ resolve(file); return; }
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=function(){
      let w=img.naturalWidth, h=img.naturalHeight;
      if(Math.max(w,h)>maxEdge){ const s=maxEdge/Math.max(w,h); w=Math.round(w*s); h=Math.round(h*s); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(url);
      cv.toBlob(function(blob){
        if(!blob || blob.size>=file.size){ resolve(file); return; }
        resolve(new File([blob],(file.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'}));
      },'image/jpeg',quality);
    };
    img.onerror=function(){ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
async function imgbbUpload(file){
  file=await compressImage(file,1200,0.8);
  const fd=new FormData(); fd.append('image',file);
  const r=await fetch('https://api.imgbb.com/1/upload?key='+IMGBB_KEY,{method:'POST',body:fd});
  const j=await r.json(); return (j&&j.data&&j.data.url)?j.data.url:null;
}
// convert "9:00 AM" (or "09:00") -> "09:00" for the native time picker
function to24(s){
  if(!s) return '';
  s=String(s).trim();
  let m=s.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?$/i);
  if(!m) return /^\d{1,2}:\d{2}$/.test(s)?s:'';
  let h=parseInt(m[1],10), min=m[2], ap=(m[3]||'').toUpperCase();
  if(ap==='PM'&&h<12) h+=12;
  if(ap==='AM'&&h===12) h=0;
  return String(h).padStart(2,'0')+':'+min;
}
// convert "09:00" -> "9:00 AM" for saving/display
function to12(s){
  if(!s) return '';
  let m=String(s).match(/^(\d{1,2}):(\d{2})$/);
  if(!m) return s;
  let h=parseInt(m[1],10), min=m[2], ap=h>=12?'PM':'AM';
  h=h%12; if(h===0) h=12;
  return h+':'+min+' '+ap;
}

/* =====================================================================
   WhatsApp booking parser — reads a pasted booking message and returns
   a partial job draft. Handles: car rental / leasing / subscription /
   LTO, chauffeur, bodyguard, hire driver. Best-effort: fills what it can
   confidently read; leaves the rest for manual review.
   ===================================================================== */
function wpNum(s){ if(s==null) return null; const m=String(s).replace(/,/g,'').match(/-?\d+(\.\d+)?/); return m?parseFloat(m[0]):null; }
function wpClean(s){ return String(s==null?'':s).replace(/\u202a|\u202c|\u2066|\u2069/g,'').trim(); }
// grab the value after a label on the same line, e.g. "Customer: Ali" -> "Ali"
function wpField(text, labels){
  const lines=text.split(/\r?\n/);
  for(const lab of labels){
    const re=new RegExp('^\\s*'+lab+'\\s*[:：]\\s*(.+)$','i');
    for(const ln of lines){ const m=ln.match(re); if(m && wpClean(m[1])) return wpClean(m[1]); }
  }
  return '';
}
// detect service type from the header / keywords
function wpDetectType(text){
  const t=text.toLowerCase();
  if(/\bhire\s*driver\b|\bhire\s*a?\s*driver\b/.test(t)) return 'hire_driver';
  if(/\bbody\s*guard\b|\bunarmed\s*bg\b|\barmed\s*bg\b|\b\d+\s*bg\b/.test(t)) return 'bodyguard';
  if(/\bsubscription\b/.test(t)) return 'subscription';
  if(/\blease\s*to\s*own\b|\blto\b/.test(t)) return 'lto';
  if(/\bchauffeur\b|\bchauffuer\b/.test(t)) return 'chauffeur';
  if(/\bcar\s*rental\b|\bcar\s*leasing\b|\bcar\s*rental\s*\/\s*car\s*leasing\b/.test(t)) return 'rental';
  if(/\bairport\b/.test(t)) return 'airport';
  if(/\bpick\s*up\b|\bdrop\s*off\b/.test(t)) return 'pickup_dropoff';
  if(/\bcar\s*model\b/.test(t)) return 'rental';
  return 'rental';
}
// parse a date token like 23/8/26 or 13/8/26 or "11 August 2026" -> YYYY-MM-DD
function wpDate(tok){
  if(!tok) return '';
  tok=wpClean(tok);
  let m=tok.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);
  if(m){
    let d=+m[1], mo=+m[2], y=+m[3]; if(y<100) y+=2000;
    if(d>0&&d<32&&mo>0&&mo<13) return y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  }
  const months={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
  m=tok.match(/(\d{1,2})\s+([a-z]+)\s+(\d{4})/i);
  if(m && months[m[2].toLowerCase()]){ return m[3]+'-'+String(months[m[2].toLowerCase()]).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0'); }
  return '';
}
// parse a time token like 12pm, 11am, 1130pm, 12:30am, 8:30 AM -> "9:00 AM"
function wpTime(tok){
  if(!tok) return '';
  tok=wpClean(tok).toLowerCase();
  // prefer an explicit H:MM form first
  let m=tok.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(am|pm)?/);
  if(m){
    let h=+m[1], min=+m[2], ap=(m[3]||'').toUpperCase();
    if(!ap){ ap=h>=12?'PM':'AM'; }
    h=h%12; if(h===0) h=12;
    return h+':'+String(min).padStart(2,'0')+' '+ap;
  }
  // compact form: 12pm, 11am, 830pm, 1130pm (digits then am/pm, no colon)
  m=tok.match(/(\d{1,4})\s*(am|pm)/);
  if(m){
    let digits=m[1], ap=m[2].toUpperCase(), h, min=0;
    if(digits.length<=2){ h=+digits; }                    // 12pm, 8pm
    else if(digits.length===3){ h=+digits.slice(0,1); min=+digits.slice(1); } // 830 -> 8:30
    else { h=+digits.slice(0,2); min=+digits.slice(2); }  // 1130 -> 11:30
    if(min>59) min=0;
    h=h%12; if(h===0) h=12;
    return h+':'+String(min).padStart(2,'0')+' '+ap;
  }
  return '';
}

function parseWhatsApp(raw){
  const text=wpClean(raw).replace(/\u00a0/g,' ');
  const d={ _matched:[], source_text:raw };
  d.service_type=wpDetectType(text);

  // customer + contact
  d.customer_name = wpField(text,['customer','name','pic','client']) || '';
  if(/^name$/i.test(d.customer_name)) d.customer_name='';
  let contact = wpField(text,['contact','cell phone','phone','tel','hp']) || '';
  // contact line sometimes has a handle + number: pull the number-ish part but keep +/spaces
  const cm=contact.match(/(\+?\d[\d\s\-]{6,}\d)/); if(cm) contact=wpClean(cm[1]);
  d.customer_contact = contact;

  // invoice-to / company
  d.invoice_to = wpField(text,['inv to','inv','invoice to','invoice','bill to']) || '';
  // referral
  d.referral = wpField(text,['referral','referred by','ref']) || '';
  // location
  d.location = wpField(text,['location','pick up location','pickup','pick-up','pick up']) || '';

  // car model (+ try to split a plate off the end)
  let carModel = wpField(text,['car model','model','vehicle']) || '';
  d.car_model_text = carModel;
  if(carModel){
    // plate heuristic: trailing token, letters+digits(+optional letter).
    // Malaysian plates: 1-4 leading letters, digits, optional trailing letter (VFH7678, WABC123, AGH30, PRP169, WLTO456).
    const pm=carModel.match(/\b([A-Z]{1,4}\s?\d{1,4}\s?[A-Z]?)\s*$/i);
    if(pm){ d.car_plate_text=wpClean(pm[1]).replace(/\s+/g,'').toUpperCase(); d.car_model_text=wpClean(carModel.slice(0,pm.index)); }
  }

  // ----- dates -----
  // a "Date:" line may hold a range "23/8/26 12pm - 24/8/26 12:30am"
  const dateLine = wpField(text,['date','start date','duration','period','pickup date','pick up date','lease to own start date','lto start date']) || '';
  // also a Start date line for subscriptions "13/8/26 - 13/9/26"
  const startLine = wpField(text,['start date','pickup date','pick up date','lease to own start date','lto start date']) || dateLine;
  // split range on dash variants
  const parts=(startLine||dateLine).split(/\s*[-–—]\s*/);
  // Compact range like "22-24/8/26" or "22 - 24/8/26 4pm": the first part is a bare
  // day that shares the second part's month/year. Backfill it so the start date parses.
  if(parts.length===2 && /^\s*\d{1,2}\s*$/.test(parts[0])){
    const em=wpClean(parts[1]).match(/\/\s*(\d{1,2})\s*\/\s*(\d{2,4})/);
    if(em){ parts[0]=wpClean(parts[0]).trim()+'/'+em[1]+'/'+em[2]; }
  }
  if(parts[0]){ d.start_date=wpDate(parts[0]); const t=wpTime(parts[0]); if(t) d.start_time=t; }
  if(parts[1]){ d.end_date=wpDate(parts[1]); const t=wpTime(parts[1]); if(t) d.end_time=t; }
  // an explicit End date line (chauffeur/rental use separate start+end lines)
  const endLine = wpField(text,['end date']) || '';
  if(endLine){ const ed=wpDate(endLine); if(ed) d.end_date=ed; const et=wpTime(endLine); if(et) d.end_time=et; }
  // separate Time line (BG / driver / pickup time)
  const tLine=wpField(text,['time','pick up time','pickup time','start time']);
  if(tLine){ const t=wpTime(tLine); if(t) d.start_time=t; }

  // ----- money -----
  const rate  = wpNum(wpField(text,['rate','rental','leasing price','price']));
  const dep   = wpNum(wpField(text,['deposit']));
  const total = wpNum(wpField(text,['grand total','total','grand'])); 
  if(rate!=null) d.price=rate;
  if(dep!=null) d.deposit_amount=dep;
  if(total!=null) d.grand_total=total;
  // if no explicit rate but total exists, use total as price
  if(d.price==null && total!=null) d.price=total;

  // ----- mileage / per-km -----
  const mil = wpNum(wpField(text,['mileage given','mileage','km given']));
  if(mil!=null) d.mileage_given=mil;
  const pk  = wpNum(wpField(text,['per km exceed','per km','per-km','exceed']));
  if(pk!=null) d.per_km_exceed=pk;

  // ----- OT + hours (BG / driver / chauffeur) -----
  const ot = wpField(text,['ot','overtime']);
  const otn = wpNum(ot); if(otn!=null && /hour|hr|\/\s*hour/i.test(ot+text)) d.ot_rate=otn;
  const hrsM = text.match(/(\d+(?:\.\d+)?)\s*hours?\b/i); if(hrsM) d.duration_hours=parseFloat(hrsM[1]);

  // ----- pickup / drop-off locations (chauffeur, pickup/dropoff, airport) -----
  const puLoc = wpField(text,['pickup location','pick up location','pick-up location','pickup','pick up','from']) || '';
  const doLoc = wpField(text,['drop off location','dropoff location','drop-off location','drop off','dropoff','drop-off','to','destination']) || '';
  if(puLoc) d.pickup_location=puLoc;
  if(doLoc) d.dropoff_location=doLoc;
  // standby location (bodyguard / hire driver)
  const sbLoc = wpField(text,['standby location','stand by location','standby','stand by']) || '';
  if(sbLoc) d.pickup_location=sbLoc;

  // ----- rental: how many days -----
  const days = wpNum(wpField(text,['how many days','days','duration days','no of days','number of days']));
  if(days!=null) d.rental_days=days;
  // pickup mode / delivery — template offers "office / deliver", SA deletes one.
  // If BOTH words remain (SA forgot to delete), leave blank for manual pick.
  const puModeRaw = (wpField(text,['pickup mode','pick up mode','pick up or deliver','collect or deliver','pickup or deliver'])||'').toLowerCase();
  if(puModeRaw){
    const hasOffice=/office|collect|pick\s*up/.test(puModeRaw), hasDeliver=/deliver/.test(puModeRaw);
    if(hasDeliver && !hasOffice) d.pickup_mode='deliver';
    else if(hasOffice && !hasDeliver) d.pickup_mode='office';
    // both present -> leave undefined (manual)
  }
  const delCharge = wpNum(wpField(text,['delivery charge','delivery fee','deliver charge']));
  if(delCharge!=null){ d.delivery_charge=delCharge; if(!d.pickup_mode) d.pickup_mode='deliver'; }
  const delTripRaw=(wpField(text,['trip','delivery trip'])||'').toLowerCase();
  if(delTripRaw){
    const hasSingle=/single|one/.test(delTripRaw), hasRound=/round/.test(delTripRaw);
    if(hasRound && !hasSingle) d.delivery_trip='round';
    else if(hasSingle && !hasRound) d.delivery_trip='single';
    // both present -> leave undefined (manual)
  }

  // ----- subscription -----
  const subMon = wpField(text,['subscription month','subscription months','sub month','sub months','months','tenure']);
  if(subMon){ const n=wpNum(subMon); if(n!=null) d.subscription_months=String(n); }
  const rateMon = wpNum(wpField(text,['rate per month','rate per monthly','monthly rate','rate monthly','per month','monthly']));
  if(rateMon!=null) d.rate_monthly=rateMon;
  const subFee = wpNum(wpField(text,['subscription fee','sub fee','joining fee']));
  if(subFee!=null) d.subscription_fee=subFee;

  // ----- lease to own -----
  const ltoMon = wpField(text,['lease to own month','lease to own months','lto month','lto months','lease month','lease months']);
  if(ltoMon){ const n=wpNum(ltoMon); if(n!=null) d.lto_months=String(n); }
  const down = wpNum(wpField(text,['downpayment','down payment','deposit downpayment']));
  if(down!=null) d.downpayment=down;
  const safety = wpNum(wpField(text,['safety fee','safety deposit']));
  if(safety!=null) d.safety_fee=safety;
  const insFee = wpNum(wpField(text,['insurance fee','insurance']));
  if(insFee!=null) d.insurance_fee=insFee;
  const rtax = wpNum(wpField(text,['roadtax','road tax']));
  if(rtax!=null) d.roadtax=rtax;

  // ----- remark: keep the whole original message so nothing is lost -----
  // pull an explicit Remark: block if present
  const remIdx=text.search(/^\s*remark\s*[:：]/im);
  if(remIdx>=0){ d.remark_extra=wpClean(text.slice(remIdx).replace(/^\s*remark\s*[:：]?/i,'')); }

  return d;
}


async function boot(){
  const logo=window.__LOGO__||'';
  if(logo){ $('topLogo').innerHTML='<img src="'+logo+'">'; $('gateLogo').innerHTML='<img src="'+logo+'">'; }
  let session=null;
  for(let i=0;i<12;i++){ const {data}=await sb.auth.getSession(); if(data&&data.session){session=data.session;break;} await new Promise(r=>setTimeout(r,200)); }
  if(!session){ $('gate').classList.remove('hidden'); return; }
  ME=(session.user&&session.user.email)||'';
  await loadAll();
  // if we returned from the checklist with ?open=<jobid>, jump straight into that job
  try{
    const openId=new URLSearchParams(location.search).get('open');
    if(openId && JOBS.find(x=>x.id===openId)){ openJob(openId); }
  }catch(e){}
}
async function loadAll(){
  const [j,c,f,d,cl]=await Promise.all([
    sb.from('gp_jobs').select('*').order('start_date',{ascending:false}),
    sb.from('gp_customers').select('*').order('name',{ascending:true}),
    sb.from('gp_fleet').select('id,plate,model,status').order('plate',{ascending:true}),
    sb.from('gp_staff').select('username,name,is_chauffeur,can_drive').order('name',{ascending:true}),
    sb.from('gp_checklists').select('id,job_id,car_type,diagram_w,diagram_h,out_sig_inspector,out_sig_customer,in_sig_inspector,in_sig_customer,in_defects,customer_signed_at')
  ]);
  JOBS=j.data||[]; CUSTOMERS=c.data||[]; FLEET=f.data||[]; CHECKLISTS=cl.data||[];
  DRIVERS=(d.data||[]).filter(s=>s.is_chauffeur||s.can_drive);
  render();
}

function setFilter(f){ FILTER=f; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.f===f)); render(); }

function render(){
  const q=($('searchBox').value||'').toLowerCase().trim();
  if(FILTER==='customers'){ renderCustomers(q); return; }
  $('addFab').style.display='';
  let list=JOBS.slice();
  if(FILTER==='active') list=list.filter(j=>!['done','cancelled'].includes(j.stage));
  else if(FILTER==='booked') list=list.filter(j=>['booked','paid'].includes(j.stage));
  else if(FILTER==='delivered') list=list.filter(j=>j.stage==='delivered');
  else if(FILTER==='returned') list=list.filter(j=>j.stage==='returned');
  else if(FILTER==='deposit') list=list.filter(j=>j.stage==='returned' && num(j.deposit_amount)>0 && num(j.deposit_returned)===0);
  else if(FILTER==='stuff') list=list.filter(j=>Array.isArray(j.car_items) && j.car_items.length>0 && !j.car_items_returned);
  else if(FILTER==='done') list=list.filter(j=>['done','deposit_settled','cancelled'].includes(j.stage));
  if(q) list=list.filter(j=>((j.customer_name||'')+' '+(j.car_model||'')+' '+(j.car_plate||'')+' '+(j.job_no||'')).toLowerCase().includes(q));

  $('listEmpty').classList.toggle('hidden', list.length>0);
  if(!list.length) $('listEmpty').textContent='No jobs here.';
  $('listArea').innerHTML=list.map(jobCard).join('');
}

function jobCard(j){
  const stageIdx=STAGES.indexOf(j.stage);
  const bar=STAGES.slice(0,5).map((s,i)=>`<div class="s ${stageIdx>=i?'done':''}"></div>`).join('');
  const pay = j.payment_status==='paid'?'<span class="chip" style="color:#7fe0a0">paid</span>'
    : num(j.paid_amount)>0?`<span class="chip" style="color:#e0b060">bal RM ${jobBalance(j).toLocaleString()}</span>`
    : '<span class="chip" style="color:#ffb3a6">unpaid</span>';
  const depDue = (j.stage==='returned' && num(j.deposit_amount)>0 && num(j.deposit_returned)===0)?'<span class="chip" style="color:#e0b060">deposit due</span>':'';
  // damage settlement status (returned jobs with new damage)
  let dmgChip='';
  if(j.stage==='returned'){
    const hasDmg=Array.isArray(j.damages)&&j.damages.length>0;
    if(hasDmg && !j.damage_customer_agreed) dmgChip='<span class="chip" style="color:#ffb3a6">awaiting agree</span>';
    else if(hasDmg && j.damage_customer_agreed && num(j.deposit_returned)===0) dmgChip='<span class="chip" style="color:#7fe0a0">repair agreed</span>';
  }
  const stuffChip = (Array.isArray(j.car_items)&&j.car_items.length>0&&!j.car_items_returned)?'<span class="chip" style="color:#ffcf8f">⚠ car stuff</span>':'';
  return `<div class="card" onclick="openJob('${j.id}')">
    <div class="jobcard-top">
      <div>
        <div class="jc-name">${esc(j.customer_name||'—')}</div>
        <div class="jc-sub">${esc(svcLabel(j.service_type))}${j.car_plate?' · '+esc(j.car_plate):''}</div>
      </div>
      <span class="pill st-${j.stage}">${STAGE_LABEL[j.stage]||j.stage}</span>
    </div>
    <div class="stagebar">${bar}</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="muted" style="font-size:13px">${fmtDate(j.start_date)}${j.end_date?' → '+fmtDate(j.end_date):''}</span>
      <span>${pay}${depDue}${dmgChip}${stuffChip}</span>
    </div>
  </div>`;
}

function renderCustomers(q){
  $('addFab').style.display='';
  let list=CUSTOMERS.slice();
  if(q) list=list.filter(c=>((c.name||'')+' '+(c.contact||'')).toLowerCase().includes(q));
  $('listEmpty').classList.toggle('hidden', list.length>0);
  if(!list.length) $('listEmpty').textContent='No customers yet.';
  $('listArea').innerHTML=list.map(c=>{
    const jobs=JOBS.filter(j=>j.customer_id===c.id).length;
    return `<div class="card" onclick="editCustomer('${c.id}')">
      <div class="jobcard-top">
        <div>
          <div class="jc-name">${esc(c.name)}${c.is_returning?' <span class="chip" style="color:#7fa8e0">returning</span>':''}</div>
          <div class="jc-sub">${esc(c.contact||'')}${c.cust_type==='company'?' · company':''}</div>
        </div>
        <span class="muted" style="font-size:13px">${jobs} job${jobs===1?'':'s'}</span>
      </div>
    </div>`;
  }).join('');
}

async function saveCustomer(id){
  const co=$('c_type').value==='company';
  const name=$('c_name').value.trim().toUpperCase();
  if(!name){ toast('Name required'); return; }
  const row={
    cust_type:$('c_type').value, name, contact:$('c_contact').value||null, email:$('c_email').value||null,
    nric: co?null:(($('c_idno').value||'').toUpperCase()||null), company_reg: co?(($('c_idno').value||'').toUpperCase()||null):null,
    address:($('c_address').value||'').toUpperCase()||null, is_returning:$('c_returning').checked, updated_at:new Date().toISOString()
  };
  let res;
  if(id){ res=await sb.from('gp_customers').update(row).eq('id',id); }
  else { res=await sb.from('gp_customers').insert(row); }
  if(res.error){ toast('Save failed: '+res.error.message); return; }
  toast(id?'Customer updated ✓':'Customer added ✓'); closeModal(); await loadAll();
}
async function delCustomer(id){
  if(!confirm('Delete this customer? Their jobs stay but lose the link.')) return;
  const res=await sb.from('gp_customers').delete().eq('id',id);
  if(res.error){ toast('Failed'); return; }
  toast('Deleted'); closeModal(); await loadAll();
}

    <h3>Paste from WhatsApp</h3>
    <p class="muted" style="font-size:13px;margin:0 0 10px">Paste the booking message. I'll read the details and fill the form for you to review.</p>
    <textarea id="wp_paste" style="min-height:200px" placeholder="Paste the whole WhatsApp booking message here…"></textarea>
    <button class="btn" style="margin-top:12px" onclick="applyPaste()"><i class="ti ti-wand"></i> Read details</button>
    <button class="btn sec" style="margin-top:8px" onclick="jobForm()">Cancel</button>
  `);
  setTimeout(()=>{ const t=$('wp_paste'); if(t) t.focus(); },50);
}
function applyPaste(){
  const raw=($('wp_paste')&&$('wp_paste').value||'').trim();
  if(!raw){ toast('Paste a message first'); return; }
  const d=parseWhatsApp(raw);
  // merge into draft (keep any existing customer already chosen)
  JOB_DRAFT.service_type = d.service_type || JOB_DRAFT.service_type || 'rental';
  if(d.car_model_text) JOB_DRAFT.car_model_text = d.car_model_text;
  if(d.car_plate_text) JOB_DRAFT.car_plate_text = d.car_plate_text;
  // try to auto-match a fleet car by plate (strongest) then loose model match
  (function(){
    const plate=(d.car_plate_text||'').replace(/\s+/g,'').toLowerCase();
    let car=null;
    if(plate) car=FLEET.find(f=>(f.plate||'').replace(/\s+/g,'').toLowerCase()===plate);
    if(!car && d.car_model_text){
      const mt=d.car_model_text.toLowerCase();
      car=FLEET.find(f=>{ const fm=(f.model||'').toLowerCase(); return fm && (fm.includes(mt)||mt.includes(fm)); });
    }
    if(car){ JOB_DRAFT.fleet_id=car.id; JOB_DRAFT._manual_car=false; }
    else if(d.car_model_text||d.car_plate_text){
      // no fleet match — open manual car entry prefilled, will auto-add to fleet on save
      JOB_DRAFT._manual_car=true;
      JOB_DRAFT.car_model=d.car_model_text||'';
      JOB_DRAFT.car_plate=d.car_plate_text||'';
    }
  })();
  if(d.start_date) JOB_DRAFT.start_date=d.start_date;
  if(d.start_time) JOB_DRAFT.start_time=d.start_time;
  if(d.end_date) JOB_DRAFT.end_date=d.end_date;
  if(d.end_time) JOB_DRAFT.end_time=d.end_time;
  if(d.price!=null) JOB_DRAFT.price=d.price;
  if(d.deposit_amount!=null) JOB_DRAFT.deposit_amount=d.deposit_amount;
  if(d.grand_total!=null) JOB_DRAFT.grand_total=d.grand_total;
  if(d.mileage_given!=null) JOB_DRAFT.mileage_given=d.mileage_given;
  if(d.per_km_exceed!=null) JOB_DRAFT.per_km_exceed=d.per_km_exceed;
  if(d.ot_rate!=null) JOB_DRAFT.ot_rate=d.ot_rate;
  if(d.duration_hours!=null) JOB_DRAFT.duration_hours=d.duration_hours;
  if(d.invoice_to) JOB_DRAFT.invoice_to=d.invoice_to;
  if(d.referral) JOB_DRAFT.referral=d.referral;
  if(d.location) JOB_DRAFT.location=d.location;
  if(d.pickup_location) JOB_DRAFT.pickup_location=d.pickup_location;
  if(d.dropoff_location) JOB_DRAFT.dropoff_location=d.dropoff_location;
  if(d.rental_days!=null) JOB_DRAFT.rental_days=d.rental_days;
  if(d.pickup_mode) JOB_DRAFT.pickup_mode=d.pickup_mode;
  if(d.delivery_charge!=null) JOB_DRAFT.delivery_charge=d.delivery_charge;
  if(d.delivery_trip) JOB_DRAFT.delivery_trip=d.delivery_trip;
  if(d.subscription_months) JOB_DRAFT.subscription_months=d.subscription_months;
  if(d.rate_monthly!=null) JOB_DRAFT.rate_monthly=d.rate_monthly;
  if(d.subscription_fee!=null) JOB_DRAFT.subscription_fee=d.subscription_fee;
  if(d.lto_months) JOB_DRAFT.lto_months=d.lto_months;
  if(d.downpayment!=null) JOB_DRAFT.downpayment=d.downpayment;
  if(d.safety_fee!=null) JOB_DRAFT.safety_fee=d.safety_fee;
  if(d.insurance_fee!=null) JOB_DRAFT.insurance_fee=d.insurance_fee;
  if(d.roadtax!=null) JOB_DRAFT.roadtax=d.roadtax;
  JOB_DRAFT.source_text=raw;
  // remark: keep whole original message so nothing is lost
  JOB_DRAFT.remark = raw;
  // try to match an existing customer by name/contact; else stash for quick-add
  const nm=(d.customer_name||'').toLowerCase().trim();
  const ct=(d.customer_contact||'').replace(/[^0-9]/g,'');
  let match=null;
  if(nm) match=CUSTOMERS.find(c=>(c.name||'').toLowerCase().trim()===nm);
  if(!match && ct) match=CUSTOMERS.find(c=>((c.contact||'').replace(/[^0-9]/g,''))===ct && ct.length>=7);
  if(match){
    JOB_DRAFT.customer_id=match.id; JOB_DRAFT.customer_name=match.name; JOB_DRAFT.customer_contact=match.contact||'';
    toast('Matched customer: '+match.name);
    jobForm();
  } else if(d.customer_name){
    // no match — offer to create this customer
    JOB_DRAFT._pendingCust={name:d.customer_name, contact:d.customer_contact||''};
    confirmNewCustomer();
  } else {
    toast('Details read — choose a customer');
    jobForm();
  }
}
function confirmNewCustomer(){
  const p=JOB_DRAFT._pendingCust||{};
  showModal(`
    <button class="x" onclick="jobForm()">×</button>
    <h3>New customer from message</h3>
    <p class="muted" style="font-size:13px;margin:0 0 10px">Not found in your list. Add as a new customer?</p>
    <label>Name</label><input id="pc_name" value="${esc(p.name||'')}">
    <label>Contact</label><input id="pc_contact" value="${esc(p.contact||'')}">
    <button class="btn" style="margin-top:12px" onclick="savePastedCustomer()"><i class="ti ti-user-plus"></i> Add + use</button>
    <button class="btn sec" style="margin-top:8px" onclick="jobForm()">Skip — I'll choose</button>
  `);
}
async function savePastedCustomer(){
  const name=($('pc_name').value||'').trim().toUpperCase(); if(!name){ toast('Name required'); return; }
  const contact=($('pc_contact').value||'').trim()||null;
  const row={cust_type:'individual',name,contact};
  const res=await sb.from('gp_customers').insert(row).select().single();
  if(res.error){ toast('Failed: '+res.error.message); return; }
  CUSTOMERS.push(res.data);
  JOB_DRAFT.customer_id=res.data.id; JOB_DRAFT.customer_name=res.data.name; JOB_DRAFT.customer_contact=res.data.contact||'';
  delete JOB_DRAFT._pendingCust;
  toast('Customer added ✓'); jobForm();
}
function reopenJobForm(){ jobForm(); }

function jobFieldsHtml(sv,j){ return (SERVICE_FIELDS[sv]||SERVICE_FIELDS.rental).map(k=>fieldHtml(k,j)).join(''); }

function toggleOtherMonths(selId,otherId){ const s=$(selId),o=$(otherId); if(!s||!o)return; o.style.display=(s.value==='other')?'block':'none'; }
function togglePickupMode(){ const m=$('j_pickup_mode'); const b=$('deliverBox'); if(m&&b) b.style.display=(m.value==='deliver')?'block':'none'; }

async function saveJob(){
  const j=JOB_DRAFT;
  if(!j.customer_id){ toast('Choose a customer first'); return; }
  const sv=$('j_service').value;
  const gv=(id)=>{ const el=$(id); return el?el.value:undefined; };            // undefined if field not shown
  const gnum=(id)=>{ const v=gv(id); return v===undefined?undefined:(num(v)||null); };
  const fleetSel=gv('j_fleet');
  const drvUser=gv('j_driver')||null;
  const drv=DRIVERS.find(d=>d.username===drvUser);
  // subscription months (dropdown or "other")
  let subM=gv('j_sub_months'); if(subM==='other') subM=gv('j_sub_months_other')||null;
  // resolve the car: existing fleet pick, or a manually-typed car that we auto-add to fleet
  let carResolved={fleet_id:null, model:null, plate:null};
  if(serviceHasCar(sv)){
    if(fleetSel==='__manual__'){
      const model=(gv('j_car_model')||'').trim();
      const plate=(gv('j_car_plate')||'').trim().toUpperCase();
      const ctype=gv('j_car_type')||'sedan';
      if(plate){
        // reuse if this plate already exists in fleet, else create it
        let existing=FLEET.find(f=>(f.plate||'').toUpperCase()===plate);
        if(!existing){
          const ins=await sb.from('gp_fleet').insert({plate:plate, model:model||plate, car_type:ctype, status:'ready', changed_by:ME, remark:'Auto-added from GP Jobs'}).select().single();
          if(ins.error){ toast('Fleet add failed: '+ins.error.message); return; }
          existing=ins.data; FLEET.push(existing);
          toast('New car added to Fleet ✓');
        }
        carResolved={fleet_id:existing.id, model:existing.model||model||plate, plate:existing.plate};
      } else {
        // model typed but no plate — store text only, no fleet row
        carResolved={fleet_id:null, model:model||null, plate:null};
      }
    } else if(fleetSel){
      const car=FLEET.find(f=>f.id===fleetSel);
      carResolved={fleet_id:fleetSel, model:car?car.model:null, plate:car?car.plate:null};
    }
  }
  const row={
    customer_id:j.customer_id, customer_name:j.customer_name, customer_contact:j.customer_contact||null,
    service_type:sv, service_desc:svcLabel(sv),
    source_text:JOB_DRAFT.source_text||null, updated_at:new Date().toISOString()
  };
  // only set keys whose fields are present in this service's form
  const set=(k,v)=>{ if(v!==undefined) row[k]=v; };
  set('fleet_id', serviceHasCar(sv)?carResolved.fleet_id:null);
  set('car_model', serviceHasCar(sv)?carResolved.model:null);
  set('car_plate', serviceHasCar(sv)?carResolved.plate:null);
  set('start_date', gv('j_start_date')||null);
  set('start_time', gv('j_start_time')!==undefined?(to12(gv('j_start_time'))||null):undefined);
  set('end_date', gv('j_end_date')||null);
  set('end_time', gv('j_end_time')!==undefined?(to12(gv('j_end_time'))||null):undefined);
  set('driver_username', drvUser); set('driver_name', drv?drv.name:null);
  set('price', gnum('j_price')); set('deposit_amount', gnum('j_deposit'));
  set('grand_total', gnum('j_total'));
  set('invoice_to', gv('j_invoice')!==undefined?((gv('j_invoice')||'').toUpperCase()||null):undefined);
  set('mileage_given', gnum('j_mileage')); set('per_km_exceed', gnum('j_perkm'));
  set('ot_rate', gnum('j_ot')); set('duration_hours', gnum('j_hours'));
  set('rental_days', gnum('j_days'));
  set('pickup_location', gv('j_pickup_loc')!==undefined?(gv('j_pickup_loc')||null):undefined);
  set('dropoff_location', gv('j_dropoff_loc')!==undefined?(gv('j_dropoff_loc')||null):undefined);
  set('location', gv('j_location')!==undefined?(gv('j_location')||null):undefined);
  set('referral', gv('j_referral')!==undefined?(gv('j_referral')||null):undefined);
  set('subscription_months', gv('j_sub_months')!==undefined?(subM||null):undefined);
  set('rate_monthly', gnum('j_rate_monthly')); set('subscription_fee', gnum('j_sub_fee'));
  set('lto_months', gv('j_lto_months')!==undefined?(gv('j_lto_months')||null):undefined);
  set('downpayment', gnum('j_downpayment')); set('safety_fee', gnum('j_safety_fee'));
  set('insurance_fee', gnum('j_insurance_fee')); set('roadtax', gnum('j_roadtax'));
  set('pickup_mode', gv('j_pickup_mode')!==undefined?(gv('j_pickup_mode')||null):undefined);

async function doExtend(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const newEnd=$('ext_end').value||null;
  const newTime=to12($('ext_time').value)||j.end_time||null;
  const charge=num($('ext_charge').value);
  const note=($('ext_note').value||'').trim();
  if(!newEnd){ toast('Pick the new end date'); return; }
  if(newEnd < (j.start_date||'')){ toast('End date is before start date'); return; }
  // days difference vs current end (for the log)
  let days=null;
  if(j.end_date){ const d=Math.round((new Date(newEnd)-new Date(j.end_date))/86400000); if(!isNaN(d)) days=d; }
  const hist=Array.isArray(j.extensions)?j.extensions.slice():[];
  hist.push({date:new Date().toISOString().slice(0,10), prev_end:j.end_date||null, new_end:newEnd, days:days, charge:charge, note:note||null});
  // extra charge adds to price → raises total & balance; if it was paid, re-flag as partial
  const newPrice=num(j.price)+charge;
  const newTotal=newPrice+num(j.deposit_amount);
  const paid=jobPaid(j);
  const upd={
    end_date:newEnd, end_time:newTime,
    price:newPrice,
    extensions:hist,
    payment_status: (paid>=newTotal?'paid':(paid>0?'partial':'unpaid')),
    updated_at:new Date().toISOString()
  };
  // if the job had advanced to 'paid' but now owes the extension, send it back to 'booked' so delivery re-locks
  if(charge>0 && j.stage==='paid' && paid<newTotal){ upd.stage='booked'; }
  const res=await sb.from('gp_jobs').update(upd).eq('id',id);
  if(res.error){ toast('Failed: '+res.error.message); return; }
  toast(charge>0?('Extended ✓ — +RM '+charge.toLocaleString()+' added to balance'):'Extended ✓');
  await loadAll(); openJob(id);
}

function lifecycleButton(j){
  if(j.stage==='booked'){
    const bal=jobBalance(j), paid=jobPaid(j);
    const balNote = paid>0
      ? `<div class="card" style="padding:11px;margin-bottom:8px"><div class="rowline"><span class="muted">Paid</span><span>RM ${paid.toLocaleString()}</span></div><div class="rowline"><span class="muted">Balance to collect</span><b style="color:var(--amber)">RM ${bal.toLocaleString()}</b></div></div>`
      : '';
    return balNote+
      `<button class="btn" onclick="markPaid('${j.id}')"><i class="ti ti-cash"></i> ${paid>0?'Record balance payment':'Record payment'}</button>
       <div class="hint" style="text-align:center;margin-top:8px">Deliver unlocks once fully paid (price + deposit)</div>
       <button class="btn danger" style="margin-top:10px" onclick="cancelDeal('${j.id}')"><i class="ti ti-x"></i> Customer cancelled deal</button>`;
  }
  if(j.stage==='paid'){
    // safety: even if stage says paid, if there's still a balance, block delivery
    if(jobBalance(j)>0){
      return `<div class="card" style="padding:11px;margin-bottom:8px"><div class="rowline"><span class="muted">Paid</span><span>RM ${jobPaid(j).toLocaleString()}</span></div><div class="rowline"><span class="muted">Balance to collect</span><b style="color:var(--amber)">RM ${jobBalance(j).toLocaleString()}</b></div></div>
      <button class="btn" onclick="markPaid('${j.id}')"><i class="ti ti-cash"></i> Pay balance</button>
      <div class="hint" style="text-align:center;margin-top:8px">${serviceHasCar(j.service_type)?'Deliver unlocks once fully paid':'Complete unlocks once fully paid'}</div>
      <button class="btn danger" style="margin-top:10px" onclick="cancelDeal('${j.id}')"><i class="ti ti-x"></i> Customer cancelled deal</button>`;
    }
    // no-car services (bodyguard, hire driver): no checklist/delivery — just complete the job
    if(!serviceHasCar(j.service_type)){
      return `<button class="btn" onclick="markDone('${j.id}')"><i class="ti ti-check"></i> Mark job done</button>
      <button class="btn danger" style="margin-top:10px" onclick="cancelDeal('${j.id}')"><i class="ti ti-x"></i> Customer cancelled deal</button>`;
    }
    // once the delivery checklist is done (customer signed, or at least inspector signed),
    // the QC-checklist button is redundant — show only Mark delivered.
    const signed = jobSigned(j);
    const done = jobChecklistDone(j);
    const qcBtn = done
      ? '' // checklist already done → hide the QC button
      : `<button class="btn sec" onclick="openChecklist('${j.id}','delivery')"><i class="ti ti-clipboard-check"></i> 1. QC checklist (delivery)</button>`;
    const deliverLabel = done ? `<i class="ti ti-car"></i> Mark delivered (car out)` : `<i class="ti ti-car"></i> 2. Mark delivered (car out)`;
    const deliverTop = done ? '' : 'style="margin-top:8px"';
    return `
    ${qcBtn}
    <button class="btn" ${deliverTop} onclick="markDelivered('${j.id}')">${deliverLabel}</button>
    <button class="btn danger" style="margin-top:10px" onclick="cancelDeal('${j.id}')"><i class="ti ti-x"></i> Customer cancelled deal</button>`;
  }
  if(j.stage==='delivered') return `<button class="btn" onclick="markReturned('${j.id}')"><i class="ti ti-arrow-back-up"></i> Mark returned</button>`;
  if(j.stage==='returned'){
    const returnDone = jobReturnChecklistDone(j);
    const qcBtn = returnDone ? '' : `<button class="btn sec" onclick="openChecklist('${j.id}','return')"><i class="ti ti-clipboard-check"></i> 1. QC checklist (return)</button>`;
    const settleBtn = j.damage_customer_agreed
      ? `<button class="btn" style="margin-top:8px" onclick="settleDeposit('${j.id}')"><i class="ti ti-receipt"></i> Settle deposit</button>`
      : `<button class="btn" style="margin-top:8px" disabled style="opacity:.5">Settle deposit (after customer agrees)</button>`;
    return qcBtn+settleBtn;
  }
  if(j.stage==='deposit_settled') return `<button class="btn" onclick="markDone('${j.id}')"><i class="ti ti-check"></i> Mark done</button>`;
  return '';
}

function jobTotal(j){ return num(j.price)+num(j.deposit_amount); }
function jobPaid(j){ return num(j.paid_amount); }
function jobBalance(j){ return Math.max(0, jobTotal(j)-jobPaid(j)); }

/* find the delivery checklist linked to this job (most recent that has a customer-sign step) */
function checklistFor(j){
  const list=(CHECKLISTS||[]).filter(c=>c.job_id===j.id);
  if(!list.length) return null;
  // prefer one that's been sent to customer / signed
  return list.find(c=>c.customer_signed_at) || list.find(c=>c.out_sig_inspector) || list[0];
}
/* true once the customer has signed the delivery checklist for this job */
function jobSigned(j){ const c=checklistFor(j); return !!(c && c.customer_signed_at); }
/* true once a delivery checklist has at least been done (inspector signed) */
function jobChecklistDone(j){ const c=checklistFor(j); return !!(c && (c.customer_signed_at || c.out_sig_inspector)); }
/* status card shown in job detail once a checklist exists */
function signStatusHtml(j){
  const c=checklistFor(j);
  if(!c) return '';
  if(c.customer_signed_at){
    return `<div class="card" style="padding:11px;margin-bottom:8px;border-left:3px solid var(--green)">
      <div class="rowline"><span class="muted">Customer signature</span><b style="color:var(--green)">Signed ✓</b></div>
      <div class="rowline"><span class="muted">Signed on</span><span>${fmtDate(c.customer_signed_at)}</span></div>
    </div>`;
  }
  if(c.out_sig_inspector){
    return `<div class="card" style="padding:11px;margin-bottom:8px;border-left:3px solid var(--amber)">
      <div class="rowline"><span class="muted">Customer signature</span><b style="color:var(--amber)">Waiting for customer…</b></div>
      <div class="hint" style="margin-top:4px">Sent for remote signing. Refresh to check.</div>
    </div>`;
  }
  return '';
}
function paymentHistoryHtml(j){
  let h=Array.isArray(j.payments)?j.payments:[];

  if(!h.length && jobPaid(j)>0){

}

async function doMarkPaid(id){
  const j=JOBS.find(x=>x.id===id);
  const add=num($('p_amount').value);
  if(add<=0){ toast('Enter an amount'); return; }
  const newPaid=jobPaid(j)+add;
  const total=jobTotal(j);
  const fullyPaid = newPaid>=total;
  // append this installment to the payment history
  const hist = Array.isArray(j.payments)?j.payments.slice():[];
  const isFirst = hist.length===0;
  hist.push({
    amount:add,
    date:$('p_date').value||new Date().toISOString().slice(0,10),
    slip:$('p_slip_url').value||null,
    note: isFirst ? 'Deposit / first payment' : (fullyPaid?'Final payment':'Part payment'),

  });

function dataUrlToBlob(dataUrl){
  const [head,b64]=dataUrl.split(','); const mime=(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}
async function uploadAndSendCheckin(id){
  const j=JOBS.find(x=>x.id===id);
  const chosen=CHECKIN.media.filter(m=>m._pick);
  if(!chosen.length){ toast('Pick at least one photo or video'); return; }
  const note=$('ci_note')?$('ci_note').value:'';
  const token=randToken();
  const prog=$('ciProgress');
  const uploaded=[]; let pc=0, vc=0;
  for(let i=0;i<chosen.length;i++){
    const m=chosen[i];
    if(prog) prog.textContent='Uploading '+(i+1)+'/'+chosen.length+'…';
    try{
      let blob, ext;
      if(m.file){ blob=m.file; ext=(m.file.name.match(/\.([a-z0-9]+)$/i)||[,''])[1]||(m.type==='video'?'mp4':'jpg'); }
      else if(m.dataUrl){ blob=dataUrlToBlob(m.dataUrl); ext='jpg'; }
      else continue;
      const path=token+'/'+(m.type)+'_'+String(i+1).padStart(2,'0')+'.'+ext;
      const up=await sb.storage.from('checkins').upload(path,blob,{contentType:blob.type||undefined,upsert:true});
      if(up.error) throw up.error;
      const url=sb.storage.from('checkins').getPublicUrl(path).data.publicUrl;
      uploaded.push({type:m.type,label:m.label||'',url:url});
      if(m.type==='video') vc++; else pc++;
    }catch(e){ if(prog) prog.textContent='Upload error: '+(e.message||e); return; }
  }
  // save the check-in record
  const rec={ share_token:token, job_id:j.id, fleet_id:j.fleet_id||null,
    customer_name:j.customer_name, car_model:j.car_model, car_plate:j.car_plate,
    stage:(j.stage==='returned'?'return':(j.stage==='delivered'?'delivery':'checkin')),
    note:note||null, media:uploaded, photo_count:pc, video_count:vc, created_by:ME };
  const ins=await sb.from('gp_checkins').insert(rec).select().single();
  if(ins.error){ if(prog) prog.textContent='Save failed: '+ins.error.message; return; }
  CHECKIN.saved={token:token, link:checkinBase()+'gp-checkin-view.html?t='+token, pc:pc, vc:vc, note:note, firstPhoto:uploaded.find(u=>u.type==='photo')};
  renderCheckinDone(j);
}

function damageList(j){ return Array.isArray(j.damages)?j.damages:[]; }
function damageCustomerTotal(j){ return damageList(j).reduce((s,d)=>s+num(d.price),0); }
function damageCostTotal(j){ return damageList(j).reduce((s,d)=>s+num(d.cost),0); }
function chargesTotal(j){ return damageCustomerTotal(j)+num(j.exceed_km_charge)+num(j.summons_charge); }
// settlement math: deduct from deposit first, charge only the excess
function settlement(j){
  const charges=chargesTotal(j);
  const dep=num(j.deposit_amount);
  const deducted=Math.min(charges, dep);
  const extra=Math.max(0, charges-dep);
  const refund=Math.max(0, dep-charges);
  return {charges, dep, deducted, extra, refund};
}

/* Build the damage & charges editor (shown in job detail for returned jobs) */
function damageEditor(j){
  const dmgs=damageList(j);
  const diagram=damageDiagram(j);
  const marks=returnMarks(j);
  const conditionSigned = jobReturnSigned(j);        // customer signed the return checklist (condition)
  const repairAgreed = j.damage_customer_agreed;     // customer signed/agreed the repair charges
  const rows=dmgs.map((d,i)=>`
    <div class="card" style="padding:10px;margin-bottom:8px">
      <div class="rowline"><b>${d.mark_no?('#'+d.mark_no+' · '):''}${esc(d.type||'Damage')}</b>${repairAgreed?'':`<button class="btn sec mini" onclick="editDamage('${j.id}',${i})">Edit</button>`}</div>
      <div class="muted" style="font-size:12px">${esc(d.loc||'(location not set)')}</div>
      <div class="rowline" style="margin-top:4px"><span class="muted">Cost (GP)</span><span>RM ${num(d.cost).toLocaleString()}</span></div>
      <div class="rowline"><span class="muted">Customer price</span><b>RM ${num(d.price).toLocaleString()}</b></div>
      ${d.note?`<div class="muted" style="font-size:12px;margin-top:2px">${esc(d.note)}</div>`:''}
    </div>`).join('');
  const s=settlement(j);
  const canSync = marks.length>dmgs.length;

  return `
    <div class="card" style="margin-top:12px">
      <h3>Return condition</h3>
      ${conditionSigned
        ? `<div class="rowline"><span class="muted">Customer signed condition</span><b style="color:var(--green)">Signed ✓</b></div>`
        : `<div class="rowline"><span class="muted">Return checklist signature</span><b style="color:var(--amber)">Not signed yet</b></div>
           <div class="hint" style="margin-top:4px">Do the return QC checklist and have the customer sign it first.</div>`}
    </div>
    <div class="card">
      <h3>New damage</h3>
      ${diagram?`<div style="margin-bottom:10px">${diagram}</div>`:'<div class="muted" style="font-size:13px;margin-bottom:8px">No damage marked on the return checklist diagram.</div>'}
      ${rows}
      ${canSync&&!repairAgreed?`<button class="btn sec" style="margin-top:4px" onclick="syncDamageFromMarks('${j.id}')"><i class="ti ti-refresh"></i> Pull ${marks.length} mark(s) from diagram</button>`:''}
      ${repairAgreed?'':`<button class="btn sec" style="margin-top:8px" onclick="addDamage('${j.id}')"><i class="ti ti-plus"></i> Add damage manually</button>`}
      <div class="rowline" style="margin-top:10px"><span class="muted">Exceed mileage</span><span>${j.exceed_km?num(j.exceed_km).toLocaleString()+' km · ':''}RM ${num(j.exceed_km_charge).toLocaleString()}</span></div>
      <div class="rowline"><span class="muted">Summons / saman</span><span>RM ${num(j.summons_charge).toLocaleString()}</span></div>
      ${repairAgreed?'':`<button class="btn sec" style="margin-top:6px" onclick="editReturnCharges('${j.id}')"><i class="ti ti-edit"></i> Edit mileage / summons</button>`}
      <div style="border-top:1px solid var(--line);margin:10px 0"></div>
      <div class="rowline"><span class="muted">Total charges</span><b>RM ${s.charges.toLocaleString()}</b></div>
      <div class="rowline"><span class="muted">Deposit held</span><span>RM ${s.dep.toLocaleString()}</span></div>
      <div class="rowline"><span class="muted">From deposit</span><span>RM ${s.deducted.toLocaleString()}</span></div>
      ${s.extra>0
        ? `<div class="rowline"><span class="muted">Extra to collect</span><b style="color:var(--amber)">RM ${s.extra.toLocaleString()}</b></div>`
        : `<div class="rowline"><span class="muted">Refund to customer</span><b style="color:var(--green)">RM ${s.refund.toLocaleString()}</b></div>`}
    </div>
    <div class="card">
      <h3>Repair agreement</h3>
      ${repairAgreed
        ? `<div class="rowline"><span class="muted">Customer agreed repair</span><b style="color:var(--green)">Agreed ✓</b></div>
           <div class="rowline"><span class="muted">Agreed on</span><span>${fmtDate(j.damage_customer_agreed_at)}</span></div>`
        : `${(dmgs.length>0||num(j.exceed_km_charge)>0||num(j.summons_charge)>0)
             ? `<div class="rowline"><span class="muted">Status</span><b style="color:var(--amber)">Waiting for customer to agree</b></div>`
             : ''}
           <button class="btn sec" style="margin-top:8px" onclick="sendDamageToCustomer('${j.id}')"><i class="ti ti-brand-whatsapp"></i> Send charges to customer to sign</button>
           <button class="btn sec" style="margin-top:8px" onclick="markDamageAgreed('${j.id}')"><i class="ti ti-check"></i> Mark agreed manually</button>
           <div class="hint" style="text-align:center;margin-top:6px">Settle deposit unlocks after the customer agrees the repair</div>`}
    </div>`;
}
function editDamage(id,idx){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const d=damageList(j)[idx]||{};
  const typeOpts=DAMAGE_TYPES.map(t=>`<option value="${t}" ${d.type===t?'selected':''}>${t}</option>`).join('');
  showModal(`
    <button class="x" onclick="openJob('${id}')">×</button>
    <h3>${d.mark_no?('Damage #'+d.mark_no):'Edit damage'}</h3>
    <label>Type</label>
    <select id="dm_type">${typeOpts}</select>
    <label>Location / where</label>
    <input id="dm_loc" value="${esc(d.loc||'')}" placeholder="e.g. front left door, rear bumper">
    <label>Cost price — GP internal (RM)</label>
    <input id="dm_cost" inputmode="decimal" value="${esc(d.cost||'')}">
    <label>Customer price — charged (RM)</label>
    <input id="dm_price" inputmode="decimal" value="${esc(d.price||'')}">
    <label>Note — shown to customer (optional)</label>
    <input id="dm_note" value="${esc(d.note||'')}" placeholder="e.g. headlamp cover cracked, needs replacing">
    <div class="hint" style="margin-top:2px">This note is included in the charges message sent to the customer.</div>
    <button class="btn" style="margin-top:14px" onclick="saveDamageEdit('${id}',${idx})"><i class="ti ti-check"></i> Save</button>
    <button class="btn danger" style="margin-top:8px" onclick="delDamage('${id}',${idx})">Remove this damage</button>
    <button class="btn sec" style="margin-top:8px" onclick="openJob('${id}')">Cancel</button>
  `);
}
async function saveDamageEdit(id,idx){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const arr=damageList(j).slice();
  const prev=arr[idx]||{};
  arr[idx]=Object.assign({}, prev, {type:$('dm_type').value, loc:($('dm_loc').value||'').trim(), cost:num($('dm_cost').value), price:num($('dm_price').value), note:($('dm_note').value||'').trim()||null});
  const res=await sb.from('gp_jobs').update({damages:arr,updated_at:new Date().toISOString()}).eq('id',id);
  if(res.error){ toast('Failed: '+res.error.message); return; }
  toast('Saved ✓'); await loadAll(); openJob(id);
}
/* create one damage row per diagram mark (numbered), keeping any existing rows */
async function syncDamageFromMarks(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const marks=returnMarks(j);
  const arr=damageList(j).slice();
  const have=arr.length;
  for(let i=have;i<marks.length;i++){
    const m=marks[i];
    const typeName=(DEFECTS[m.code]||{}).name||'New damage';
    arr.push({mark_no:i+1, type:typeName, loc:'', cost:0, price:0, note:null, x:m.x, y:m.y, code:m.code});
  }
  const res=await sb.from('gp_jobs').update({damages:arr,updated_at:new Date().toISOString()}).eq('id',id);
  if(res.error){ toast('Failed: '+res.error.message); return; }
  toast((marks.length-have)+' damage row(s) added — now set prices'); await loadAll(); openJob(id);
}
function addDamage(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const typeOpts=DAMAGE_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('');
  showModal(`
    <button class="x" onclick="openJob('${id}')">×</button>
    <h3>Add damage</h3>
    <label>Type</label>
    <select id="dm_type">${typeOpts}</select>
    <label>Location / where</label>
    <input id="dm_loc" placeholder="e.g. front left door, rear bumper">
    <label>Cost price — GP internal (RM)</label>
    <input id="dm_cost" inputmode="decimal" placeholder="what it costs GP">
    <label>Customer price — charged (RM)</label>
    <input id="dm_price" inputmode="decimal" placeholder="what customer pays">
    <label>Note — shown to customer (optional)</label>
    <input id="dm_note" placeholder="e.g. headlamp cover cracked, needs replacing">
    <div class="hint" style="margin-top:2px">This note is included in the charges message sent to the customer.</div>
    <button class="btn" style="margin-top:14px" onclick="saveDamage('${id}')"><i class="ti ti-check"></i> Add</button>
    <button class="btn sec" style="margin-top:8px" onclick="openJob('${id}')">Cancel</button>
  `);
}
async function saveDamage(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const item={type:$('dm_type').value, loc:($('dm_loc').value||'').trim(), cost:num($('dm_cost').value), price:num($('dm_price').value), note:($('dm_note').value||'').trim()||null};
  if(!item.price && !item.cost){ toast('Enter at least a customer price'); return; }
  const arr=damageList(j).slice(); arr.push(item);
  const res=await sb.from('gp_jobs').update({damages:arr,updated_at:new Date().toISOString()}).eq('id',id);
  if(res.error){ toast('Failed: '+res.error.message); return; }
  toast('Damage added ✓'); await loadAll(); openJob(id);
}
async function delDamage(id,idx){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const arr=damageList(j).slice(); arr.splice(idx,1);
  const res=await sb.from('gp_jobs').update({damages:arr,updated_at:new Date().toISOString()}).eq('id',id);
  if(res.error){ toast('Failed'); return; }
  toast('Removed'); await loadAll(); openJob(id);
}
function editReturnCharges(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  showModal(`
    <button class="x" onclick="openJob('${id}')">×</button>
    <h3>Mileage & summons charges</h3>
    ${j.mileage_given?`<div class="muted" style="font-size:12px;margin-bottom:8px">Included: ${num(j.mileage_given).toLocaleString()} km · Per km exceed: RM ${esc(j.per_km_exceed||'—')}</div>`:''}
    <label>Exceed mileage (km)</label>
    <input id="rc_km" inputmode="decimal" value="${esc(j.exceed_km||'')}" oninput="calcExceedCharge(${num(j.per_km_exceed)})">
    <label>Exceed mileage charge (RM)</label>
    <input id="rc_kmcharge" inputmode="decimal" value="${esc(j.exceed_km_charge||'')}">
    <label>Summons / saman charge (RM)</label>
    <input id="rc_summons" inputmode="decimal" value="${esc(j.summons_charge||'')}">
    <button class="btn" style="margin-top:14px" onclick="saveReturnCharges('${id}')"><i class="ti ti-check"></i> Save</button>
    <button class="btn sec" style="margin-top:8px" onclick="openJob('${id}')">Cancel</button>
  `);
}
function calcExceedCharge(perKm){ if(perKm>0){ const km=num($('rc_km').value); $('rc_kmcharge').value=Math.round(km*perKm*100)/100; } }
async function saveReturnCharges(id){
  const upd={ exceed_km:num($('rc_km').value)||null, exceed_km_charge:num($('rc_kmcharge').value)||null, summons_charge:num($('rc_summons').value)||null, updated_at:new Date().toISOString() };
  const res=await sb.from('gp_jobs').update(upd).eq('id',id);
  if(res.error){ toast('Failed'); return; }
  toast('Saved ✓'); await loadAll(); openJob(id);
}
async function markDamageAgreed(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  if(!confirm('Confirm the customer has agreed to these charges?')) return;
  const upd={ damage_customer_agreed:true, damage_customer_agreed_at:new Date().toISOString(),
    total_charges:chargesTotal(j), updated_at:new Date().toISOString() };
  const res=await sb.from('gp_jobs').update(upd).eq('id',id);
  if(res.error){ toast('Failed'); return; }
  toast('Customer agreed ✓'); await loadAll(); openJob(id);
}
function sendDamageToCustomer(id){
  const j=JOBS.find(x=>x.id===id); if(!j) return;
  const s=settlement(j);
  const lines=['*GrandPride — return charges*','Customer: '+(j.customer_name||''),(j.car_plate?('Car: '+j.car_model+' ('+j.car_plate+')'):''),''];
  damageList(j).forEach(d=>{
    lines.push('• '+(d.type||'Damage')+(d.loc?(' — '+d.loc):'')+': RM '+num(d.price).toLocaleString());
    if(d.note) lines.push('   '+d.note);
  });
  if(num(j.exceed_km_charge)>0) lines.push('• Exceed mileage'+(j.exceed_km?(' ('+num(j.exceed_km).toLocaleString()+' km)'):'')+': RM '+num(j.exceed_km_charge).toLocaleString());
  if(num(j.summons_charge)>0) lines.push('• Summons / saman: RM '+num(j.summons_charge).toLocaleString());
  lines.push('');
  lines.push('Total charges: RM '+s.charges.toLocaleString());
  lines.push('Deposit held: RM '+s.dep.toLocaleString());
  if(s.extra>0) lines.push('Extra to pay: RM '+s.extra.toLocaleString());
  else lines.push('Refund to you: RM '+s.refund.toLocaleString());
  lines.push('');
  var base=location.origin+location.pathname.replace(/[^/]*$/,'');
  var signUrl=base+'gp-damage.html?id='+encodeURIComponent(j.id);
  lines.push('Please review and sign to agree:');
  lines.push(signUrl);
  lines.push('');
  lines.push('Thank you — GrandPride.');
  const contact=(j.customer_contact||'').replace(/[^0-9]/g,'');
  const msg=lines.filter(x=>x!==null).join('\n');
  const wa=contact?('https://wa.me/6'+contact.replace(/^6/,'')+'?text='+encodeURIComponent(msg)):('https://wa.me/?text='+encodeURIComponent(msg));
  window.open(wa,'_blank');
  toast('Charges sent to customer');
}

function settleDeposit(id){
  const j=JOBS.find(x=>x.id===id);
  const s=settlement(j);
  const isCollect = s.extra>0;                 // customer pays extra vs we refund
  const methodLabel = isCollect?'Payment method (customer paid)':'Refund method';
  const slipLabel   = isCollect?'Payment slip (customer\u2019s proof)':'Refund slip (your proof)';
  const methods=['Cash','Online bank transfer','Touch \u2019n Go','USDT','International transfer','Other'];
  const methodOpts=methods.map(m=>`<option value="${m}">${m}</option>`).join('');
  showModal(`
    <button class="x" onclick="openJob('${id}')">×</button>
    <h3>Settle deposit</h3>
    <div class="card" style="padding:11px;margin-bottom:10px">
      <div class="rowline"><span class="muted">Total charges</span><b>RM ${s.charges.toLocaleString()}</b></div>
      <div class="rowline"><span class="muted">Deposit held</span><span>RM ${s.dep.toLocaleString()}</span></div>
      <div class="rowline"><span class="muted">Deducted from deposit</span><span>RM ${s.deducted.toLocaleString()}</span></div>
      ${isCollect
        ? `<div class="rowline"><span class="muted">Extra to collect</span><b style="color:var(--amber)">RM ${s.extra.toLocaleString()}</b></div>`
        : `<div class="rowline"><span class="muted">Refund to customer</span><b style="color:var(--green)">RM ${s.refund.toLocaleString()}</b></div>`}
    </div>
    ${isCollect
      ? `<div class="hint" style="margin-bottom:8px">Deposit fully used. Collect the extra RM ${s.extra.toLocaleString()} from the customer, then attach their payment slip.</div>`
      : `<div class="hint" style="margin-bottom:8px">Refund RM ${s.refund.toLocaleString()} to the customer, then attach the refund slip.</div>`}
    <label>${methodLabel}</label>
    <select id="d_method"><option value="">— select —</option>${methodOpts}</select>
    <label>Note (optional)</label>
    <input id="d_note" placeholder="e.g. Maybank ref 1234, TnG phone no.">
    <label>${slipLabel}</label>
    <input type="file" accept="image/*" id="d_slip" onchange="uploadSettleSlip(this)">
    <input type="hidden" id="d_slip_url">
    <div class="hint" id="settleSlipHint"></div>
    <label>Settle date</label>
    <input type="date" id="d_date" value="${new Date().toISOString().slice(0,10)}">
    <button class="btn" style="margin-top:14px" onclick="doSettleDeposit('${id}',${isCollect?1:0})"><i class="ti ti-check"></i> Confirm settlement</button>
    <button class="btn sec" style="margin-top:8px" onclick="openJob('${id}')">Cancel</button>
  `);
}
async function uploadSettleSlip(inp){
  const f=inp.files[0]; if(!f) return; $('settleSlipHint').textContent='Uploading…';
  try{ const fd=new FormData(); fd.append('image',f);
    const r=await fetch('https://api.imgbb.com/1/upload?key=e8dbe75e3933b7bf63be0253e1b122d6',{method:'POST',body:fd});
    const j=await r.json(); if(j&&j.data&&j.data.url){ $('d_slip_url').value=j.data.url; $('settleSlipHint').textContent='Slip attached ✓'; }
    else $('settleSlipHint').textContent='Upload failed';
  }catch(e){ $('settleSlipHint').textContent='Upload failed'; }
}
async function doSettleDeposit(id,isCollect){
  const j=JOBS.find(x=>x.id===id);
  const s=settlement(j);
  const method=$('d_method').value||'';
  if(!method){ toast('Choose a '+(isCollect?'payment':'refund')+' method'); return; }
  const slip=$('d_slip_url').value||null;
  const note=$('d_note').value||'';
  const dir = isCollect?'collect':'refund';
  const label = isCollect?('Collected extra via '+method):('Refunded via '+method);
  const upd={ stage:'deposit_settled',
    total_charges:s.charges, deposit_deducted:s.deducted, extra_to_collect:s.extra,
    deposit_refunded:s.refund, deposit_returned:s.refund, damage_deduct:s.deducted,
    settle_method:method, settle_slip:slip, settle_direction:dir,
    deposit_return_date:$('d_date').value||null, settled_at:new Date().toISOString(),
    remark: (j.remark? j.remark+'\n':'') + (label+(note?(' — '+note):'')),
    updated_at:new Date().toISOString() };
  const res=await sb.from('gp_jobs').update(upd).eq('id',id);
  if(res.error){ toast('Failed: '+res.error.message); return; }
  toast('Deposit settled ✓'); await loadAll(); openJob(id);
}
function settledSummary(j){
  const isCollect = j.settle_direction==='collect';
  const dirLabel = isCollect?'Extra collected':'Refunded to customer';
  const amt = isCollect?num(j.extra_to_collect):num(j.deposit_refunded);
  return `
    <div class="card" style="margin-top:12px">
      <h3>Deposit settled</h3>
      <div class="rowline"><span class="muted">${dirLabel}</span><b style="color:${isCollect?'var(--amber)':'var(--green)'}">RM ${amt.toLocaleString()}</b></div>
      ${j.settle_method?`<div class="rowline"><span class="muted">Method</span><span>${esc(j.settle_method)}</span></div>`:''}
      ${j.deposit_return_date?`<div class="rowline"><span class="muted">Date</span><span>${fmtDate(j.deposit_return_date)}</span></div>`:''}
      ${j.settle_slip?`<a href="${esc(j.settle_slip)}" target="_blank" class="btn sec" style="margin-top:8px;display:block;text-align:center"><i class="ti ti-photo"></i> View slip</a>`:'<div class="hint" style="margin-top:6px">No slip attached</div>'}
    </div>`;
}
async function markDone(id){
  await sb.from('gp_jobs').update({stage:'done',updated_at:new Date().toISOString()}).eq('id',id);
  toast('Job done ✓'); await loadAll(); openJob(id);
}

/* ---------- whatsapp summary ---------- */
function waSummary(id){
  const j=JOBS.find(x=>x.id===id);
  const lines=[
    '*GP Job '+(j.job_no||'')+'*',
    'Customer: '+(j.customer_name||''),
    'Service: '+svcLabel(j.service_type),
    j.car_plate?('Car: '+j.car_model+' ('+j.car_plate+')'):'',
    'Dates: '+fmtDate(j.start_date)+(j.start_time?' '+j.start_time:'')+' → '+fmtDate(j.end_date)+(j.end_time?' '+j.end_time:''),
    j.driver_name?('Driver: '+j.driver_name):'',
    'Price: RM '+num(j.price).toLocaleString(),
    'Deposit: RM '+num(j.deposit_amount).toLocaleString(),
    j.remark?('Note: '+j.remark):''
  ].filter(Boolean);
  const url='https://wa.me/?text='+encodeURIComponent(lines.join('\n'));
  window.open(url,'_blank');
}

boot();

</script>
</body>
